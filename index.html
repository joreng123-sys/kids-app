<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>歡樂學習樂園</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="歡樂學習">
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/twitter/twemoji/master/assets/72x72/1f330.png">
  <link rel="icon" href="https://raw.githubusercontent.com/twitter/twemoji/master/assets/72x72/1f330.png">

  <style>
    :root {
      --primary: #406343;
      --secondary: #5B8A72;
      --accent: #F3C68F;
      --success: #2ECC71;
      --danger: #E74C3C;
      --card-bg: rgba(255, 255, 255, 0.94);
      --text: #264653;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body {
      margin: 0;
      padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Noto Sans TC", sans-serif;
      background: url('https://images.unsplash.com/photo-1542273917363-3b1817f69a2d?auto=format&fit=crop&q=80&w=1200') no-repeat center center fixed;
      background-size: cover;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      position: relative;
    }

    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(216,243,220,0.35) 100%);
      z-index: -1;
    }

    /* 頂部導航與功能條 */
    .header-bar {
      width: 100%;
      max-width: 650px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      background: rgba(255, 255, 255, 0.92);
      padding: 6px 14px;
      border-radius: 50px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
      border: 2px solid #CAD2C5;
      gap: 6px;
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.95rem;
      font-weight: 800;
      color: #2F3E46;
      cursor: pointer;
      background: #E8F4EA;
      padding: 5px 12px;
      border-radius: 20px;
      border: 1px solid #B7D5C4;
    }

    .top-action-btns {
      display: flex;
      gap: 6px;
    }

    .action-btn {
      background: #84A98C;
      color: white;
      border: none;
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 0 #52796F;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .action-btn.gold {
      background: #E09F3E;
      box-shadow: 0 3px 0 #9E6B22;
    }

    .action-btn.playing {
      background: #E07A5F;
      box-shadow: 0 3px 0 #B0533C;
    }

    .header-nav {
      width: 100%;
      max-width: 650px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 12px;
    }

    .nav-btn {
      padding: 10px 4px;
      font-size: 0.95rem;
      font-weight: 800;
      border: 2px solid #CAD2C5;
      border-radius: 18px;
      background: #F1F4ED;
      color: var(--text);
      cursor: pointer;
      box-shadow: 0 4px 0 #BCC8B6;
      transition: all 0.1s ease;
      text-align: center;
    }

    .nav-btn.active {
      background: var(--primary);
      color: white;
      border-color: #283E2A;
      box-shadow: 0 4px 0 #1D2E1F;
      transform: translateY(2px);
    }

    .card {
      background: var(--card-bg);
      width: 100%;
      max-width: 650px;
      border-radius: 32px;
      padding: 20px 16px;
      border: 3px solid #CAD2C5;
      box-shadow: 0 12px 35px rgba(38, 70, 83, 0.16);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 480px;
      position: relative;
    }

    .score-container {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .score-board {
      font-size: 1.3rem;
      font-weight: 800;
      color: #E76F51;
    }

    .combo-badge {
      font-size: 0.95rem;
      font-weight: 800;
      color: #FFFFFF;
      background: linear-gradient(135deg, #F4A261, #E76F51);
      padding: 3px 10px;
      border-radius: 14px;
      display: none;
    }

    .rank-bar {
      font-size: 0.95rem;
      font-weight: 800;
      color: #2A9D8F;
      margin-bottom: 12px;
      background: #E8F8F5;
      padding: 4px 14px;
      border-radius: 20px;
      border: 1px dashed #A8DADC;
    }

    .question-box {
      min-height: 135px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin-bottom: 18px;
      text-align: center;
      width: 100%;
    }

    .question-title {
      font-size: 2.4rem;
      font-weight: 900;
      color: #264653;
      margin: 0;
      line-height: 1.3;
      word-break: break-word;
    }

    .audio-btn {
      background: #FFFFFF;
      color: #2A9D8F;
      border: 2px solid #2A9D8F;
      padding: 8px 18px;
      border-radius: 24px;
      font-size: 1.1rem;
      font-weight: 800;
      margin-top: 10px;
      cursor: pointer;
      box-shadow: 0 4px 0 #B3D8D3;
    }

    .options-grid {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 16px;
    }

    .option-btn {
      min-height: 90px;
      font-size: 1.65rem;
      font-weight: 800;
      border: 3px solid #E2E8DC;
      border-radius: 24px;
      background: linear-gradient(180deg, #FFFFFF 0%, #F8FAF7 100%);
      color: #2F3E46;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 7px 0 #C9D5C4;
      padding: 8px;
    }

    .option-btn:active {
      transform: translateY(5px);
      box-shadow: 0 2px 0 #C9D5C4;
    }

    .option-btn.correct {
      background: linear-gradient(180deg, #D4EDDA 0%, #A7D7C5 100%);
      border-color: #52B788;
      color: #084C2F;
    }

    .option-btn.wrong {
      background: linear-gradient(180deg, #FDE2E4 0%, #FFCAD4 100%);
      border-color: #E56B6F;
      color: #6B1D2F;
    }

    .feedback-msg {
      font-size: 1.35rem;
      font-weight: 800;
      height: 38px;
      color: #2A9D8F;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 排行榜彈窗 (Modal) */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
      padding: 20px;
    }

    .modal-card {
      background: white;
      width: 100%;
      max-width: 480px;
      border-radius: 28px;
      padding: 22px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.25);
      border: 3px solid #CAD2C5;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .modal-title {
      font-size: 1.5rem;
      font-weight: 900;
      color: #264653;
      margin-bottom: 12px;
    }

    .rank-list {
      width: 100%;
      list-style: none;
      padding: 0;
      margin: 0 0 16px 0;
    }

    .rank-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      border-radius: 14px;
      margin-bottom: 8px;
      background: #F8FAF7;
      font-size: 1.05rem;
      font-weight: 800;
      border: 1px solid #E2E8DC;
    }

    .rank-item.top-user {
      background: #FFF3CD;
      border-color: #FFE69C;
      color: #856404;
    }

    .stats-card {
      width: 100%;
      background: #F0F4F8;
      border-radius: 16px;
      padding: 12px;
      font-size: 0.95rem;
      color: #334E68;
      margin-bottom: 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      font-weight: 700;
    }

    .close-modal-btn {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 18px;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body onclick="tryAutoPlayBGM()">

  <!-- 頂部資訊列 -->
  <div class="header-bar">
    <div class="user-profile" onclick="event.stopPropagation(); changePlayerName()">
      <span>🎒 <span id="player-name-display">小探險家</span> ✏️</span>
    </div>
    
    <div class="top-action-btns">
      <button class="action-btn gold" onclick="event.stopPropagation(); openLeaderboard()">🏆 榮譽榜</button>
      <button class="action-btn" id="bgm-btn" onclick="event.stopPropagation(); toggleBGM()">🎵 音樂: 關閉</button>
    </div>
  </div>

  <!-- 科目切換 -->
  <div class="header-nav">
    <button class="nav-btn active" id="btn-math" onclick="switchSubject('math')">➕ 加減法</button>
    <button class="nav-btn" id="btn-multiply" onclick="switchSubject('multiply')">✖️ 乘法</button>
    <button class="nav-btn" id="btn-chinese" onclick="switchSubject('chinese')">🌸 國語</button>
    <button class="nav-btn" id="btn-eng" onclick="switchSubject('english')">🔤 英文</button>
  </div>

  <!-- 主卡片 -->
  <div class="card" id="main-card">
    <div class="score-container">
      <div class="score-board">⭐ 橡果星星: <span id="score">0</span></div>
      <div class="combo-badge" id="combo-badge">🔥 2 連勝!</div>
    </div>
    
    <div class="rank-bar" id="rank-bar">稱號：森林小見習生 🌿</div>

    <div class="question-box">
      <div class="question-title" id="question">載入中...</div>
      <button class="audio-btn" id="audio-btn" style="display: none;" onclick="speakCurrentQuestion()">🔊 聽題目</button>
    </div>

    <div class="options-grid" id="options"></div>

    <div class="feedback-msg" id="feedback"></div>
  </div>

  <!-- 排行榜與學習統計彈窗 -->
  <div class="modal-overlay" id="rank-modal" onclick="closeLeaderboard()">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-title">🏆 森林小英雄榮譽榜</div>
      
      <ul class="rank-list" id="rank-list-content"></ul>

      <div style="font-weight: 800; color: #2F3E46; width: 100%; margin-bottom: 6px;">📚 學習進度統計</div>
      <div class="stats-card">
        <div>➕ 加減法：<span id="stat-math">0</span> 題</div>
        <div>✖️ 九九乘法：<span id="stat-multiply">0</span> 題</div>
        <div>🌸 國小國語：<span id="stat-chinese">0</span> 題</div>
        <div>🔤 生活英文：<span id="stat-eng">0</span> 題</div>
      </div>

      <button class="close-modal-btn" onclick="closeLeaderboard()">繼續冒險！</button>
    </div>
  </div>

  <script>
    // --- 暱稱與本地統計儲存 (localStorage) ---
    let playerName = localStorage.getItem('kids_player_name') || '小寶貝';
    document.getElementById('player-name-display').innerText = playerName;

    // 分科進度累計
    let stats = JSON.parse(localStorage.getItem('kids_stats') || '{"math":0,"multiply":0,"chinese":0,"english":0}');
    let score = parseInt(localStorage.getItem('kids_stars') || '0', 10);
    let currentSubject = 'math';
    let combo = 0;
    let currentAnswer = null;
    let isProcessing = false;

    function saveStats() {
      localStorage.setItem('kids_stats', JSON.stringify(stats));
      localStorage.setItem('kids_stars', score.toString());
    }

    function changePlayerName() {
      let newName = prompt('請輸入小探險家的新名字：', playerName);
      if (newName && newName.trim()) {
        playerName = newName.trim();
        localStorage.setItem('kids_player_name', playerName);
        document.getElementById('player-name-display').innerText = playerName;
        updateRankUI();
      }
    }

    // --- 榮譽榜視窗控制 ---
    function openLeaderboard() {
      renderLeaderboard();
      document.getElementById('rank-modal').style.display = 'flex';
    }

    function closeLeaderboard() {
      document.getElementById('rank-modal').style.display = 'none';
    }

    function renderLeaderboard() {
      // 內建森林小動物對手，玩家根據自己的星星分數即時競爭
      let competitors = [
        { name: "森林守護大龍貓 🌳", score: 80 },
        { name: "活潑小松鼠 🌰", score: 35 },
        { name: "森林小鹿 🦌", score: 15 }
      ];

      // 加入玩家自己
      competitors.push({ name: `${playerName} (我)`, score: score, isUser: true });
      competitors.sort((a, b) => b.score - a.score);

      const rankListEl = document.getElementById('rank-list-content');
      rankListEl.innerHTML = '';

      competitors.forEach((item, index) => {
        const li = document.createElement('li');
        li.className = `rank-item ${item.isUser ? 'top-user' : ''}`;
        
        let medal = '🎖️';
        if (index === 0) medal = '🥇 第一名';
        else if (index === 1) medal = '🥈 第二名';
        else if (index === 2) medal = '🥉 第三名';
        else medal = `第 ${index + 1} 名`;

        li.innerHTML = `<span>${medal} ${item.name}</span><span>⭐ ${item.score}</span>`;
        rankListEl.appendChild(li);
      });

      // 更新分科數據
      document.getElementById('stat-math').innerText = stats.math;
      document.getElementById('stat-multiply').innerText = stats.multiply;
      document.getElementById('stat-chinese').innerText = stats.chinese;
      document.getElementById('stat-eng').innerText = stats.english;
    }

    // --- 題庫 ---
    const allChineseQuestions = [
      { q: "「河」的部首是什麼？", ans: "氵(水)", options: ["氵(水)", "木", "口", "日"] },
      { q: "「草」的部首是什麼？", ans: "艹(草)", options: ["艹(草)", "木", "日", "十"] },
      { q: "「花朵」的量詞要填什麼？\n一（ ）花", ans: "朵", options: ["朵", "頭", "張", "隻"] },
      { q: "「小狗」的量詞要填什麼？\n一（ ）狗", ans: "隻", options: ["隻", "朵", "條", "本"] },
      { q: "「小汽車」的量詞是？\n一（ ）車", ans: "輛", options: ["輛", "本", "片", "把"] },
      { q: "「故事書」的量詞是？\n一（ ）書", ans: "本", options: ["本", "件", "杯", "包"] },
      { q: "「雨傘」的量詞要用？\n一（ ）傘", ans: "把", options: ["把", "隻", "朵", "頭"] },
      { q: "「鉛筆」的量詞要用？\n一（ ）筆", ans: "枝", options: ["枝", "張", "片", "顆"] },
      { q: "「白」的相反詞是？", ans: "黑", options: ["黑", "紅", "亮", "高"] },
      { q: "「大」的相反詞是？", ans: "小", options: ["小", "少", "矮", "多"] },
      { q: "「多」的相反詞是？", ans: "少", options: ["少", "小", "短", "低"] },
      { q: "「高」的相反詞是？", ans: "矮", options: ["矮", "小", "瘦", "慢"] },
      { q: "「快」的相反詞是？", ans: "慢", options: ["慢", "短", "低", "矮"] },
      { q: "「長」的相反詞是？", ans: "短", options: ["短", "小", "低", "冷"] },
      { q: "「木」加「木」會變成什麼字？", ans: "林", options: ["林", "森", "本", "休"] },
      { q: "「日」加「月」會變成什麼字？", ans: "明", options: ["明", "晴", "早", "暗"] },
      { q: "「貓」的注音開頭是？", ans: "ㄇ", options: ["ㄇ", "ㄋ", "ㄈ", "ㄆ"] },
      { q: "「魚」的注音符號是？", ans: "ㄩˊ", options: ["ㄩˊ", "ㄧˊ", "ㄨˊ", "ㄚˊ"] },
      { q: "「森」字裡面共有幾個「木」？", ans: "3個", options: ["3個", "2個", "4個", "1個"] }
    ];

    const allEnglishWords = [
      { word: "Cat", zh: "貓咪" }, { word: "Dog", zh: "狗狗" }, { word: "Apple", zh: "蘋果" },
      { word: "Book", zh: "書本" }, { word: "Red", zh: "紅色" }, { word: "Blue", zh: "藍色" },
      { word: "Star", zh: "星星" }, { word: "Fish", zh: "小魚" }, { word: "Bird", zh: "小鳥" },
      { word: "Car", zh: "汽車" }, { word: "Sun", zh: "太陽" }, { word: "Moon", zh: "月亮" },
      { word: "Tree", zh: "大樹" }, { word: "Water", zh: "水" }, { word: "Milk", zh: "牛奶" },
      { word: "Egg", zh: "雞蛋" }, { word: "Banana", zh: "香蕉" }, { word: "Rabbit", zh: "兔子" }
    ];

    let remainingEnglish = [];
    function getNextEnglish() {
      if (remainingEnglish.length === 0) remainingEnglish = [...allEnglishWords].sort(() => Math.random() - 0.5);
      return remainingEnglish.pop();
    }

    let remainingChinese = [];
    function getNextChinese() {
      if (remainingChinese.length === 0) remainingChinese = [...allChineseQuestions].sort(() => Math.random() - 0.5);
      return remainingChinese.pop();
    }

    function updateRankUI() {
      document.getElementById('score').innerText = score;
      const rankBar = document.getElementById('rank-bar');
      if (score >= 50) rankBar.innerText = `稱號：${playerName} 守護大龍貓 👑✨`;
      else if (score >= 30) rankBar.innerText = `稱號：${playerName} 森林精靈 🌟`;
      else if (score >= 15) rankBar.innerText = `稱號：${playerName} 活潑小松鼠 🌰`;
      else if (score >= 5) rankBar.innerText = `稱號：${playerName} 好奇小探險 🎒`;
      else rankBar.innerText = `稱號：${playerName} 森林小見習生 🌿`;
    }

    function updateComboUI() {
      const badge = document.getElementById('combo-badge');
      if (combo >= 2) {
        badge.innerText = `🔥 ${combo} 連勝!`;
        badge.style.display = 'block';
      } else {
        badge.style.display = 'none';
      }
    }

    function speakCurrentQuestion() {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      if (currentSubject === 'english' && currentAnswer) {
        const u = new SpeechSynthesisUtterance(currentAnswer.word);
        u.lang = 'en-US';
        u.rate = 0.8;
        window.speechSynthesis.speak(u);
      } else if (currentSubject === 'chinese' && currentAnswer) {
        const u = new SpeechSynthesisUtterance(currentAnswer.q.replace('\n', '，'));
        u.lang = 'zh-TW';
        u.rate = 0.85;
        window.speechSynthesis.speak(u);
      }
    }

    // --- 背景音樂 (Web Audio API) ---
    let audioCtx = null;
    let bgmInterval = null;
    let isBgmPlaying = false;
    let hasUserInteracted = false;

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    const melody = [60, 64, 67, 72, 71, 67, 64, 62];
    let noteIndex = 0;

    function playMelodyNote() {
      if (!isBgmPlaying || !audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      const freq = 440 * Math.pow(2, (melody[noteIndex % melody.length] - 69) / 12);
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.025, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.45);
      noteIndex++;
    }

    function tryAutoPlayBGM() {
      if (hasUserInteracted) return;
      hasUserInteracted = true;
      startBGM();
    }

    function startBGM() {
      initAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      isBgmPlaying = true;
      if (bgmInterval) clearInterval(bgmInterval);
      bgmInterval = setInterval(playMelodyNote, 400);
      const btn = document.getElementById('bgm-btn');
      btn.innerText = '🎵 音樂: 開啟';
      btn.classList.add('playing');
    }

    function stopBGM() {
      isBgmPlaying = false;
      if (bgmInterval) clearInterval(bgmInterval);
      const btn = document.getElementById('bgm-btn');
      btn.innerText = '🎵 音樂: 關閉';
      btn.classList.remove('playing');
    }

    function toggleBGM() {
      hasUserInteracted = true;
      if (isBgmPlaying) stopBGM();
      else startBGM();
    }

    function switchSubject(subject) {
      currentSubject = subject;
      combo = 0;
      updateComboUI();
      document.getElementById('btn-math').className = `nav-btn ${subject === 'math' ? 'active' : ''}`;
      document.getElementById('btn-multiply').className = `nav-btn ${subject === 'multiply' ? 'active' : ''}`;
      document.getElementById('btn-chinese').className = `nav-btn ${subject === 'chinese' ? 'active' : ''}`;
      document.getElementById('btn-eng').className = `nav-btn ${subject === 'english' ? 'active' : ''}`;
      nextQuestion();
    }

    function nextQuestion() {
      isProcessing = false;
      document.getElementById('feedback').innerText = '';
      const optionsBox = document.getElementById('options');
      optionsBox.innerHTML = '';

      if (currentSubject === 'math') generateMathQuestion();
      else if (currentSubject === 'multiply') generateMultiplyQuestion();
      else if (currentSubject === 'chinese') generateChineseQuestion();
      else generateEnglishQuestion();
    }

    function generateMathQuestion() {
      document.getElementById('audio-btn').style.display = 'none';
      const isAddition = Math.random() > 0.5;
      let a, b, ans;

      if (isAddition) {
        a = Math.floor(Math.random() * 30) + 12;
        b = Math.floor(Math.random() * 20) + 8;
        ans = a + b;
        document.getElementById('question').innerText = `${a} ➕ ${b} ＝ ?`;
      } else {
        a = Math.floor(Math.random() * 40) + 20;
        b = Math.floor(Math.random() * 15) + 6;
        ans = a - b;
        document.getElementById('question').innerText = `${a} ➖ ${b} ＝ ?`;
      }

      currentAnswer = ans;
      let options = [ans];
      const offsets = [-10, 10, -1, 1];
      for (let offset of offsets) {
        let fake = ans + offset;
        if (fake > 0 && !options.includes(fake)) options.push(fake);
        if (options.length === 4) break;
      }
      while (options.length < 4) {
        let fake = ans + Math.floor(Math.random() * 9) - 4;
        if (fake > 0 && !options.includes(fake)) options.push(fake);
      }
      options.sort(() => Math.random() - 0.5);
      renderButtons(options, (val) => val === currentAnswer);
    }

    function generateMultiplyQuestion() {
      document.getElementById('audio-btn').style.display = 'none';
      const a = Math.floor(Math.random() * 8) + 2;
      const b = Math.floor(Math.random() * 9) + 1;
      const ans = a * b;
      currentAnswer = ans;
      document.getElementById('question').innerText = `${a} ✖️ ${b} ＝ ?`;

      let options = [ans];
      const offsets = [-a, a, 1, -1];
      for (let offset of offsets) {
        let fake = ans + offset;
        if (fake > 0 && !options.includes(fake)) options.push(fake);
        if (options.length === 4) break;
      }
      while (options.length < 4) {
        let fake = (Math.floor(Math.random() * 8) + 2) * (Math.floor(Math.random() * 9) + 1);
        if (!options.includes(fake)) options.push(fake);
      }
      options.sort(() => Math.random() - 0.5);
      renderButtons(options, (val) => val === currentAnswer);
    }

    function generateChineseQuestion() {
      const qData = getNextChinese();
      currentAnswer = qData;
      document.getElementById('question').innerText = qData.q;
      document.getElementById('audio-btn').style.display = 'inline-block';
      setTimeout(() => speakCurrentQuestion(), 150);
      const options = [...qData.options].sort(() => Math.random() - 0.5);
      renderButtons(options, (val) => val === currentAnswer.ans);
    }

    function generateEnglishQuestion() {
      document.getElementById('audio-btn').style.display = 'inline-block';
      const item = getNextEnglish();
      currentAnswer = item;
      document.getElementById('question').innerText = item.word;
      setTimeout(() => speakCurrentQuestion(), 150);

      let options = [item.zh];
      while (options.length < 4) {
        let fake = allEnglishWords[Math.floor(Math.random() * allEnglishWords.length)].zh;
        if (!options.includes(fake)) options.push(fake);
      }
      options.sort(() => Math.random() - 0.5);
      renderButtons(options, (val) => val === currentAnswer.zh);
    }

    function renderButtons(list, checkFn) {
      const box = document.getElementById('options');
      list.forEach(val => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = val;
        btn.onclick = (e) => {
          e.stopPropagation();
          tryAutoPlayBGM();
          handleChoice(btn, checkFn(val));
        };
        box.appendChild(btn);
      });
    }

    function handleChoice(btn, isCorrect) {
      if (isProcessing) return;
      if (isCorrect) {
        isProcessing = true;
        btn.classList.add('correct');
        combo += 1;
        updateComboUI();
        score += 1;

        // 紀錄分科題數
        if (currentSubject === 'math') stats.math += 1;
        else if (currentSubject === 'multiply') stats.multiply += 1;
        else if (currentSubject === 'chinese') stats.chinese += 1;
        else if (currentSubject === 'english') stats.english += 1;

        saveStats();
        updateRankUI();

        document.getElementById('feedback').innerText = `🎉 ${playerName} 答對了！`;
        setTimeout(() => nextQuestion(), 950);
      } else {
        btn.classList.add('wrong');
        combo = 0;
        updateComboUI();
        document.getElementById('feedback').innerText = `🍃 再試一次喔！`;
        setTimeout(() => btn.classList.remove('wrong'), 800);
      }
    }

    updateRankUI();
    nextQuestion();
  </script>
</body>
</html>
