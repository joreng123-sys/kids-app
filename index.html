<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>歡樂學習樂園 - 多人連線版</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="歡樂學習">
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/twitter/twemoji/master/assets/72x72/1f330.png">
  <link rel="icon" href="https://raw.githubusercontent.com/twitter/twemoji/master/assets/72x72/1f330.png">

  <style>
    :root {
      --primary: #406343;
      --secondary: #5B8A72;
      --accent: #F3C68F;
      --success: #2ECC71;
      --danger: #E74C3C;
      --card-bg: rgba(255, 255, 255, 0.94);
      --text: #264653;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body {
      margin: 0;
      padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Noto Sans TC", sans-serif;
      background: url('https://images.unsplash.com/photo-1542273917363-3b1817f69a2d?auto=format&fit=crop&q=80&w=1200') no-repeat center center fixed;
      background-size: cover;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      position: relative;
    }

    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(216,243,220,0.35) 100%);
      z-index: -1;
    }

    .header-bar {
      width: 100%;
      max-width: 650px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      background: rgba(255, 255, 255, 0.92);
      padding: 6px 14px;
      border-radius: 50px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
      border: 2px solid #CAD2C5;
      gap: 6px;
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.95rem;
      font-weight: 800;
      color: #2F3E46;
      cursor: pointer;
      background: #E8F4EA;
      padding: 5px 12px;
      border-radius: 20px;
      border: 1px solid #B7D5C4;
    }

    .top-action-btns {
      display: flex;
      gap: 6px;
    }

    .action-btn {
      background: #84A98C;
      color: white;
      border: none;
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 0 #52796F;
      display: flex;
      align-items: center;
      gap: 4px;
      touch-action: manipulation;
    }

    .action-btn.gold {
      background: #E09F3E;
      box-shadow: 0 3px 0 #9E6B22;
    }

    .action-btn.playing {
      background: #E07A5F;
      box-shadow: 0 3px 0 #B0533C;
    }

    .level-bar {
      width: 100%;
      max-width: 650px;
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 10px;
      background: rgba(255, 255, 255, 0.9);
      padding: 6px;
      border-radius: 24px;
      border: 2px solid #BCC8B6;
      box-shadow: 0 4px 10px rgba(0,0,0,0.04);
    }

    .level-btn {
      flex: 1;
      border: none;
      background: #E8EFE6;
      padding: 8px 6px;
      font-size: 0.92rem;
      font-weight: 800;
      color: #52796F;
      border-radius: 18px;
      cursor: pointer;
      transition: all 0.15s ease;
      touch-action: manipulation;
      text-align: center;
    }

    .level-btn.active {
      background: #406343;
      color: white;
      box-shadow: 0 3px 0 #283E2A;
      transform: translateY(1px);
    }

    .header-nav {
      width: 100%;
      max-width: 650px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 12px;
    }

    .nav-btn {
      padding: 10px 4px;
      font-size: 0.95rem;
      font-weight: 800;
      border: 2px solid #CAD2C5;
      border-radius: 18px;
      background: #F1F4ED;
      color: var(--text);
      cursor: pointer;
      box-shadow: 0 4px 0 #BCC8B6;
      transition: all 0.1s ease;
      text-align: center;
      touch-action: manipulation;
    }

    .nav-btn.active {
      background: var(--primary);
      color: white;
      border-color: #283E2A;
      box-shadow: 0 4px 0 #1D2E1F;
      transform: translateY(2px);
    }

    .card {
      background: var(--card-bg);
      width: 100%;
      max-width: 650px;
      border-radius: 32px;
      padding: 20px 16px;
      border: 3px solid #CAD2C5;
      box-shadow: 0 12px 35px rgba(38, 70, 83, 0.16);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 480px;
      position: relative;
    }

    .score-container {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .score-board {
      font-size: 1.3rem;
      font-weight: 800;
      color: #E76F51;
    }

    .combo-badge {
      font-size: 0.95rem;
      font-weight: 800;
      color: #FFFFFF;
      background: linear-gradient(135deg, #F4A261, #E76F51);
      padding: 3px 10px;
      border-radius: 14px;
      display: none;
    }

    .rank-bar {
      font-size: 0.95rem;
      font-weight: 800;
      color: #2A9D8F;
      margin-bottom: 12px;
      background: #E8F8F5;
      padding: 4px 14px;
      border-radius: 20px;
      border: 1px dashed #A8DADC;
    }

    .question-box {
      min-height: 135px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin-bottom: 18px;
      text-align: center;
      width: 100%;
    }

    .question-title {
      font-size: 2.2rem;
      font-weight: 900;
      color: #264653;
      margin: 0;
      line-height: 1.35;
      word-break: break-word;
    }

    .audio-btn {
      background: #FFFFFF;
      color: #2A9D8F;
      border: 2px solid #2A9D8F;
      padding: 8px 18px;
      border-radius: 24px;
      font-size: 1.1rem;
      font-weight: 800;
      margin-top: 10px;
      cursor: pointer;
      box-shadow: 0 4px 0 #B3D8D3;
      touch-action: manipulation;
    }

    .options-grid {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 16px;
    }

    .option-btn {
      min-height: 90px;
      font-size: 1.55rem;
      font-weight: 800;
      border: 3px solid #E2E8DC;
      border-radius: 24px;
      background: linear-gradient(180deg, #FFFFFF 0%, #F8FAF7 100%);
      color: #2F3E46;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 7px 0 #C9D5C4;
      padding: 8px 12px;
      touch-action: manipulation;
      text-align: center;
    }

    .option-btn:active {
      transform: translateY(5px);
      box-shadow: 0 2px 0 #C9D5C4;
    }

    .option-btn.correct {
      background: linear-gradient(180deg, #D4EDDA 0%, #A7D7C5 100%);
      border-color: #52B788;
      color: #084C2F;
    }

    .option-btn.wrong {
      background: linear-gradient(180deg, #FDE2E4 0%, #FFCAD4 100%);
      border-color: #E56B6F;
      color: #6B1D2F;
    }

    .feedback-msg {
      font-size: 1.35rem;
      font-weight: 800;
      height: 38px;
      color: #2A9D8F;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 榮譽榜彈窗 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
      padding: 20px;
    }

    .modal-card {
      background: white;
      width: 100%;
      max-width: 480px;
      max-height: 85vh;
      overflow-y: auto;
      border-radius: 28px;
      padding: 22px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.25);
      border: 3px solid #CAD2C5;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .modal-title {
      font-size: 1.5rem;
      font-weight: 900;
      color: #264653;
      margin-bottom: 6px;
    }

    .online-indicator {
      font-size: 0.85rem;
      color: #2ECC71;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 12px;
    }

    .online-indicator::before {
      content: "";
      width: 8px;
      height: 8px;
      background: #2ECC71;
      border-radius: 50%;
      display: inline-block;
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .rank-list {
      width: 100%;
      list-style: none;
      padding: 0;
      margin: 0 0 16px 0;
    }

    .rank-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      border-radius: 14px;
      margin-bottom: 8px;
      background: #F8FAF7;
      font-size: 1.05rem;
      font-weight: 800;
      border: 1px solid #E2E8DC;
    }

    .rank-item.top-user {
      background: #FFF3CD;
      border-color: #FFE69C;
      color: #856404;
    }

    .stats-card {
      width: 100%;
      background: #F0F4F8;
      border-radius: 16px;
      padding: 12px;
      font-size: 0.95rem;
      color: #334E68;
      margin-bottom: 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      font-weight: 700;
    }

    .close-modal-btn {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 18px;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body onclick="ensureAudioResumed()">

  <div class="header-bar">
    <div class="user-profile" onclick="event.stopPropagation(); changePlayerName()">
      <span>🎒 <span id="player-name-display">小探險家</span> ✏️</span>
    </div>
    
    <div class="top-action-btns">
      <button class="action-btn gold" onclick="event.stopPropagation(); openLeaderboard()">🏆 榮譽榜</button>
      <button class="action-btn" id="bgm-btn" onclick="event.stopPropagation(); toggleBGM()">🎵 龍貓音樂: 關閉</button>
    </div>
  </div>

  <!-- 年級難度切換列 -->
  <div class="level-bar">
    <button class="level-btn active" id="lvl-low" onclick="switchLevel('low')">🌱 低年級 (1-2年)</button>
    <button class="level-btn" id="lvl-mid" onclick="switchLevel('mid')">🌿 中年級 (3-4年)</button>
    <button class="level-btn" id="lvl-high" onclick="switchLevel('high')">🌳 高年級 (5-6年)</button>
  </div>

  <!-- 科目切換 -->
  <div class="header-nav">
    <button class="nav-btn active" id="btn-math" onclick="switchSubject('math')">➕ 加減法</button>
    <button class="nav-btn" id="btn-multiply" onclick="switchSubject('multiply')">✖️ 乘法</button>
    <button class="nav-btn" id="btn-chinese" onclick="switchSubject('chinese')">🌸 國語</button>
    <button class="nav-btn" id="btn-eng" onclick="switchSubject('english')">🔤 英文</button>
  </div>

  <div class="card" id="main-card">
    <div class="score-container">
      <div class="score-board">⭐ 橡果星星: <span id="score">0</span></div>
      <div class="combo-badge" id="combo-badge">🔥 2 連勝!</div>
    </div>
    
    <div class="rank-bar" id="rank-bar">稱號：森林小見習生 🌿</div>

    <div class="question-box">
      <div class="question-title" id="question">載入中...</div>
      <button class="audio-btn" id="audio-btn" style="display: none;" onclick="speakCurrentQuestion()">🔊 聽題目</button>
    </div>

    <div class="options-grid" id="options"></div>

    <div class="feedback-msg" id="feedback"></div>
  </div>

  <!-- 排行榜與學習統計彈窗 -->
  <div class="modal-overlay" id="rank-modal" onclick="closeLeaderboard()">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-title">🏆 森林小英雄榮譽榜</div>
      <div class="online-indicator" id="sync-status">即時雲端連線中...</div>
      
      <ul class="rank-list" id="rank-list-content"></ul>

      <div style="font-weight: 800; color: #2F3E46; width: 100%; margin-bottom: 6px;">📚 學習進度統計</div>
      <div class="stats-card">
        <div>➕ 加減法：<span id="stat-math">0</span> 題</div>
        <div>✖️ 九九乘法：<span id="stat-multiply">0</span> 題</div>
        <div>🌸 國小國語：<span id="stat-chinese">0</span> 題</div>
        <div>🔤 生活英文：<span id="stat-eng">0</span> 題</div>
      </div>

      <button class="close-modal-btn" onclick="closeLeaderboard()">繼續冒險！</button>
    </div>
  </div>

  <!-- Firebase 模組載入 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // 環境變數讀取與備用初始化
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'kids-learning-fun';
    let db = null;
    let auth = null;
    let currentUserId = null;
    let onlineUsers = [];

    async function setupFirebase() {
      if (typeof __firebase_config === 'undefined') {
        document.getElementById('sync-status').innerText = '本機單機版模式（未配置雲端金鑰）';
        document.getElementById('sync-status').style.color = '#7F8C8D';
        return;
      }

      try {
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        db = getFirestore(app);

        // 登入驗證
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }

        currentUserId = auth.currentUser?.uid || crypto.randomUUID();
        document.getElementById('sync-status').innerText = '即時多人連線同步中';

        // 監聽公用排行榜資料 (RULE 1: /artifacts/{appId}/public/data/{collectionName})
        const leaderboardCol = collection(db, 'artifacts', appId, 'public', 'data', 'leaderboard');
        onSnapshot(leaderboardCol, (snapshot) => {
          onlineUsers = [];
          snapshot.forEach((docSnap) => {
            onlineUsers.push(docSnap.data());
          });
          window.renderLeaderboard();
        }, (err) => {
          console.error("雲端排行榜同步錯誤:", err);
          document.getElementById('sync-status').innerText = '連線同步中斷，切換本機模式';
        });

        // 立即同步目前玩家資料至雲端
        window.syncScoreToCloud();
      } catch (err) {
        console.warn("Firebase 初始化跳過或失敗:", err);
        document.getElementById('sync-status').innerText = '本機練習模式';
      }
    }

    // 暴露全域同步方法
    window.syncScoreToCloud = async function() {
      if (!db || !auth || !auth.currentUser) return;
      try {
        const userDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'leaderboard', currentUserId);
        await setDoc(userDocRef, {
          userId: currentUserId,
          name: window.playerName || '小探險家',
          score: window.score || 0,
          stats: window.stats || { math: 0, multiply: 0, chinese: 0, english: 0 },
          updatedAt: Date.now()
        }, { merge: true });
      } catch (err) {
        console.error("更新雲端分數失敗:", err);
      }
    };

    window.getOnlineUsers = function() {
      return onlineUsers;
    };

    setupFirebase();
  </script>

  <!-- 應用程式主邏輯 -->
  <script>
    let playerName = localStorage.getItem('kids_player_name') || '小寶貝';
    window.playerName = playerName;
    document.getElementById('player-name-display').innerText = playerName;

    let currentLevel = localStorage.getItem('kids_grade_level') || 'low';
    let currentSubject = 'math';
    let stats = JSON.parse(localStorage.getItem('kids_stats') || '{"math":0,"multiply":0,"chinese":0,"english":0}');
    let score = parseInt(localStorage.getItem('kids_stars') || '0', 10);
    window.stats = stats;
    window.score = score;

    let combo = 0;
    let currentAnswer = null;
    let isProcessing = false;

    function saveStats() {
      localStorage.setItem('kids_stats', JSON.stringify(stats));
      localStorage.setItem('kids_stars', score.toString());
      window.stats = stats;
      window.score = score;
      if (window.syncScoreToCloud) {
        window.syncScoreToCloud();
      }
    }

    function changePlayerName() {
      let newName = prompt('請輸入小探險家的新名字：', playerName);
      if (newName && newName.trim()) {
        playerName = newName.trim();
        window.playerName = playerName;
        localStorage.setItem('kids_player_name', playerName);
        document.getElementById('player-name-display').innerText = playerName;
        updateRankUI();
        if (window.syncScoreToCloud) {
          window.syncScoreToCloud();
        }
      }
    }

    function openLeaderboard() {
      renderLeaderboard();
      document.getElementById('rank-modal').style.display = 'flex';
    }

    function closeLeaderboard() {
      document.getElementById('rank-modal').style.display = 'none';
    }

    window.renderLeaderboard = function() {
      let cloudUsers = window.getOnlineUsers ? window.getOnlineUsers() : [];
      let list = [];

      if (cloudUsers && cloudUsers.length > 0) {
        // 使用真實雲端即時連線玩家
        list = cloudUsers.map(u => ({
          name: u.name,
          score: u.score || 0,
          isUser: u.name === playerName
        }));
      } else {
        // 預設小精靈對手
        list = [
          { name: "森林守護大龍貓 🌳", score: 80, isUser: false },
          { name: "活潑小松鼠 🌰", score: 35, isUser: false },
          { name: "森林小鹿 🦌", score: 15, isUser: false },
          { name: `${playerName} (我)`, score: score, isUser: true }
        ];
      }

      // 依分數從高到低排名
      list.sort((a, b) => b.score - a.score);

      const rankListEl = document.getElementById('rank-list-content');
      rankListEl.innerHTML = '';
      list.forEach((item, index) => {
        const li = document.createElement('li');
        li.className = `rank-item ${item.isUser ? 'top-user' : ''}`;
        let medal = index === 0 ? '🥇 第一名' : index === 1 ? '🥈 第二名' : index === 2 ? '🥉 第三名' : `第 ${index + 1} 名`;
        li.innerHTML = `<span>${medal} ${item.name}</span><span>⭐ ${item.score}</span>`;
        rankListEl.appendChild(li);
      });

      document.getElementById('stat-math').innerText = stats.math;
      document.getElementById('stat-multiply').innerText = stats.multiply;
      document.getElementById('stat-chinese').innerText = stats.chinese;
      document.getElementById('stat-eng').innerText = stats.english;
    };

    // 臺灣 108 課綱：分級國文題庫
    const chineseDB = {
      low: [
        { q: "「河」的部首是什麼？", ans: "氵(水)", options: ["氵(水)", "木", "口", "日"] },
        { q: "「草」的部首是什麼？", ans: "艹(草)", options: ["艹(草)", "木", "日", "十"] },
        { q: "一（ ）花", ans: "朵", options: ["朵", "頭", "張", "隻"] },
        { q: "一（ ）小狗", ans: "隻", options: ["隻", "朵", "條", "本"] },
        { q: "一（ ）汽車", ans: "輛", options: ["輛", "本", "片", "把"] },
        { q: "一（ ）鉛筆", ans: "枝", options: ["枝", "張", "片", "顆"] },
        { q: "一（ ）雨傘", ans: "把", options: ["把", "隻", "朵", "頭"] },
        { q: "「白」的相反詞是？", ans: "黑", options: ["黑", "紅", "亮", "高"] },
        { q: "「大」的相反詞是？", ans: "小", options: ["小", "少", "矮", "多"] },
        { q: "「高」的相反詞是？", ans: "矮", options: ["矮", "小", "瘦", "慢"] },
        { q: "「快」的相反詞是？", ans: "慢", options: ["慢", "短", "低", "矮"] },
        { q: "「長」的相反詞是？", ans: "短", options: ["短", "小", "低", "冷"] },
        { q: "「日」加「月」是？", ans: "明", options: ["明", "晴", "早", "暗"] },
        { q: "「木」加「木」是？", ans: "林", options: ["林", "森", "本", "休"] },
        { q: "「魚」的注音符號是？", ans: "ㄩˊ", options: ["ㄩˊ", "ㄧˊ", "ㄨˊ", "ㄚˊ"] },
        { q: "「貓」的注音開頭是？", ans: "ㄇ", options: ["ㄇ", "ㄋ", "ㄈ", "ㄆ"] },
        { q: "「風」的注音是？", ans: "ㄈㄥ", options: ["ㄈㄥ", "ㄏㄥ", "ㄉㄥ", "ㄅㄥ"] },
        { q: "「森」裡面有幾個木？", ans: "3個", options: ["3個", "2個", "4個", "1個"] }
      ],
      mid: [
        { q: "「守株待（ ）」填入動物名？", ans: "兔", options: ["兔", "牛", "羊", "鳥"] },
        { q: "「畫（ ）點睛」填入動物名？", ans: "龍", options: ["龍", "蛇", "馬", "虎"] },
        { q: "「一石二（ ）」填入哪一字？", ans: "鳥", options: ["鳥", "魚", "兔", "狗"] },
        { q: "「亡羊補（ ）」代表及時補救？", ans: "牢", options: ["牢", "屋", "門", "牆"] },
        { q: "「落」落大方的讀音是？", ans: "ㄌㄨㄛˋ", options: ["ㄌㄨㄛˋ", "ㄌㄚˋ", "ㄌㄠˋ", "ㄌㄜˋ"] },
        { q: "銀「行」的「行」讀音是？", ans: "ㄏㄤˊ", options: ["ㄏㄤˊ", "ㄒㄧㄥˊ", "ㄒㄧㄥˋ", "ㄏㄤˋ"] },
        { q: "形容「水流很急」的成語？", ans: "波濤洶湧", options: ["波濤洶湧", "心平氣和", "微風徐徐", "井井有條"] },
        { q: "形容「很有禮貌、守秩序」？", ans: "彬彬有禮", options: ["彬彬有禮", "粗枝大葉", "亂七八糟", "毛手毛腳"] },
        { q: "一（ ）宏偉的橋梁", ans: "座", options: ["座", "面", "條", "架"] },
        { q: "一（ ）精彩的電影", ans: "部", options: ["部", "件", "首", "副"] },
        { q: "「月亮像個大銀盤」使用了什麼修辭？", ans: "譬喻(比喻)", options: ["譬喻(比喻)", "擬人", "排比", "誇飾"] },
        { q: "「花兒在風中跳舞」使用了什麼修辭？", ans: "擬人", options: ["擬人", "譬喻", "對偶", "倒反"] }
      ],
      high: [
        { q: "「破釜沉舟」代表什麼意思？", ans: "下定決心不留退路", options: ["下定決心不留退路", "打破飯鍋浪費糧食", "乘坐沉沒的船隻", "做事猶豫不決"] },
        { q: "「臥薪嘗膽」與哪位歷史人物有關？", ans: "勾踐", options: ["勾踐", "項羽", "劉備", "諸葛亮"] },
        { q: "「三顧茅廬」比喻真心誠意邀請？", ans: "諸葛亮", options: ["諸葛亮", "周瑜", "曹操", "孫權"] },
        { q: "「出類拔（ ）」形容超越同類？", ans: "萃", options: ["萃", "翠", "碎", "粹"] },
        { q: "「（ ）然開朗」填入正確國字？", ans: "豁", options: ["豁", "闊", "和", "賀"] },
        { q: "「塞翁失馬，焉知非（ ）」？", ans: "福", options: ["福", "禍", "利", "吉"] },
        { q: "（ ）困難再大，我們（ ）要克服。", ans: "即使...也...", options: ["即使...也...", "因為...所以...", "雖然...但是...", "不但...而且..."] },
        { q: "「迫不及待」中的「待」意思是？", ans: "等待", options: ["等待", "招待", "待遇", "對待"] },
        { q: "形容文章結構完整、毫無破綻？", ans: "天衣無縫", options: ["天衣無縫", "畫蛇添足", "斷章取義", "漏洞百出"] },
        { q: "「不入虎穴，焉得虎（ ）」？", ans: "子", options: ["子", "肉", "皮", "膽"] }
      ]
    };

    // 臺灣 108 課綱：分級英語單字庫
    const englishDB = {
      low: [
        { word: "Cat", zh: "貓咪" }, { word: "Dog", zh: "狗狗" }, { word: "Apple", zh: "蘋果" },
        { word: "Book", zh: "書本" }, { word: "Red", zh: "紅色" }, { word: "Blue", zh: "藍色" },
        { word: "Star", zh: "星星" }, { word: "Fish", zh: "小魚" }, { word: "Bird", zh: "小鳥" },
        { word: "Car", zh: "汽車" }, { word: "Sun", zh: "太陽" }, { word: "Moon", zh: "月亮" },
        { word: "Tree", zh: "大樹" }, { word: "Milk", zh: "牛奶" }, { word: "Egg", zh: "雞蛋" },
        { word: "Hand", zh: "手" }, { word: "Eye", zh: "眼睛" }, { word: "Nose", zh: "鼻子" }
      ],
      mid: [
        { word: "Teacher", zh: "老師" }, { word: "Student", zh: "學生" }, { word: "School", zh: "學校" },
        { word: "Friend", zh: "朋友" }, { word: "Family", zh: "家庭" }, { word: "Yellow", zh: "黃色" },
        { word: "Orange", zh: "柳橙/橘色" }, { word: "Water", zh: "水" }, { word: "Music", zh: "音樂" },
        { word: "Play", zh: "玩耍/演奏" }, { word: "Run", zh: "跑步" }, { word: "Jump", zh: "跳躍" },
        { word: "Summer", zh: "夏天" }, { word: "Winter", zh: "冬天" }, { word: "Rainy", zh: "下雨的" },
        { word: "Sunny", zh: "晴朗的" }, { word: "Monday", zh: "星期一" }, { word: "Sunday", zh: "星期日" }
      ],
      high: [
        { word: "Brave", zh: "勇敢的" }, { word: "Honest", zh: "誠實的" }, { word: "Nature", zh: "大自然" },
        { word: "Future", zh: "未來" }, { word: "Science", zh: "科學" }, { word: "History", zh: "歷史" },
        { word: "Planet", zh: "行星/地球" }, { word: "Energy", zh: "能源/活力" }, { word: "Doctor", zh: "醫生" },
        { word: "Police", zh: "警察" }, { word: "Protect", zh: "保護" }, { word: "Discover", zh: "發現/探索" },
        { word: "Dream", zh: "夢想" }, { word: "Memory", zh: "回憶/記憶" }, { word: "Peace", zh: "和平" },
        { word: "Success", zh: "成功" }, { word: "Travel", zh: "旅行" }, { word: "Imagine", zh: "想像" }
      ]
    };

    let bags = {
      chinese: { low: [], mid: [], high: [] },
      english: { low: [], mid: [], high: [] }
    };

    function getNextChineseItem() {
      let pool = bags.chinese[currentLevel];
      if (!pool || pool.length === 0) {
        bags.chinese[currentLevel] = [...chineseDB[currentLevel]].sort(() => Math.random() - 0.5);
      }
      return bags.chinese[currentLevel].pop();
    }

    function getNextEnglishItem() {
      let pool = bags.english[currentLevel];
      if (!pool || pool.length === 0) {
        bags.english[currentLevel] = [...englishDB[currentLevel]].sort(() => Math.random() - 0.5);
      }
      return bags.english[currentLevel].pop();
    }

    function switchLevel(level) {
      currentLevel = level;
      localStorage.setItem('kids_grade_level', level);
      document.getElementById('lvl-low').className = `level-btn ${level === 'low' ? 'active' : ''}`;
      document.getElementById('lvl-mid').className = `level-btn ${level === 'mid' ? 'active' : ''}`;
      document.getElementById('lvl-high').className = `level-btn ${level === 'high' ? 'active' : ''}`;
      nextQuestion();
    }

    function switchSubject(subject) {
      ensureAudioResumed();
      currentSubject = subject;
      combo = 0;
      updateComboUI();
      document.getElementById('btn-math').className = `nav-btn ${subject === 'math' ? 'active' : ''}`;
      document.getElementById('btn-multiply').className = `nav-btn ${subject === 'multiply' ? 'active' : ''}`;
      document.getElementById('btn-chinese').className = `nav-btn ${subject === 'chinese' ? 'active' : ''}`;
      document.getElementById('btn-eng').className = `nav-btn ${subject === 'english' ? 'active' : ''}`;
      nextQuestion();
    }

    function updateRankUI() {
      document.getElementById('score').innerText = score;
      const rankBar = document.getElementById('rank-bar');
      if (score >= 50) rankBar.innerText = `稱號：${playerName} 守護大龍貓 👑✨`;
      else if (score >= 30) rankBar.innerText = `稱號：${playerName} 森林精靈 🌟`;
      else if (score >= 15) rankBar.innerText = `稱號：${playerName} 活潑小松鼠 🌰`;
      else if (score >= 5) rankBar.innerText = `稱號：${playerName} 好奇小探險 🎒`;
      else rankBar.innerText = `稱號：${playerName} 森林小見習生 🌿`;
    }

    function updateComboUI() {
      const badge = document.getElementById('combo-badge');
      if (combo >= 2) {
        badge.innerText = `🔥 ${combo} 連勝!`;
        badge.style.display = 'block';
      } else {
        badge.style.display = 'none';
      }
    }

    function speakCurrentQuestion() {
      ensureAudioResumed();
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      if (currentSubject === 'english' && currentAnswer) {
        const u = new SpeechSynthesisUtterance(currentAnswer.word);
        u.lang = 'en-US';
        u.rate = 0.8;
        window.speechSynthesis.speak(u);
      } else if (currentSubject === 'chinese' && currentAnswer) {
        const u = new SpeechSynthesisUtterance(currentAnswer.q.replace('\n', '，'));
        u.lang = 'zh-TW';
        u.rate = 0.85;
        window.speechSynthesis.speak(u);
      }
    }

    const totoroMelody = [
      { note: 67, dur: 0.35 }, { note: 69, dur: 0.35 }, { note: 71, dur: 0.7 },
      { note: 67, dur: 0.35 }, { note: 69, dur: 0.35 }, { note: 71, dur: 0.7 },
      { note: 72, dur: 0.35 }, { note: 71, dur: 0.35 }, { note: 69, dur: 0.35 }, { note: 67, dur: 0.35 },
      { note: 65, dur: 0.7 },  { note: 67, dur: 0.7 },
      { note: 67, dur: 0.35 }, { note: 69, dur: 0.35 }, { note: 71, dur: 0.7 },
      { note: 67, dur: 0.35 }, { note: 69, dur: 0.35 }, { note: 71, dur: 0.7 },
      { note: 72, dur: 0.35 }, { note: 74, dur: 0.35 }, { note: 76, dur: 0.7 },
      { note: 74, dur: 0.35 }, { note: 72, dur: 0.35 }, { note: 71, dur: 0.7 },
      { note: 69, dur: 0.7 },  { note: 67, dur: 1.0 }
    ];

    let audioCtx = null;
    let bgmTimer = null;
    let isBgmPlaying = false;
    let melodyIndex = 0;

    function getAudioContext() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      return audioCtx;
    }

    function ensureAudioResumed() {
      const ctx = getAudioContext();
      if (ctx.state === 'suspended') ctx.resume();
    }

    function playTotoroNote(midiNote, duration) {
      if (!isBgmPlaying) return;
      const ctx = getAudioContext();
      if (ctx.state === 'suspended') ctx.resume();

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = 'triangle';
      const freq = 440 * Math.pow(2, (midiNote - 69) / 12);
      osc.frequency.setValueAtTime(freq, ctx.currentTime);

      gain.gain.setValueAtTime(0, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.08, ctx.currentTime + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration + 0.05);

      if (midiNote === 67 || midiNote === 72) {
        const bassOsc = ctx.createOscillator();
        const bassGain = ctx.createGain();
        bassOsc.type = 'sine';
        bassOsc.frequency.setValueAtTime(440 * Math.pow(2, (midiNote - 12 - 69) / 12), ctx.currentTime);
        bassGain.gain.setValueAtTime(0.04, ctx.currentTime);
        bassGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);
        bassOsc.connect(bassGain);
        bassGain.connect(ctx.destination);
        bassOsc.start();
        bassOsc.stop(ctx.currentTime + 0.85);
      }
    }

    function stepTotoro() {
      if (!isBgmPlaying) return;
      const current = totoroMelody[melodyIndex % totoroMelody.length];
      playTotoroNote(current.note, current.dur);
      melodyIndex++;
      bgmTimer = setTimeout(stepTotoro, current.dur * 1000);
    }

    function startBGM() {
      ensureAudioResumed();
      isBgmPlaying = true;
      melodyIndex = 0;
      if (bgmTimer) clearTimeout(bgmTimer);
      stepTotoro();
      const btn = document.getElementById('bgm-btn');
      btn.innerText = '🎵 龍貓音樂: 播放中';
      btn.classList.add('playing');
    }

    function stopBGM() {
      isBgmPlaying = false;
      if (bgmTimer) clearTimeout(bgmTimer);
      const btn = document.getElementById('bgm-btn');
      btn.innerText = '🎵 龍貓音樂: 關閉';
      btn.classList.remove('playing');
    }

    function toggleBGM() {
      ensureAudioResumed();
      if (isBgmPlaying) stopBGM();
      else startBGM();
    }

    function nextQuestion() {
      isProcessing = false;
      document.getElementById('feedback').innerText = '';
      const optionsBox = document.getElementById('options');
      optionsBox.innerHTML = '';

      if (currentSubject === 'math') generateMathQuestion();
      else if (currentSubject === 'multiply') generateMultiplyQuestion();
      else if (currentSubject === 'chinese') generateChineseQuestion();
      else generateEnglishQuestion();
    }

    function generateMathQuestion() {
      document.getElementById('audio-btn').style.display = 'none';
      const isAddition = Math.random() > 0.5;
      let a, b, ans;

      if (currentLevel === 'low') {
        if (isAddition) {
          a = Math.floor(Math.random() * 12) + 5;
          b = Math.floor(Math.random() * 8) + 3;
          ans = a + b;
          document.getElementById('question').innerText = `${a} ➕ ${b} ＝ ?`;
        } else {
          a = Math.floor(Math.random() * 12) + 8;
          b = Math.floor(Math.random() * (a - 2)) + 1;
          ans = a - b;
          document.getElementById('question').innerText = `${a} ➖ ${b} ＝ ?`;
        }
      } else if (currentLevel === 'mid') {
        if (isAddition) {
          a = Math.floor(Math.random() * 45) + 18;
          b = Math.floor(Math.random() * 35) + 12;
          ans = a + b;
          document.getElementById('question').innerText = `${a} ➕ ${b} ＝ ?`;
        } else {
          a = Math.floor(Math.random() * 50) + 35;
          b = Math.floor(Math.random() * 25) + 14;
          ans = a - b;
          document.getElementById('question').innerText = `${a} ➖ ${b} ＝ ?`;
        }
      } else {
        if (isAddition) {
          a = Math.floor(Math.random() * 350) + 125;
          b = Math.floor(Math.random() * 250) + 98;
          ans = a + b;
          document.getElementById('question').innerText = `${a} ➕ ${b} ＝ ?`;
        } else {
          a = Math.floor(Math.random() * 400) + 300;
          b = Math.floor(Math.random() * 200) + 85;
          ans = a - b;
          document.getElementById('question').innerText = `${a} ➖ ${b} ＝ ?`;
        }
      }

      currentAnswer = ans;
      let options = [ans];
      const offsets = [-10, 10, -1, 1];
      for (let offset of offsets) {
        let fake = ans + offset;
        if (fake > 0 && !options.includes(fake)) options.push(fake);
        if (options.length === 4) break;
      }
      while (options.length < 4) {
        let fake = ans + Math.floor(Math.random() * 11) - 5;
        if (fake > 0 && !options.includes(fake)) options.push(fake);
      }
      options.sort(() => Math.random() - 0.5);
      renderButtons(options, (val) => val === currentAnswer);
    }

    function generateMultiplyQuestion() {
      document.getElementById('audio-btn').style.display = 'none';
      let a, b;
      if (currentLevel === 'low') {
        a = Math.floor(Math.random() * 4) + 2;
        b = Math.floor(Math.random() * 9) + 1;
      } else if (currentLevel === 'mid') {
        a = Math.floor(Math.random() * 8) + 2;
        b = Math.floor(Math.random() * 9) + 1;
      } else {
        a = Math.floor(Math.random() * 15) + 11;
        b = Math.floor(Math.random() * 7) + 3;
      }
      const ans = a * b;
      currentAnswer = ans;
      document.getElementById('question').innerText = `${a} ✖️ ${b} ＝ ?`;

      let options = [ans];
      const offsets = [-a, a, 1, -1];
      for (let offset of offsets) {
        let fake = ans + offset;
        if (fake > 0 && !options.includes(fake)) options.push(fake);
        if (options.length === 4) break;
      }
      while (options.length < 4) {
        let fake = (Math.floor(Math.random() * 8) + 2) * (Math.floor(Math.random() * 9) + 1);
        if (!options.includes(fake)) options.push(fake);
      }
      options.sort(() => Math.random() - 0.5);
      renderButtons(options, (val) => val === currentAnswer);
    }

    function generateChineseQuestion() {
      const qData = getNextChineseItem();
      currentAnswer = qData;
      document.getElementById('question').innerText = qData.q;
      document.getElementById('audio-btn').style.display = 'inline-block';
      setTimeout(() => speakCurrentQuestion(), 150);
      const options = [...qData.options].sort(() => Math.random() - 0.5);
      renderButtons(options, (val) => val === currentAnswer.ans);
    }

    function generateEnglishQuestion() {
      document.getElementById('audio-btn').style.display = 'inline-block';
      const item = getNextEnglishItem();
      currentAnswer = item;
      document.getElementById('question').innerText = item.word;
      setTimeout(() => speakCurrentQuestion(), 150);

      const fullList = englishDB[currentLevel];
      let options = [item.zh];
      while (options.length < 4) {
        let fake = fullList[Math.floor(Math.random() * fullList.length)].zh;
        if (!options.includes(fake)) options.push(fake);
      }
      options.sort(() => Math.random() - 0.5);
      renderButtons(options, (val) => val === currentAnswer.zh);
    }

    function renderButtons(list, checkFn) {
      const box = document.getElementById('options');
      list.forEach(val => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = val;
        btn.onclick = (e) => {
          e.stopPropagation();
          ensureAudioResumed();
          handleChoice(btn, checkFn(val));
        };
        box.appendChild(btn);
      });
    }

    function handleChoice(btn, isCorrect) {
      if (isProcessing) return;
      if (isCorrect) {
        isProcessing = true;
        btn.classList.add('correct');
        combo += 1;
        updateComboUI();
        score += 1;

        if (currentSubject === 'math') stats.math += 1;
        else if (currentSubject === 'multiply') stats.multiply += 1;
        else if (currentSubject === 'chinese') stats.chinese += 1;
        else if (currentSubject === 'english') stats.english += 1;

        saveStats();
        updateRankUI();

        document.getElementById('feedback').innerText = `🎉 ${playerName} 答對了！`;
        setTimeout(() => nextQuestion(), 950);
      } else {
        btn.classList.add('wrong');
        combo = 0;
        updateComboUI();
        document.getElementById('feedback').innerText = `🍃 再試一次喔！`;
        setTimeout(() => btn.classList.remove('wrong'), 800);
      }
    }

    // 初始化狀態
    switchLevel(currentLevel);
    updateRankUI();
  </script>
