<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>歡樂學習樂園</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="歡樂學習">
  <link rel="apple-touch-icon" sizes="180x180" href="https://img.icons8.com/color/180/my-little-pony.png">
  <link rel="icon" href="https://img.icons8.com/color/180/my-little-pony.png">

  <style>
    :root {
      --primary: #5A3E85;
      --secondary: #8E6BB8;
      --accent: #F3C68F;
      --success: #2ECC71;
      --danger: #E74C3C;
      --card-bg: rgba(255, 255, 255, 0.95);
      --text: #264653;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body {
      margin: 0;
      padding: 10px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Noto Sans TC", sans-serif;
      background: url('https://images.unsplash.com/photo-1542273917363-3b1817f69a2d?auto=format&fit=crop&q=80&w=1200') no-repeat center center fixed;
      background-size: cover;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, rgba(240,230,255,0.35) 100%);
      z-index: -1;
    }

    .header-bar {
      width: 100%;
      max-width: 680px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      background: rgba(255, 255, 255, 0.94);
      padding: 6px 14px;
      border-radius: 50px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
      border: 3px solid #D1C4E9;
      gap: 6px;
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.95rem;
      font-weight: 800;
      color: #3F2B63;
      cursor: pointer;
      background: #F3E8FF;
      padding: 6px 12px;
      border-radius: 20px;
      border: 2px solid #D8B4FE;
    }

    .top-action-btns {
      display: flex;
      gap: 6px;
    }

    .action-btn {
      background: #8E6BB8;
      color: white;
      border: none;
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 0.85rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 3px 0 #5A3E85;
      display: flex;
      align-items: center;
      gap: 4px;
      touch-action: manipulation;
    }

    .action-btn.gold {
      background: #E09F3E;
      box-shadow: 0 3px 0 #9E6B22;
    }

    .action-btn.playing {
      background: #D946EF;
      box-shadow: 0 3px 0 #A21CAF;
    }

    .level-bar {
      width: 100%;
      max-width: 680px;
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 8px;
      background: rgba(255, 255, 255, 0.92);
      padding: 5px;
      border-radius: 26px;
      border: 2.5px solid #D1C4E9;
      box-shadow: 0 4px 10px rgba(0,0,0,0.04);
    }

    .level-btn {
      flex: 1;
      border: none;
      background: #F5F0FA;
      padding: 7px 4px;
      font-size: 0.88rem;
      font-weight: 800;
      color: #6B46C1;
      border-radius: 18px;
      cursor: pointer;
      transition: all 0.15s ease;
      touch-action: manipulation;
      text-align: center;
    }

    .level-btn.active {
      background: #6B46C1;
      color: white;
      box-shadow: 0 3px 0 #4C1D95;
      transform: translateY(1px);
    }

    /* 科目與賽馬導航列 (7列按鈕) */
    .header-nav {
      width: 100%;
      max-width: 680px;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      margin-bottom: 10px;
    }

    .nav-btn {
      padding: 8px 1px;
      font-size: 0.82rem;
      font-weight: 900;
      border: 2px solid #D1C4E9;
      border-radius: 16px;
      background: #FAF8FC;
      color: var(--text);
      cursor: pointer;
      box-shadow: 0 3px 0 #C4B5FD;
      transition: all 0.1s ease;
      text-align: center;
      touch-action: manipulation;
      white-space: nowrap;
    }

    .nav-btn.active {
      background: var(--primary);
      color: white;
      border-color: #3B2166;
      box-shadow: 0 3px 0 #281647;
      transform: translateY(2px);
    }

    .nav-btn.race-mode-btn {
      background: linear-gradient(135deg, #EC4899, #8B5CF6);
      color: white;
      border-color: #BE185D;
      box-shadow: 0 3px 0 #831843;
    }

    .card {
      background: var(--card-bg);
      width: 100%;
      max-width: 680px;
      border-radius: 36px;
      padding: 18px 16px;
      border: 3.5px solid #D1C4E9;
      box-shadow: 0 14px 38px rgba(90, 62, 133, 0.18);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 490px;
      position: relative;
    }

    .score-container {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .score-board {
      font-size: 1.35rem;
      font-weight: 900;
      color: #D97706;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .combo-badge {
      font-size: 0.95rem;
      font-weight: 900;
      color: #FFFFFF;
      background: linear-gradient(135deg, #F4A261, #E76F51);
      padding: 4px 12px;
      border-radius: 16px;
      display: none;
    }

    /* ==========================================
       🏁 彩虹小馬 5 匹馬競賽跑道動畫區
       ========================================== */
    .race-track-container {
      width: 100%;
      background: linear-gradient(180deg, #E0F2FE 0%, #BAE6FD 100%);
      border: 3px solid #7DD3FC;
      border-radius: 24px;
      padding: 10px 12px;
      margin-bottom: 14px;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.06);
      display: none; /* 平常隱藏，比賽模式顯示 */
      position: relative;
    }

    .race-status-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.95rem;
      font-weight: 900;
      color: #0369A1;
      margin-bottom: 6px;
    }

    .race-lane {
      position: relative;
      height: 38px;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 20px;
      margin-bottom: 6px;
      border: 1.5px dashed #93C5FD;
      display: flex;
      align-items: center;
      padding: 0 4px;
      overflow: hidden;
    }

    .race-lane.player-lane {
      background: #F3E8FF;
      border: 2px solid #C084FC;
    }

    .finish-line {
      position: absolute;
      right: 12px;
      top: 0; bottom: 0;
      width: 12px;
      background: repeating-linear-gradient(45deg, #000, #000 4px, #fff 4px, #fff 8px);
      z-index: 1;
      opacity: 0.6;
    }

    .pony-runner {
      position: absolute;
      left: 2%;
      font-size: 1.6rem;
      transition: left 0.6s cubic-bezier(0.25, 1, 0.5, 1);
      display: flex;
      align-items: center;
      z-index: 2;
    }

    .pony-runner.turbo {
      animation: turboGlow 0.6s ease;
    }

    @keyframes turboGlow {
      0% { transform: scale(1); filter: drop-shadow(0 0 2px #EC4899); }
      50% { transform: scale(1.3) translateX(8px); filter: drop-shadow(0 0 10px #EC4899); }
      100% { transform: scale(1); filter: none; }
    }

    .pony-name-tag {
      font-size: 0.72rem;
      font-weight: 900;
      margin-left: 2px;
      white-space: nowrap;
    }

    .question-box {
      width: 100%;
      min-height: 135px;
      background: linear-gradient(180deg, #FFFDF8 0%, #FAF5FF 100%);
      border: 3px solid #D8B4FE;
      border-radius: 28px;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.03), 0 6px 0 #C4B5FD;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 14px 12px;
      margin-bottom: 16px;
      position: relative;
    }

    .question-box::before { content: "✨"; position: absolute; top: -12px; left: 16px; font-size: 1.5rem; }
    .question-box::after { content: "🦄"; position: absolute; bottom: -10px; right: 18px; font-size: 1.5rem; }

    .question-title {
      font-size: 2.2rem;
      font-weight: 900;
      color: #2F1E4B;
      margin: 0;
      line-height: 1.35;
      text-align: center;
      word-break: break-word;
    }

    .audio-btn {
      background: #FFFFFF;
      color: #6B46C1;
      border: 2px solid #6B46C1;
      padding: 7px 18px;
      border-radius: 24px;
      font-size: 1.05rem;
      font-weight: 900;
      margin-top: 10px;
      cursor: pointer;
      box-shadow: 0 4px 0 #D8B4FE;
      touch-action: manipulation;
    }

    .options-grid {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 14px;
    }

    .option-btn {
      min-height: 95px;
      font-size: 1.6rem;
      font-weight: 900;
      border-radius: 26px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 8px 12px;
      touch-action: manipulation;
      text-align: center;
      transition: all 0.12s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .option-btn.pic-mode { font-size: 3rem; }

    .option-btn:nth-child(1) { background: linear-gradient(180deg, #FFF9EB 0%, #FEEDCE 100%); border: 3px solid #E6BA80; color: #6C4918; box-shadow: 0 7px 0 #CCA167; }
    .option-btn:nth-child(2) { background: linear-gradient(180deg, #F0FBF7 0%, #D8F5E9 100%); border: 3px solid #84D7B5; color: #17573E; box-shadow: 0 7px 0 #6ABE9C; }
    .option-btn:nth-child(3) { background: linear-gradient(180deg, #F5F3FF 0%, #EDE9FE 100%); border: 3px solid #C4B5FD; color: #5B21B6; box-shadow: 0 7px 0 #A78BFA; }
    .option-btn:nth-child(4) { background: linear-gradient(180deg, #FFF4F4 0%, #FFE0E0 100%); border: 3px solid #F3A8A8; color: #7D2626; box-shadow: 0 7px 0 #DA8989; }

    .option-btn:active { transform: translateY(5px); box-shadow: 0 2px 0 rgba(0,0,0,0.2) !important; }
    .option-btn.correct { background: linear-gradient(180deg, #D4EDDA 0%, #A7D7C5 100%) !important; border-color: #52B788 !important; color: #084C2F !important; box-shadow: 0 7px 0 #40916C !important; }
    .option-btn.wrong { background: linear-gradient(180deg, #FDE2E4 0%, #FFCAD4 100%) !important; border-color: #E56B6F !important; color: #6B1D2F !important; box-shadow: 0 7px 0 #B54A50 !important; animation: shake 0.4s ease; }

    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

    .feedback-msg {
      font-size: 1.35rem;
      font-weight: 900;
      height: 38px;
      color: #6B46C1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 彈窗 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
      padding: 20px;
    }

    .modal-card {
      background: white;
      width: 100%;
      max-width: 480px;
      border-radius: 32px;
      padding: 24px 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.25);
      border: 3.5px solid #D1C4E9;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-height: 85vh;
      overflow-y: auto;
    }

    .modal-title { font-size: 1.5rem; font-weight: 900; color: #3F2B63; margin-bottom: 12px; }
    .rank-list { width: 100%; list-style: none; padding: 0; margin: 0 0 16px 0; }
    .rank-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-radius: 16px; margin-bottom: 8px; background: #F8FAF7; font-size: 1.05rem; font-weight: 800; border: 1px solid #E2E8DC; }
    .rank-item.top-user { background: #FFF3CD; border-color: #FFE69C; color: #856404; }

    .close-modal-btn {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 20px;
      font-size: 1.1rem;
      font-weight: 900;
      cursor: pointer;
    }

    /* 賽跑頒獎典禮彈窗 */
    .race-result-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(33, 13, 58, 0.82);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 10000;
      padding: 20px;
    }

    .race-result-card {
      background: #FFFDF9;
      width: 100%;
      max-width: 440px;
      border-radius: 36px;
      padding: 26px 20px;
      border: 4px solid #F43F5E;
      box-shadow: 0 20px 45px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn { 0% { transform: scale(0.6); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

    .confetti-particle {
      position: fixed;
      pointer-events: none;
      z-index: 10001;
      animation: confettiFall 2.4s linear forwards;
    }

    @keyframes confettiFall { 0% { transform: translateY(-30px) rotate(0deg); opacity: 1; } 100% { transform: translateY(105vh) rotate(720deg); opacity: 0; } }
  </style>
</head>
<body onclick="ensureAudioResumed()">

  <div class="header-bar">
    <div class="user-profile" onclick="event.stopPropagation(); changePlayerName()">
      <span>🦄 <span id="player-name-display">小探險家</span> ✏️</span>
    </div>
    
    <div class="top-action-btns">
      <button class="action-btn gold" onclick="event.stopPropagation(); openLeaderboard()">🏆 堅果榜</button>
      <button class="action-btn" id="bgm-btn" onclick="event.stopPropagation(); toggleBGM()">🎵 龍貓音樂: 關閉</button>
    </div>
  </div>

  <div class="level-bar">
    <button class="level-btn" id="lvl-baby" onclick="switchLevel('baby')">🍼 幼兒先修</button>
    <button class="level-btn active" id="lvl-low" onclick="switchLevel('low')">🌱 低年級</button>
    <button class="level-btn" id="lvl-mid" onclick="switchLevel('mid')">🌿 中年級</button>
    <button class="level-btn" id="lvl-high" onclick="switchLevel('high')">🌳 高年級</button>
  </div>

  <!-- 7 大分區導航：最後一個是全新「🏇 小馬賽跑大賽」 -->
  <div class="header-nav">
    <button class="nav-btn active" id="btn-math" onclick="switchSubject('math')">➕ 加減</button>
    <button class="nav-btn" id="btn-multiply" onclick="switchSubject('multiply')">✖️ 乘法</button>
    <button class="nav-btn" id="btn-chinese" onclick="switchSubject('chinese')">🌸 國語</button>
    <button class="nav-btn" id="btn-life" onclick="switchSubject('life')">🍃 生活</button>
    <button class="nav-btn" id="btn-nature" onclick="switchSubject('nature')">🔬 自然</button>
    <button class="nav-btn" id="btn-eng" onclick="switchSubject('english')">🔤 英文</button>
    <button class="nav-btn race-mode-btn" id="btn-race" onclick="startRaceMode()">🏇 賽跑</button>
  </div>

  <div class="card" id="main-card">
    <div class="score-container">
      <div class="score-board">🌰 堅果數量: <span id="score">0</span> 顆</div>
      <div class="combo-badge" id="combo-badge">🔥 2 連勝!</div>
    </div>
    
    <!-- 🏇 彩虹小馬 5 匹馬競速賽道動畫區 -->
    <div class="race-track-container" id="race-track">
      <div class="race-status-header">
        <span>🏁 彩虹森林大獎賽</span>
        <span id="race-question-counter">第 1 / 10 題</span>
      </div>

      <!-- 跑道 1：玩家紫悅 -->
      <div class="race-lane player-lane">
        <div class="finish-line"></div>
        <div class="pony-runner" id="pony-p1" style="left: 2%;">
          <span>💜🦄👑</span><span class="pony-name-tag" id="p1-name" style="color: #6B21A8;">紫悅(我)</span>
        </div>
      </div>
      <!-- 跑道 2：雲寶 -->
      <div class="race-lane">
        <div class="finish-line"></div>
        <div class="pony-runner" id="pony-p2" style="left: 2%;">
          <span>🩵🐎💨</span><span class="pony-name-tag" style="color: #0284C7;">雲寶</span>
        </div>
      </div>
      <!-- 跑道 3：碧琪 -->
      <div class="race-lane">
        <div class="finish-line"></div>
        <div class="pony-runner" id="pony-p3" style="left: 2%;">
          <span>💖🎈🐴</span><span class="pony-name-tag" style="color: #DB2777;">碧琪</span>
        </div>
      </div>
      <!-- 跑道 4：蘋果嘉兒 -->
      <div class="race-lane">
        <div class="finish-line"></div>
        <div class="pony-runner" id="pony-p4" style="left: 2%;">
          <span>🧡🍎🐎</span><span class="pony-name-tag" style="color: #D97706;">嘉兒</span>
        </div>
      </div>
      <!-- 跑道 5：柔柔 -->
      <div class="race-lane">
        <div class="finish-line"></div>
        <div class="pony-runner" id="pony-p5" style="left: 2%;">
          <span>💛🦋🐴</span><span class="pony-name-tag" style="color: #CA8A04;">柔柔</span>
        </div>
      </div>
    </div>

    <div class="question-box">
      <div class="question-title" id="question">載入中...</div>
      <button class="audio-btn" id="audio-btn" style="display: none;" onclick="speakCurrentQuestion()">🔊 聽題目</button>
    </div>

    <div class="options-grid" id="options"></div>

    <div class="feedback-msg" id="feedback"></div>
  </div>

  <!-- 堅果榜彈窗 -->
  <div class="modal-overlay" id="rank-modal" onclick="closeLeaderboard()">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-title">🏆 森林堅果英雄榜</div>
      <ul class="rank-list" id="rank-list-content"></ul>
      <button class="close-modal-btn" onclick="closeLeaderboard()">繼續收集堅果！</button>
    </div>
  </div>

  <!-- 賽跑頒獎典禮彈窗 -->
  <div class="race-result-overlay" id="race-result-modal">
    <div class="race-result-card">
      <div style="font-size: 3.5rem; margin-bottom: 8px;" id="race-trophy">🏆</div>
      <div style="font-size: 1.8rem; font-weight: 900; color: #E11D48; margin-bottom: 8px;" id="race-result-title">比賽結束！</div>
      <div style="font-size: 1.15rem; font-weight: 800; color: #374151; line-height: 1.6; margin-bottom: 20px;" id="race-result-desc">恭喜紫悅奪得冠軍！</div>
      <button class="close-modal-btn" onclick="exitRaceMode()">🏅 領取獎勵，返回主選單！</button>
    </div>
  </div>

  <script>
    let playerName = localStorage.getItem('kids_player_name') || '小寶貝';
    document.getElementById('player-name-display').innerText = playerName;

    let currentLevel = localStorage.getItem('kids_grade_level') || 'low';
    let currentSubject = 'math';
    let score = parseInt(localStorage.getItem('kids_stars') || '0', 10);
    let combo = 0;
    let currentAnswer = null;
    let isProcessing = false;

    // --- 🏇 賽馬競速系統核心變數 ---
    let isRaceMode = false;
    let raceQuestionIndex = 0; // 0 ~ 10
    const TOTAL_RACE_QUESTIONS = 10;
    let ponyPositions = [2, 2, 2, 2, 2]; // 5 匹小馬跑道位置百分比 (2% ~ 86%)

    function startRaceMode() {
      ensureAudioResumed();
      isRaceMode = true;
      raceQuestionIndex = 0;
      ponyPositions = [2, 2, 2, 2, 2];
      
      // 切換按鈕狀態
      ['math', 'multiply', 'chinese', 'life', 'nature', 'eng'].forEach(s => {
        const btn = document.getElementById('btn-' + s);
        if (btn) btn.className = 'nav-btn';
      });
      document.getElementById('btn-race').className = 'nav-btn race-mode-btn active';
      
      // 顯示跑道，更新小馬位置
      document.getElementById('race-track').style.display = 'block';
      document.getElementById('p1-name').innerText = `${playerName}(我)`;
      updatePonyTracksUI();

      // 隨機切換一科題目進行比賽
      currentSubject = ['math', 'chinese', 'life', 'nature'][Math.floor(Math.random() * 4)];
      nextQuestion();
    }

      raceQuestionIndex++;

      const p1El = document.getElementById('pony-p1');
      if (playerCorrect) {

        ponyPositions[0] = Math.min(86, ponyPositions[0] + 2.5);
      }

      // 2. 另外 4 匹 NPC 小馬 (60% 成功率衝刺 8%，40% 慢速前進 2.5%)
      for (let i = 1; i < 5; i++) {
        const npcSuccess = Math.random() < 0.60;
        const forward = npcSuccess ? (Math.random() * 2 + 7.5) : (Math.random() * 1.5 + 2);
        ponyPositions[i] = Math.min(86, ponyPositions[i] + forward);
      }

      updatePonyTracksUI();

      // 10 題結束判定比賽結果

    // --- 音效與動畫 ---
    const totoroMelody = [
      { note: 67, dur: 0.35 }, { note: 69, dur: 0.35 }, { note: 71, dur: 0.7 },
      { note: 67, dur: 0.35 }, { note: 69, dur: 0.35 }, { note: 71, dur: 0.7 },
      { note: 72, dur: 0.35 }, { note: 71, dur: 0.35 }, { note: 69, dur: 0.35 }, { note: 67, dur: 0.35 },
      { note: 65, dur: 0.7 },  { note: 67, dur: 0.7 }
    ];

    let audioCtx = null;
    let bgmTimer = null;
    let isBgmPlaying = false;
    let melodyIndex = 0;

    function getAudioContext() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      return audioCtx;
    }

    function ensureAudioResumed() {
      const ctx = getAudioContext();
      if (ctx.state === 'suspended') ctx.resume();
    }

    function playTotoroNote(midiNote, duration) {
      if (!isBgmPlaying) return;
      const ctx = getAudioContext();
      if (ctx.state === 'suspended') ctx.resume();

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = 'triangle';
      const freq = 440 * Math.pow(2, (midiNote - 69) / 12);
      osc.frequency.setValueAtTime(freq, ctx.currentTime);

      gain.gain.setValueAtTime(0, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.08, ctx.currentTime + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration + 0.05);
    }

    function stepTotoro() {
      if (!isBgmPlaying) return;
      const current = totoroMelody[melodyIndex % totoroMelody.length];
      playTotoroNote(current.note, current.dur);
      melodyIndex++;
      bgmTimer = setTimeout(stepTotoro, current.dur * 1000);
    }

    function startBGM() {
      ensureAudioResumed();
      isBgmPlaying = true;
      melodyIndex = 0;
      if (bgmTimer) clearTimeout(bgmTimer);
      stepTotoro();
      const btn = document.getElementById('bgm-btn');
      btn.innerText = '🎵 龍貓音樂: 播放中';
      btn.classList.add('playing');
    }

    function stopBGM() {
      isBgmPlaying = false;
      if (bgmTimer) clearTimeout(bgmTimer);

      btn.innerText = '🎵 龍貓音樂: 關閉';
      btn.classList.remove('playing');
    }

    function toggleBGM() {
      ensureAudioResumed();
      if (isBgmPlaying) stopBGM();
      else startBGM();
    }

    function playVictoryFanfare() {
      const ctx = getAudioContext();
      if (ctx.state === 'suspended') ctx.resume();

      const chords = [
        { notes: [60, 64, 67], time: 0, dur: 0.2 },
        { notes: [62, 65, 69], time: 0.22, dur: 0.2 },
        { notes: [64, 67, 71], time: 0.44, dur: 0.2 },
        { notes: [65, 69, 72, 76], time: 0.68, dur: 0.8 }
      ];

      chords.forEach(c => {
        c.notes.forEach(mid => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440 * Math.pow(2, (mid - 69) / 12), ctx.currentTime + c.time);
          gain.gain.setValueAtTime(0, ctx.currentTime + c.time);
          gain.gain.linearRampToValueAtTime(0.12, ctx.currentTime + c.time + 0.05);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + c.time + c.dur);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + c.time);
          osc.stop(ctx.currentTime + c.time + c.dur + 0.1);
        });
      });
    }

      let a, b, ans;

      if (currentLevel === 'baby') {
        if (isAddition) { a = Math.floor(Math.random() * 5) + 1; b = Math.floor(Math.random() * 4) + 1; ans = a + b; document.getElementById('question').innerText = `${a} ➕ ${b} ＝ ?`; }
        else { a = Math.floor(Math.random() * 6) + 4; b = Math.floor(Math.random() * (a - 1)) + 1; ans = a - b; document.getElementById('question').innerText = `${a} ➖ ${b} ＝ ?`; }
      } else {
        if (isAddition) { a = Math.floor(Math.random() * 12) + 5; b = Math.floor(Math.random() * 8) + 3; ans = a + b; document.getElementById('question').innerText = `${a} ➕ ${b} ＝ ?`; }
        else { a = Math.floor(Math.random() * 12) + 8; b = Math.floor(Math.random() * (a - 2)) + 1; ans = a - b; document.getElementById('question').innerText = `${a} ➖ ${b} ＝ ?`; }
      }

      currentAnswer = ans;
      let options = [ans];
      while (options.length < 4) {
        let fake = ans + Math.floor(Math.random() * 9) - 4;
        if (fake >= 0 && !options.includes(fake)) options.push(fake);
      }
      options.sort(() => Math.random() - 0.5);
      renderButtons(options, (val) => val === currentAnswer, false);
    }

    function generateMultiplyQuestion() {
      document.getElementById('audio-btn').style.display = 'none';
      const a = Math.floor(Math.random() * 8) + 2;
      const b = Math.floor(Math.random() * 9) + 1;
      const ans = a * b;
      currentAnswer = ans;
      document.getElementById('question').innerText = `${a} ✖️ ${b} ＝ ?`;

      let options = [ans];
      while (options.length < 4) {
        let fake = ans + Math.floor(Math.random() * 9) - 4;
        if (fake > 0 && !options.includes(fake)) options.push(fake);
      }
      options.sort(() => Math.random() - 0.5);
      renderButtons(options, (val) => val === currentAnswer, false);
    }

    function generateGenericQuestion(database, subjectName) {
      const qData = getNextItem(database, subjectName);
      currentAnswer = qData;
      document.getElementById('question').innerText = qData.q;
      document.getElementById('audio-btn').style.display = 'inline-block';
      setTimeout(() => speakCurrentQuestion(), 150);

      const isBabyPic = (currentLevel === 'baby' && subjectName === 'chinese');
      const options = [...qData.options].sort(() => Math.random() - 0.5);
      renderButtons(options, (val) => val === currentAnswer.ans, isBabyPic);
    }

    function generateEnglishQuestion() {
      document.getElementById('audio-btn').style.display = 'inline-block';
      const item = getNextItem(englishDB, 'english');
      currentAnswer = item;
      document.getElementById('question').innerText = item.word;
      setTimeout(() => speakCurrentQuestion(), 150);

      const fullList = englishDB[currentLevel];
      let options = [item.zh];
      while (options.length < 4) {
        let fake = fullList[Math.floor(Math.random() * fullList.length)].zh;
        if (!options.includes(fake)) options.push(fake);
      }
      options.sort(() => Math.random() - 0.5);
      renderButtons(options, (val) => val === currentAnswer.zh, false);
    }

    function renderButtons(list, checkFn, isPicMode) {
      const box = document.getElementById('options');
      list.forEach(val => {
        const btn = document.createElement('button');
        btn.className = `option-btn ${isPicMode ? 'pic-mode' : ''}`;
        btn.innerText = val;
        btn.onclick = (e) => {
          e.stopPropagation();
          ensureAudioResumed();
          handleChoice(btn, checkFn(val));
        };
        box.appendChild(btn);
      });
    }

    function handleChoice(btn, isCorrect) {
      if (isProcessing) return;

      // 如果處於「小馬賽跑大賽」模式
      if (isRaceMode) {
        isProcessing = true;
        if (isCorrect) {
          btn.classList.add('correct');
          document.getElementById('feedback').innerText = `⚡ 紫悅爆發魔法加速衝刺！`;
        } else {
          btn.classList.add('wrong');
          document.getElementById('feedback').innerText = `💨 答錯了，以一般速度前進...`;
        }

        const raceOver = stepRacePonies(isCorrect);
        if (!raceOver) {
          // 比賽未結束，換一科隨機出題
          currentSubject = ['math', 'chinese', 'life', 'nature', 'english'][Math.floor(Math.random() * 5)];
          setTimeout(() => nextQuestion(), 950);
        }
        return;
      }

      // 一般闖關模式
      if (isCorrect) {
        isProcessing = true;
        btn.classList.add('correct');
        combo += 1;
        updateComboUI();
        score += 1;
        saveStats();

        document.getElementById('feedback').innerText = `🎉 ${playerName} 答對了！獲得1顆堅果 🌰`;
        setTimeout(() => nextQuestion(), 950);
      } else {
        btn.classList.add('wrong');
        combo = 0;
        updateComboUI();

        if (score > 0) score -= 1;
        saveStats();

        document.getElementById('feedback').innerText = `🍂 算錯了喔，掉落1顆堅果！再試一次！`;
        setTimeout(() => btn.classList.remove('wrong'), 800);
      }
    }

    switchLevel(currentLevel);
    saveStats();
  </script>
</body>
</html>
