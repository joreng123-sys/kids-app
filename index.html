<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>歡樂學習樂園</title>
  
  <!-- iPad 全螢幕與桌面專屬 PNG Icon -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="歡樂學習">
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/twitter/twemoji/master/assets/72x72/1f330.png">
  <link rel="icon" href="https://raw.githubusercontent.com/twitter/twemoji/master/assets/72x72/1f330.png">

  <style>
    :root {
      --primary: #406343;      /* 森林墨綠 */
      --secondary: #5B8A72;    /* 雅緻綠 */
      --accent: #F3C68F;       /* 奶香黃 */
      --success: #2ECC71;
      --danger: #E74C3C;
      --card-bg: rgba(255, 255, 255, 0.94);
      --text: #264653;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body {
      margin: 0;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Noto Sans TC", "BiauKai", sans-serif;
      background: url('https://images.unsplash.com/photo-1542273917363-3b1817f69a2d?auto=format&fit=crop&q=80&w=1200') no-repeat center center fixed;
      background-size: cover;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(216,243,220,0.35) 100%);
      z-index: -1;
    }

    /* 頂部標題與音樂提示條 */
    .header-bar {
      width: 100%;
      max-width: 650px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      background: rgba(255, 255, 255, 0.88);
      padding: 8px 16px;
      border-radius: 50px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
      border: 2px solid #CAD2C5;
    }

    .title-area {
      font-size: 1.35rem;
      font-weight: 900;
      color: #2F3E46;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .bgm-btn {
      background: #84A98C;
      color: white;
      border: none;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 0 #52796F;
      display: flex;
      align-items: center;
      gap: 4px;
      touch-action: manipulation;
    }

    .bgm-btn.playing {
      background: #E07A5F;
      box-shadow: 0 3px 0 #B0533C;
    }

    /* 4 個科目導航按鈕 (加減、乘法、國語、英文) */
    .header-nav {
      width: 100%;
      max-width: 650px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 14px;
    }

    .nav-btn {
      padding: 10px 4px;
      font-size: 0.95rem;
      font-weight: 800;
      border: 2px solid #CAD2C5;
      border-radius: 18px;
      background: #F1F4ED;
      color: var(--text);
      cursor: pointer;
      box-shadow: 0 4px 0 #BCC8B6;
      transition: all 0.1s ease;
      touch-action: manipulation;
      text-align: center;
    }

    .nav-btn.active {
      background: var(--primary);
      color: white;
      border-color: #283E2A;
      box-shadow: 0 4px 0 #1D2E1F;
      transform: translateY(2px);
    }

    /* 主遊戲卡片 */
    .card {
      background: var(--card-bg);
      width: 100%;
      max-width: 650px;
      border-radius: 32px;
      padding: 22px 18px;
      border: 3px solid #CAD2C5;
      box-shadow: 0 12px 35px rgba(38, 70, 83, 0.16);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 500px;
      position: relative;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .card.bounce {
      transform: scale(1.025);
    }

    .score-container {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .score-board {
      font-size: 1.35rem;
      font-weight: 800;
      color: #E76F51;
    }

    .combo-badge {
      font-size: 1rem;
      font-weight: 800;
      color: #FFFFFF;
      background: linear-gradient(135deg, #F4A261, #E76F51);
      padding: 4px 12px;
      border-radius: 16px;
      display: none;
      box-shadow: 0 3px 8px rgba(231, 111, 81, 0.4);
      animation: pulse 0.7s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.1); }
    }

    .rank-bar {
      font-size: 0.95rem;
      font-weight: 800;
      color: #2A9D8F;
      margin-bottom: 12px;
      background: #E8F8F5;
      padding: 5px 16px;
      border-radius: 20px;
      border: 1px dashed #A8DADC;
    }

    .question-box {
      min-height: 145px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin-bottom: 22px;
      text-align: center;
      width: 100%;
    }

    .question-title {
      font-size: 2.5rem;
      font-weight: 900;
      letter-spacing: 1px;
      color: #264653;
      margin: 0;
      line-height: 1.3;
      word-break: break-word;
    }

    .audio-btn {
      background: linear-gradient(180deg, #FFFFFF, #E8F4FD);
      color: #2A9D8F;
      border: 2px solid #2A9D8F;
      padding: 9px 22px;
      border-radius: 24px;
      font-size: 1.15rem;
      font-weight: 800;
      margin-top: 12px;
      cursor: pointer;
      box-shadow: 0 4px 0 #B3D8D3;
      touch-action: manipulation;
    }

    .audio-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #B3D8D3;
    }

    /* --- 優化：3D 果凍按鈕樣式 --- */
    .options-grid {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 18px;
    }

    .option-btn {
      min-height: 95px;
      font-size: 1.7rem;
      font-weight: 800;
      border: 3px solid #E2E8DC;
      border-radius: 26px;
      background: linear-gradient(180deg, #FFFFFF 0%, #F8FAF7 100%);
      color: #2F3E46;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 7px 0 #C9D5C4, 0 10px 15px rgba(0,0,0,0.04);
      transition: all 0.12s ease;
      touch-action: manipulation;
      padding: 8px 12px;
      text-align: center;
    }

    .option-btn:active {
      transform: translateY(5px);
      box-shadow: 0 2px 0 #C9D5C4;
    }

    /* 答對果凍綠 */
    .option-btn.correct {
      background: linear-gradient(180deg, #D4EDDA 0%, #A7D7C5 100%);
      border-color: #52B788;
      color: #084C2F;
      box-shadow: 0 7px 0 #40916C;
    }

    /* 答錯粉漾紅 */
    .option-btn.wrong {
      background: linear-gradient(180deg, #FDE2E4 0%, #FFCAD4 100%);
      border-color: #E56B6F;
      color: #6B1D2F;
      box-shadow: 0 7px 0 #B54A50;
    }

    .feedback-msg {
      font-size: 1.4rem;
      font-weight: 800;
      height: 38px;
      color: #2A9D8F;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .reset-btn {
      background: none;
      border: none;
      color: #A0AAB2;
      font-size: 0.85rem;
      text-decoration: underline;
      cursor: pointer;
      margin-top: 6px;
    }

    .particle {
      position: absolute;
      pointer-events: none;
      animation: fall 1.2s forwards;
    }
    @keyframes fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(120px) rotate(180deg); opacity: 0; }
    }
  </style>
</head>
<body onclick="tryAutoPlayBGM()">

  <div class="header-bar">
    <div class="title-area">🪵 歡樂學習森林</div>
    <button class="bgm-btn" id="bgm-btn" onclick="event.stopPropagation(); toggleBGM()">🎵 音樂: 關閉</button>
  </div>

  <div class="header-nav">
    <button class="nav-btn active" id="btn-math" onclick="switchSubject('math')">➕ 加減法</button>
    <button class="nav-btn" id="btn-multiply" onclick="switchSubject('multiply')">✖️ 乘法</button>
    <button class="nav-btn" id="btn-chinese" onclick="switchSubject('chinese')">🌸 國語</button>
    <button class="nav-btn" id="btn-eng" onclick="switchSubject('english')">🔤 英文</button>
  </div>

  <div class="card" id="main-card">
    <div class="score-container">
      <div class="score-board">⭐ 橡果星星: <span id="score">0</span></div>
      <div class="combo-badge" id="combo-badge">🔥 2 連勝!</div>
    </div>
    
    <div class="rank-bar" id="rank-bar">稱號：森林小見習生 🌿</div>

    <div class="question-box">
      <div class="question-title" id="question">森林探險準備中...</div>
      <button class="audio-btn" id="audio-btn" style="display: none;" onclick="speakCurrentQuestion()">🔊 聽題目</button>
    </div>

    <div class="options-grid" id="options"></div>

    <div class="feedback-msg" id="feedback"></div>
    <button class="reset-btn" onclick="resetScore()">重置星星</button>
  </div>

  <script>
    let currentSubject = 'math';
    let score = parseInt(localStorage.getItem('kids_stars') || '0', 10);
    let combo = 0;
    let currentAnswer = null;
    let isProcessing = false;

    // --- 臺灣國小國語低年級題庫 (注音、部首、成語量詞、相反詞) ---
    const allChineseQuestions = [
      { q: "「河」的部首是什麼？", ans: "氵(水)", options: ["氵(水)", "木", "口", "日"] },
      { q: "「草」的部首是什麼？", ans: "艹(草)", options: ["艹(草)", "木", "日", "十"] },
      { q: "「花朵」的量詞要填什麼？\n一（ ）花", ans: "朵", options: ["朵", "頭", "張", "隻"] },
      { q: "「小狗」的量詞要填什麼？\n一（ ）狗", ans: "隻", options: ["隻", "朵", "條", "本"] },
      { q: "「小汽車」的量詞是？\n一（ ）車", ans: "輛", options: ["輛", "本", "片", "把"] },
      { q: "「筆記本」的量詞是？\n一（ ）書", ans: "本", options: ["本", "件", "杯", "包"] },
      { q: "「雨傘」的量詞要用？\n一（ ）傘", ans: "把", options: ["把", "隻", "朵", "頭"] },
      { q: "「白」的相反詞是？", ans: "黑", options: ["黑", "紅", "亮", "高"] },
      { q: "「大」的相反詞是？", ans: "小", options: ["小", "少", "矮", "多"] },
      { q: "「多」的相反詞是？", ans: "少", options: ["少", "小", "短", "低"] },
      { q: "「高」的相反詞是？", ans: "矮", options: ["矮", "小", "瘦", "慢"] },
      { q: "「木」加「木」會變成什麼字？", ans: "林", options: ["林", "森", "本", "休"] },
      { q: "「日」加「月」會變成什麼字？", ans: "明", options: ["明", "晴", "早", "暗"] },
      { q: "「貓」的注音開頭是？", ans: "ㄇ", options: ["ㄇ", "ㄋ", "ㄈ", "ㄆ"] },
      { q: "「魚」的注音符號是？", ans: "ㄩˊ", options: ["ㄩˊ", "ㄧˊ", "ㄨˊ", "ㄚˊ"] },
      { q: "「月亮」的注音開頭是？", ans: "ㄩ", options: ["ㄩ", "ㄧ", "ㄨ", "ㄛ"] },
      { q: "「風」的注音是？", ans: "ㄈㄥ", options: ["ㄈㄥ", "ㄏㄥ", "ㄉㄥ", "ㄅㄥ"] },
      { q: "「快快樂樂」的意思相近於？", ans: "開開心心", options: ["開開心心", "哭哭啼啼", "急急忙忙", "慢吞吞"] }
    ];

    // --- 英文單字庫 (40單字) ---
    const allEnglishWords = [
      { word: "Cat", zh: "貓咪" }, { word: "Dog", zh: "狗狗" }, { word: "Apple", zh: "蘋果" },
      { word: "Book", zh: "書本" }, { word: "Red", zh: "紅色" }, { word: "Blue", zh: "藍色" },
      { word: "Star", zh: "星星" }, { word: "Fish", zh: "小魚" }, { word: "Bird", zh: "小鳥" },
      { word: "Car", zh: "汽車" }, { word: "Sun", zh: "太陽" }, { word: "Moon", zh: "月亮" },
      { word: "Tree", zh: "大樹" }, { word: "Water", zh: "水" }, { word: "Milk", zh: "牛奶" },
      { word: "Bread", zh: "麵包" }, { word: "Egg", zh: "雞蛋" }, { word: "Banana", zh: "香蕉" },
      { word: "Bear", zh: "小熊" }, { word: "Rabbit", zh: "兔子" }, { word: "Pencil", zh: "鉛筆" },
      { word: "School", zh: "學校" }, { word: "Bag", zh: "書包" }, { word: "Flower", zh: "花朵" },
      { word: "Rain", zh: "下雨" }, { word: "Wind", zh: "微風" }, { word: "Green", zh: "綠色" },
      { word: "Yellow", zh: "黃色" }, { word: "Duck", zh: "鴨子" }, { word: "Frog", zh: "青蛙" },
      { word: "Hand", zh: "手" }, { word: "Eye", zh: "眼睛" }, { word: "Nose", zh: "鼻子" },
      { word: "Mouth", zh: "嘴巴" }, { word: "Door", zh: "門" }, { word: "Chair", zh: "椅子" },
      { word: "Hat", zh: "帽子" }, { word: "Shoe", zh: "鞋子" }, { word: "Smile", zh: "微笑" },
      { word: "Heart", zh: "愛心" }
    ];

    // 抽牌不重複機制
    let remainingEnglish = [];
    function getNextEnglish() {
      if (remainingEnglish.length === 0) remainingEnglish = [...allEnglishWords].sort(() => Math.random() - 0.5);
      return remainingEnglish.pop();
    }

    let remainingChinese = [];
    function getNextChinese() {
      if (remainingChinese.length === 0) remainingChinese = [...allChineseQuestions].sort(() => Math.random() - 0.5);
      return remainingChinese.pop();
    }

    function updateRankUI() {
      document.getElementById('score').innerText = score;
      const rankBar = document.getElementById('rank-bar');
      if (score >= 50) rankBar.innerText = '稱號：森林守護大龍貓 👑✨';
      else if (score >= 30) rankBar.innerText = '稱號：神祕森林精靈 🌟';
      else if (score >= 15) rankBar.innerText = '稱號：活潑小松鼠 🌰';
      else if (score >= 5) rankBar.innerText = '稱號：好奇探險家 🎒';
      else rankBar.innerText = '稱號：森林小見習生 🌿';
    }
    updateRankUI();

    function resetScore() {
      if (confirm('確定要把收集的星星歸零重新開始嗎？')) {
        score = 0;
        combo = 0;
        localStorage.setItem('kids_stars', '0');
        updateComboUI();
        updateRankUI();
      }
    }

    function updateComboUI() {
      const badge = document.getElementById('combo-badge');
      if (combo >= 2) {
        badge.innerText = `🔥 ${combo} 連勝!`;
        badge.style.display = 'block';
      } else {
        badge.style.display = 'none';
      }
    }

    // 發音引擎（支援中英文語音合成）
    let voices = [];
    function initVoices() {
      if (!('speechSynthesis' in window)) return;
      voices = window.speechSynthesis.getVoices();
    }
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = initVoices;
      initVoices();
    }

    function speakCurrentQuestion() {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      if (currentSubject === 'english' && currentAnswer && currentAnswer.word) {
        const u = new SpeechSynthesisUtterance(currentAnswer.word);
        const enVoice = voices.find(v => (v.name.includes('Samantha') || v.name.includes('Ava') || v.name.includes('Alex')) && v.lang.startsWith('en'))
                     || voices.find(v => v.lang === 'en-US');
        if (enVoice) u.voice = enVoice;
        u.lang = 'en-US';
        u.rate = 0.8;
        u.pitch = 1.1;
        window.speechSynthesis.speak(u);
      } else if (currentSubject === 'chinese' && currentAnswer && currentAnswer.q) {
        const cleanText = currentAnswer.q.replace('\n', '，');
        const u = new SpeechSynthesisUtterance(cleanText);
        const zhVoice = voices.find(v => v.lang === 'zh-TW');
        if (zhVoice) u.voice = zhVoice;
        u.lang = 'zh-TW';
        u.rate = 0.85;
        window.speechSynthesis.speak(u);
      }
    }

    // --- 音效與吉卜力自動 BGM 系統 ---
    let audioCtx = null;
    let bgmInterval = null;
    let isBgmPlaying = false;
    let hasUserInteracted = false;
    let synthVol = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        synthVol = audioCtx.createGain();
        synthVol.gain.value = 0.045; // 柔和背景音量
        synthVol.connect(audioCtx.destination);
      }
    }

    const melody = [
      60, 64, 67, 72, 71, 67, 64, 62,
      60, 64, 67, 72, 74, 76, 79, 76,
      74, 72, 69, 72, 71, 67, 64, 62,
      60, 64, 67, 72, 71, 67, 64, 60
    ];
    let noteIndex = 0;

    function playGhibliMelody() {
      if (!isBgmPlaying || !audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      osc.type = 'triangle';
      const midNote = melody[noteIndex % melody.length];
      const freq = 440 * Math.pow(2, (midNote - 69) / 12);
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
      gainNode.gain.linearRampToValueAtTime(0.05, audioCtx.currentTime + 0.05);
      gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.55);
      osc.connect(gainNode);
      gainNode.connect(synthVol);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.6);

      if (noteIndex % 3 === 0) {
        const bassOsc = audioCtx.createOscillator();
        const bassGain = audioCtx.createGain();
        bassOsc.type = 'sine';
        const bassNote = midNote - 12;
        bassOsc.frequency.setValueAtTime(440 * Math.pow(2, (bassNote - 69) / 12), audioCtx.currentTime);
        bassGain.gain.setValueAtTime(0, audioCtx.currentTime);
        bassGain.gain.linearRampToValueAtTime(0.025, audioCtx.currentTime + 0.1);
        bassGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.9);
        bassOsc.connect(bassGain);
        bassGain.connect(synthVol);
        bassOsc.start();
        bassOsc.stop(audioCtx.currentTime + 1.0);
      }
      noteIndex++;
    }

    // 點擊螢幕任何地方時，自動啟動 BGM
    function tryAutoPlayBGM() {
      if (hasUserInteracted) return;
      hasUserInteracted = true;
      if (!isBgmPlaying) {
        startBGM();
      }
    }

    function startBGM() {
      initAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      isBgmPlaying = true;
      if (bgmInterval) clearInterval(bgmInterval);
      bgmInterval = setInterval(playGhibliMelody, 350);
      const btn = document.getElementById('bgm-btn');
      btn.innerText = '🎵 音樂: 播放中';
      btn.classList.add('playing');
    }

    function stopBGM() {
      isBgmPlaying = false;
      if (bgmInterval) clearInterval(bgmInterval);
      const btn = document.getElementById('bgm-btn');
      btn.innerText = '🎵 音樂: 關閉';
      btn.classList.remove('playing');
    }

    function toggleBGM() {
      hasUserInteracted = true;
      if (isBgmPlaying) stopBGM();
      else startBGM();
    }

    function playBeep(isSuccess) {
      initAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (isSuccess) {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
        osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.08);
        osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.16);
        osc.frequency.setValueAtTime(1046.50, audioCtx.currentTime + 0.24);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.55);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.55);
      } else {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(293.66, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(180, audioCtx.currentTime + 0.25);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.25);
      }
    }

    function createParticles(element, type) {
      const rect = element.getBoundingClientRect();
      const count = type === 'leaf' ? 14 : 6;
      for (let i = 0; i < count; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = `${rect.left + rect.width / 2 + (Math.random() - 0.5) * 80}px`;
        particle.style.top = `${rect.top + rect.height / 2 + (Math.random() - 0.5) * 40}px`;
        particle.style.fontSize = `${Math.floor(Math.random() * 12) + 18}px`;
        if (type === 'leaf') {
          const leaves = ['🍃', '🍂', '🍁', '✨', '⭐', '🌰'];
          particle.innerText = leaves[Math.floor(Math.random() * leaves.length)];
        } else {
          particle.innerText = '🌀';
        }
        document.body.appendChild(particle);
        setTimeout(() => particle.remove(), 1200);
      }
    }

    // --- 科目切換 ---
    function switchSubject(subject) {
      currentSubject = subject;
      combo = 0;
      updateComboUI();
      document.getElementById('btn-math').className = `nav-btn ${subject === 'math' ? 'active' : ''}`;
      document.getElementById('btn-multiply').className = `nav-btn ${subject === 'multiply' ? 'active' : ''}`;
      document.getElementById('btn-chinese').className = `nav-btn ${subject === 'chinese' ? 'active' : ''}`;
      document.getElementById('btn-eng').className = `nav-btn ${subject === 'english' ? 'active' : ''}`;
      nextQuestion();
    }

    function nextQuestion() {
      isProcessing = false;
      document.getElementById('feedback').innerText = '';
      const optionsBox = document.getElementById('options');
      optionsBox.innerHTML = '';

      if (currentSubject === 'math') {
        generateMathQuestion();
      } else if (currentSubject === 'multiply') {
        generateMultiplyQuestion();
      } else if (currentSubject === 'chinese') {
        generateChineseQuestion();
      } else {
        generateEnglishQuestion();
      }
    }

    // 1. 加減法
    function generateMathQuestion() {
      document.getElementById('audio-btn').style.display = 'none';
      const isAddition = Math.random() > 0.4;
      let a, b, ans;

      if (isAddition) {
        a = Math.floor(Math.random() * 15) + 1;
        b = Math.floor(Math.random() * 10) + 1;
        ans = a + b;
        document.getElementById('question').innerText = `${a} ➕ ${b} ＝ ?`;
      } else {
        a = Math.floor(Math.random() * 18) + 2;
        b = Math.floor(Math.random() * a) + 1;
        ans = a - b;
        document.getElementById('question').innerText = `${a} ➖ ${b} ＝ ?`;
      }

      currentAnswer = ans;
      let options = [ans];
      while (options.length < 4) {
        let fake = ans + (Math.floor(Math.random() * 7) - 3);
        if (fake >= 0 && !options.includes(fake)) options.push(fake);
      }
      options.sort(() => Math.random() - 0.5);
      renderButtons(options, (val) => val === currentAnswer);
    }

    // 2. 九九乘法
    function generateMultiplyQuestion() {
      document.getElementById('audio-btn').style.display = 'none';
      const a = Math.floor(Math.random() * 8) + 2;
      const b = Math.floor(Math.random() * 9) + 1;
      const ans = a * b;

      currentAnswer = ans;
      document.getElementById('question').innerText = `${a} ✖️ ${b} ＝ ?`;

      let options = [ans];
      const offsets = [-a, a, -1, 1, -2, 2, 10, -10];
      offsets.sort(() => Math.random() - 0.5);

      for (let offset of offsets) {
        let fake = ans + offset;
        if (fake > 0 && !options.includes(fake)) options.push(fake);
        if (options.length === 4) break;
      }

      while (options.length < 4) {
        let fake = (Math.floor(Math.random() * 8) + 2) * (Math.floor(Math.random() * 9) + 1);
        if (!options.includes(fake)) options.push(fake);
      }
      options.sort(() => Math.random() - 0.5);
      renderButtons(options, (val) => val === currentAnswer);
    }
