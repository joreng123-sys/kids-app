<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>歡樂學習樂園</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="歡樂學習">
  <link rel="apple-touch-icon" sizes="180x180" href="https://img.icons8.com/color/180/my-little-pony.png">
  <link rel="icon" href="https://img.icons8.com/color/180/my-little-pony.png">

  <style>
    :root {
      --primary: #5A3E85;
      --secondary: #8E6BB8;
      --accent: #F3C68F;
      --success: #2ECC71;
      --danger: #E74C3C;
      --card-bg: rgba(255, 255, 255, 0.95);
      --text: #264653;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body {
      margin: 0;
      padding: 10px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Noto Sans TC", sans-serif;
      background: url('https://images.unsplash.com/photo-1542273917363-3b1817f69a2d?auto=format&fit=crop&q=80&w=1200') no-repeat center center fixed;
      background-size: cover;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, rgba(240,230,255,0.35) 100%);
      z-index: -1;
    }

    .header-bar {
      width: 100%;
      max-width: 680px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      background: rgba(255, 255, 255, 0.94);
      padding: 6px 14px;
      border-radius: 50px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
      border: 3px solid #D1C4E9;
      gap: 6px;
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.95rem;
      font-weight: 800;
      color: #3F2B63;
      cursor: pointer;
      background: #F3E8FF;
      padding: 6px 12px;
      border-radius: 20px;
      border: 2px solid #D8B4FE;
    }

    .top-action-btns {
      display: flex;
      gap: 6px;
    }

    .action-btn {
      background: #8E6BB8;
      color: white;
      border: none;
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 0.85rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 3px 0 #5A3E85;
      display: flex;
      align-items: center;
      gap: 4px;
      touch-action: manipulation;
    }

    .action-btn.gold {
      background: #E09F3E;
      box-shadow: 0 3px 0 #9E6B22;
    }

    .action-btn.playing {
      background: #D946EF;
      box-shadow: 0 3px 0 #A21CAF;
    }

    .level-bar {
      width: 100%;
      max-width: 680px;
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 8px;
      background: rgba(255, 255, 255, 0.92);
      padding: 5px;
      border-radius: 26px;
      border: 2.5px solid #D1C4E9;
      box-shadow: 0 4px 10px rgba(0,0,0,0.04);
    }

    .level-btn {
      flex: 1;
      border: none;
      background: #F5F0FA;
      padding: 7px 4px;
      font-size: 0.9rem;
      font-weight: 800;
      color: #6B46C1;
      border-radius: 18px;
      cursor: pointer;
      transition: all 0.15s ease;
      touch-action: manipulation;
      text-align: center;
    }

    .level-btn.active {
      background: #6B46C1;
      color: white;
      box-shadow: 0 3px 0 #4C1D95;
      transform: translateY(1px);
    }

    .header-nav {
      width: 100%;
      max-width: 680px;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 5px;
      margin-bottom: 10px;
    }

    .nav-btn {
      padding: 8px 2px;
      font-size: 0.86rem;
      font-weight: 900;
      border: 2px solid #D1C4E9;
      border-radius: 18px;
      background: #FAF8FC;
      color: var(--text);
      cursor: pointer;
      box-shadow: 0 4px 0 #C4B5FD;
      transition: all 0.1s ease;
      text-align: center;
      touch-action: manipulation;
      white-space: nowrap;
    }

    .nav-btn.active {
      background: var(--primary);
      color: white;
      border-color: #3B2166;
      box-shadow: 0 4px 0 #281647;
      transform: translateY(2px);
    }

    .card {
      background: var(--card-bg);
      width: 100%;
      max-width: 680px;
      border-radius: 36px;
      padding: 18px 16px;
      border: 3.5px solid #D1C4E9;
      box-shadow: 0 14px 38px rgba(90, 62, 133, 0.18);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 490px;
      position: relative;
    }

    .score-container {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .score-board {
      font-size: 1.35rem;
      font-weight: 900;
      color: #D97706;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .combo-badge {
      font-size: 0.95rem;
      font-weight: 900;
      color: #FFFFFF;
      background: linear-gradient(135deg, #F4A261, #E76F51);
      padding: 4px 12px;
      border-radius: 16px;
      display: none;
      animation: pulse 0.6s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.08); }
    }

    /* 闖關進度條 */
    .stage-progress-box {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 12px;
    }

    .stage-text-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      font-weight: 900;
      color: #6B46C1;
    }

    .progress-track {
      width: 100%;
      height: 14px;
      background: #E9D5FF;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid #C084FC;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #A855F7, #EC4899);
      border-radius: 8px;
      transition: width 0.3s ease;
    }

    .question-box {
      width: 100%;
      min-height: 140px;
      background: linear-gradient(180deg, #FFFDF8 0%, #FAF5FF 100%);
      border: 3px solid #D8B4FE;
      border-radius: 28px;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.03), 0 6px 0 #C4B5FD;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 16px 14px;
      margin-bottom: 18px;
      position: relative;
    }

    .question-box::before {
      content: "✨";
      position: absolute;
      top: -12px;
      left: 16px;
      font-size: 1.5rem;
    }
    .question-box::after {
      content: "🦄";
      position: absolute;
      bottom: -10px;
      right: 18px;
      font-size: 1.5rem;
    }

    .question-title {
      font-size: 2.3rem;
      font-weight: 900;
      color: #2F1E4B;
      margin: 0;
      line-height: 1.35;
      text-align: center;
      word-break: break-word;
    }

    .audio-btn {
      background: #FFFFFF;
      color: #6B46C1;
      border: 2px solid #6B46C1;
      padding: 7px 18px;
      border-radius: 24px;
      font-size: 1.05rem;
      font-weight: 900;
      margin-top: 10px;
      cursor: pointer;
      box-shadow: 0 4px 0 #D8B4FE;
      touch-action: manipulation;
    }

    .options-grid {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 14px;
    }

    .option-btn {
      min-height: 95px;
      font-size: 1.6rem;
      font-weight: 900;
      border-radius: 26px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 8px 12px;
      touch-action: manipulation;
      text-align: center;
      transition: all 0.12s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .option-btn.pic-mode {
      font-size: 3rem;
    }

    .option-btn:nth-child(1) {
      background: linear-gradient(180deg, #FFF9EB 0%, #FEEDCE 100%);
      border: 3px solid #E6BA80;
      color: #6C4918;
      box-shadow: 0 7px 0 #CCA167;
    }
    .option-btn:nth-child(2) {
      background: linear-gradient(180deg, #F0FBF7 0%, #D8F5E9 100%);
      border: 3px solid #84D7B5;
      color: #17573E;
      box-shadow: 0 7px 0 #6ABE9C;
    }
    .option-btn:nth-child(3) {
      background: linear-gradient(180deg, #F5F3FF 0%, #EDE9FE 100%);
      border: 3px solid #C4B5FD;
      color: #5B21B6;
      box-shadow: 0 7px 0 #A78BFA;
    }
    .option-btn:nth-child(4) {
      background: linear-gradient(180deg, #FFF4F4 0%, #FFE0E0 100%);
      border: 3px solid #F3A8A8;
      color: #7D2626;
      box-shadow: 0 7px 0 #DA8989;
    }

    .option-btn:active {
      transform: translateY(5px);
      box-shadow: 0 2px 0 rgba(0,0,0,0.2) !important;
    }

    .option-btn.correct {
      background: linear-gradient(180deg, #D4EDDA 0%, #A7D7C5 100%) !important;
      border-color: #52B788 !important;
      color: #084C2F !important;
      box-shadow: 0 7px 0 #40916C !important;
    }

    .option-btn.wrong {
      background: linear-gradient(180deg, #FDE2E4 0%, #FFCAD4 100%) !important;
      border-color: #E56B6F !important;
      color: #6B1D2F !important;
      box-shadow: 0 7px 0 #B54A50 !important;
      animation: shake 0.4s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    .feedback-msg {
      font-size: 1.35rem;
      font-weight: 900;
      height: 38px;
      color: #6B46C1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
      padding: 20px;
    }

    .modal-card {
      background: white;
      width: 100%;
      max-width: 480px;
      border-radius: 32px;
      padding: 24px 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.25);
      border: 3.5px solid #D1C4E9;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-height: 85vh;
      overflow-y: auto;
    }

    .modal-title {
      font-size: 1.5rem;
      font-weight: 900;
      color: #3F2B63;
      margin-bottom: 12px;
    }

    .rank-list {
      width: 100%;
      list-style: none;
      padding: 0;
      margin: 0 0 16px 0;
    }

    .rank-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      border-radius: 16px;
      margin-bottom: 8px;
      background: #F8FAF7;
      font-size: 1.05rem;
      font-weight: 800;
      border: 1px solid #E2E8DC;
    }

    .rank-item.top-user {
      background: #FFF3CD;
      border-color: #FFE69C;
      color: #856404;
    }

    .stats-card {
      width: 100%;
      background: #F5F3FF;
      border-radius: 18px;
      padding: 12px 14px;
      font-size: 0.95rem;
      color: #4C1D95;
      margin-bottom: 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      font-weight: 800;
    }

    .test-anim-btn {
      background: #E9D5FF;
      color: #6B46C1;
      border: 1.5px dashed #A855F7;
      padding: 8px 16px;
      border-radius: 14px;
      font-size: 0.88rem;
      font-weight: 800;
      cursor: pointer;
      margin-bottom: 12px;
      width: 100%;
    }

    .close-modal-btn {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 20px;
      font-size: 1.1rem;
      font-weight: 900;
      cursor: pointer;
    }

    /* 全螢幕過關慶祝動畫 */
    .level-clear-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(43, 27, 69, 0.78);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 10000;
      padding: 20px;
    }

    .level-clear-card {
      background: #FFFDF9;
      width: 100%;
      max-width: 440px;
      border-radius: 36px;
      padding: 28px 20px;
      border: 4px solid #D8B4FE;
      box-shadow: 0 20px 45px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% { transform: scale(0.6); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .pony-dancer {
      width: 110px;
      height: 110px;
      margin-bottom: 12px;
      animation: ponyBounce 1s infinite alternate ease-in-out;
    }

    @keyframes ponyBounce {
      0% { transform: translateY(0) scale(1) rotate(-5deg); }
      50% { transform: translateY(-16px) scale(1.1) rotate(5deg); }
      100% { transform: translateY(0) scale(1) rotate(-5deg); }
    }

    .clear-title {
      font-size: 1.8rem;
      font-weight: 900;
      color: #9333EA;
      margin-bottom: 8px;
    }

    .clear-subtitle {
      font-size: 1.15rem;
      font-weight: 800;
      color: #2F3E46;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .clear-btn {
      background: linear-gradient(135deg, #7C3AED, #5B21B6);
      color: white;
      border: none;
      padding: 14px 32px;
      border-radius: 24px;
      font-size: 1.25rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 5px 0 #3B0764;
      touch-action: manipulation;
    }

    .clear-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #3B0764;
    }

    .confetti-particle {
      position: fixed;
      pointer-events: none;
      z-index: 10001;
      animation: confettiFall 2.4s linear forwards;
    }

    @keyframes confettiFall {
      0% { transform: translateY(-30px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(105vh) rotate(720deg); opacity: 0; }
    }
  </style>
</head>
<body onclick="ensureAudioResumed()">

  <div class="header-bar">
    <div class="user-profile" onclick="event.stopPropagation(); changePlayerName()">
      <span>🦄 <span id="player-name-display">小探險家</span> ✏️</span>
    </div>
    
    <div class="top-action-btns">
      <button class="action-btn gold" onclick="event.stopPropagation(); openLeaderboard()">🏆 堅果榜</button>
      <button class="action-btn" id="bgm-btn" onclick="event.stopPropagation(); toggleBGM()">🎵 龍貓音樂: 關閉</button>
    </div>
  </div>

  <div class="level-bar">
    <button class="level-btn" id="lvl-baby" onclick="switchLevel('baby')">🍼 幼兒先修</button>
    <button class="level-btn active" id="lvl-low" onclick="switchLevel('low')">🌱 低年級</button>
    <button class="level-btn" id="lvl-mid" onclick="switchLevel('mid')">🌿 中年級</button>
    <button class="level-btn" id="lvl-high" onclick="switchLevel('high')">🌳 高年級</button>
  </div>

  <div class="header-nav">
    <button class="nav-btn active" id="btn-math" onclick="switchSubject('math')">➕ 加減</button>
    <button class="nav-btn" id="btn-multiply" onclick="switchSubject('multiply')">✖️ 乘法</button>
    <button class="nav-btn" id="btn-chinese" onclick="switchSubject('chinese')">🌸 國語</button>
    <button class="nav-btn" id="btn-life" onclick="switchSubject('life')">🍃 生活</button>
    <button class="nav-btn" id="btn-nature" onclick="switchSubject('nature')">🔬 自然</button>
    <button class="nav-btn" id="btn-eng" onclick="switchSubject('english')">🔤 英文</button>
  </div>

  <div class="card" id="main-card">
    <div class="score-container">
      <div class="score-board">🌰 堅果數量: <span id="score">0</span> 顆</div>
      <div class="combo-badge" id="combo-badge">🔥 2 連勝!</div>
    </div>
    
    <!-- 闖關階段進度條 (每滿 5 顆星過一關) -->
    <div class="stage-progress-box">
      <div class="stage-text-row">
        <span id="current-stage-title">🚩 第 1 關進度</span>
        <span id="current-stage-counter">0 / 5 顆堅果</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="stage-progress-fill"></div>
      </div>
    </div>

    <div class="question-box">
      <div class="question-title" id="question">載入中...</div>
      <button class="audio-btn" id="audio-btn" style="display: none;" onclick="speakCurrentQuestion()">🔊 聽題目</button>
    </div>

    <div class="options-grid" id="options"></div>

    <div class="feedback-msg" id="feedback"></div>
  </div>

  <div class="modal-overlay" id="rank-modal" onclick="closeLeaderboard()">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-title">🏆 森林堅果英雄榜</div>
      <button class="test-anim-btn" onclick="triggerLevelClear(Math.floor(score/5) + 1)">🎬 測試過關慶祝動畫</button>

      <ul class="rank-list" id="rank-list-content"></ul>

      <div style="font-weight: 900; color: #3F2B63; width: 100%; margin-bottom: 6px;">📚 學習進度統計</div>
      <div class="stats-card">
        <div>➕ 加減法：<span id="stat-math">0</span> 題</div>
        <div>✖️ 乘法表：<span id="stat-multiply">0</span> 題</div>
        <div>🌸 國小國語：<span id="stat-chinese">0</span> 題</div>
        <div>🍃 生活常識：<span id="stat-life">0</span> 題</div>
        <div>🔬 自然科學：<span id="stat-nature">0</span> 題</div>
        <div>🔤 生活英文：<span id="stat-eng">0</span> 題</div>
      </div>

      <button class="close-modal-btn" onclick="closeLeaderboard()">繼續收集堅果！</button>
    </div>
  </div>

  <div class="level-clear-overlay" id="clear-modal">
    <div class="level-clear-card">
      <img src="https://img.icons8.com/color/180/my-little-pony.png" class="pony-dancer" alt="彩虹小馬跳舞">
      <div class="clear-title" id="clear-stage-text">🎉 闖關成功！</div>
      <div class="clear-subtitle" id="clear-desc-text">太棒了！紫悅送給你滿滿的友誼魔法大堅果！</div>
      <button class="clear-btn" onclick="resumeAfterClear()">🦄 領取魔法堅果，繼續闖關！</button>
    </div>
  </div>

  <script>
    let playerName = localStorage.getItem('kids_player_name') || '小寶貝';
    document.getElementById('player-name-display').innerText = playerName;

    let currentLevel = localStorage.getItem('kids_grade_level') || 'low';
    let currentSubject = 'math';
    let stats = JSON.parse(localStorage.getItem('kids_stats') || '{"math":0,"multiply":0,"chinese":0,"life":0,"nature":0,"english":0}');
    let score = parseInt(localStorage.getItem('kids_stars') || '0', 10);
    let combo = 0;
    let currentAnswer = null;
    let isProcessing = false;
    let lastCelebratedStage = Math.floor(score / 5);

    function updateProgressUI() {
      document.getElementById('score').innerText = score;
      const currentStage = Math.floor(score / 5) + 1;
      const stageProgress = score % 5;
      document.getElementById('current-stage-title').innerText = `🚩 第 ${currentStage} 關進度`;
      document.getElementById('current-stage-counter').innerText = `${stageProgress} / 5 顆堅果`;
      document.getElementById('stage-progress-fill').style.width = (stageProgress / 5 * 100) + '%';
    }

    function saveStats() {
      localStorage.setItem('kids_stats', JSON.stringify(stats));
      localStorage.setItem('kids_stars', score.toString());
      updateProgressUI();
      syncScoreToCloud();
    }

    function changePlayerName() {
      let newName = prompt('請輸入小探險家的新名字：', playerName);
      if (newName && newName.trim()) {
        playerName = newName.trim();
        localStorage.setItem('kids_player_name', playerName);
        document.getElementById('player-name-display').innerText = playerName;
        saveStats();
      }
    }

    // ==========================================
    // 真正的雲端跨裝置排行榜 (基於公共公共雲儲存)
    // ==========================================

    const totoroMelody = [
      { note: 67, dur: 0.35 }, { note: 69, dur: 0.35 }, { note: 71, dur: 0.7 },

    let audioCtx = null;
    let bgmTimer = null;
    let isBgmPlaying = false;
    let melodyIndex = 0;

    function getAudioContext() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      return audioCtx;
    }

    function ensureAudioResumed() {
      const ctx = getAudioContext();
      if (ctx.state === 'suspended') ctx.resume();
    }

    function playTotoroNote(midiNote, duration) {
      if (!isBgmPlaying) return;
      const ctx = getAudioContext();
      if (ctx.state === 'suspended') ctx.resume();

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = 'triangle';
      const freq = 440 * Math.pow(2, (midiNote - 69) / 12);
      osc.frequency.setValueAtTime(freq, ctx.currentTime);

      gain.gain.setValueAtTime(0, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.08, ctx.currentTime + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration + 0.05);
    }

    function stepTotoro() {
      if (!isBgmPlaying) return;
      const current = totoroMelody[melodyIndex % totoroMelody.length];
      playTotoroNote(current.note, current.dur);
      melodyIndex++;
      bgmTimer = setTimeout(stepTotoro, current.dur * 1000);
    }

    function startBGM() {
      ensureAudioResumed();
      isBgmPlaying = true;
      melodyIndex = 0;
      if (bgmTimer) clearTimeout(bgmTimer);
      stepTotoro();
      const btn = document.getElementById('bgm-btn');
      btn.innerText = '🎵 龍貓音樂: 播放中';
      btn.classList.add('playing');
    }

    function stopBGM() {
      isBgmPlaying = false;
      if (bgmTimer) clearTimeout(bgmTimer);
      const btn = document.getElementById('bgm-btn');
      btn.innerText = '🎵 龍貓音樂: 關閉';
      btn.classList.remove('playing');
    }

    function toggleBGM() {
      ensureAudioResumed();
      if (isBgmPlaying) stopBGM();
      else startBGM();
    }

    function playVictoryFanfare() {
      const ctx = getAudioContext();
      if (ctx.state === 'suspended') ctx.resume();

      const chords = [
        { notes: [60, 64, 67], time: 0, dur: 0.2 },
        { notes: [62, 65, 69], time: 0.22, dur: 0.2 },
        { notes: [64, 67, 71], time: 0.44, dur: 0.2 },
        { notes: [65, 69, 72, 76], time: 0.68, dur: 0.8 }
      ];

      chords.forEach(c => {
        c.notes.forEach(mid => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440 * Math.pow(2, (mid - 69) / 12), ctx.currentTime + c.time);
          gain.gain.setValueAtTime(0, ctx.currentTime + c.time);
          gain.gain.linearRampToValueAtTime(0.12, ctx.currentTime + c.time + 0.05);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + c.time + c.dur);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + c.time);
          osc.stop(ctx.currentTime + c.time + c.dur + 0.1);
        });
      });
    }

    function launchConfetti() {
      const icons = ['🌰', '⭐', '🦄', '💜', '🎉', '🌟', '✨'];
      for (let i = 0; i < 45; i++) {
        const p = document.createElement('div');
        p.className = 'confetti-particle';
        p.innerText = icons[Math.floor(Math.random() * icons.length)];
        p.style.left = Math.random() * 95 + 'vw';
        p.style.top = '-20px';
        p.style.fontSize = Math.floor(Math.random() * 16 + 18) + 'px';
        p.style.animationDuration = (Math.random() * 1.5 + 1.5) + 's';
        p.style.animationDelay = (Math.random() * 0.4) + 's';
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 3200);
      }
    }

    function triggerLevelClear(stageNum) {
      const wasBgmPlaying = isBgmPlaying;
      if (isBgmPlaying) stopBGM();

      playVictoryFanfare();
      launchConfetti();

      document.getElementById('clear-stage-text').innerText = `🎉 恭喜突破第 ${stageNum} 關！`;
      document.getElementById('clear-desc-text').innerHTML = `🌟 堅果小英雄 <b>${playerName}</b>！<br>你已經累積了 <b>${score}</b> 顆堅果！紫悅送給你滿滿的友誼魔法！`;
      document.getElementById('clear-modal').style.display = 'flex';

      window.__wasBgmPlaying = wasBgmPlaying;
    }

    function resumeAfterClear() {
      document.getElementById('clear-modal').style.display = 'none';
      if (window.__wasBgmPlaying) startBGM();
      nextQuestion();
    }

    // --- 出題控制 ---
    function nextQuestion() {
      isProcessing = false;
      document.getElementById('feedback').innerText = '';
      const optionsBox = document.getElementById('options');
      optionsBox.innerHTML = '';

      if (currentSubject === 'math') generateMathQuestion();
      else if (currentSubject === 'multiply') generateMultiplyQuestion();
      else if (currentSubject === 'chinese') generateGenericQuestion(chineseDB, 'chinese');
      else if (currentSubject === 'life') generateGenericQuestion(lifeDB, 'life');
      else if (currentSubject === 'nature') generateGenericQuestion(natureDB, 'nature');
      else generateEnglishQuestion();
    }

    function generateMathQuestion() {
      document.getElementById('audio-btn').style.display = 'none';
      const isAddition = Math.random() > 0.5;
      let a, b, ans;

      if (currentLevel === 'baby') {
        if (isAddition) {
          a = Math.floor(Math.random() * 5) + 1;
          b = Math.floor(Math.random() * 4) + 1;
          ans = a + b;
          document.getElementById('question').innerText = `${a} ➕ ${b} ＝ ?`;
        } else {
          a = Math.floor(Math.random() * 6) + 4;
          b = Math.floor(Math.random() * (a - 1)) + 1;
          ans = a - b;
          document.getElementById('question').innerText = `${a} ➖ ${b} ＝ ?`;
        }
      } else if (currentLevel === 'low') {
        if (isAddition) {
          a = Math.floor(Math.random() * 12) + 5;
          b = Math.floor(Math.random() * 8) + 3;
          ans = a + b;
          document.getElementById('question').innerText = `${a} ➕ ${b} ＝ ?`;
        } else {
          a = Math.floor(Math.random() * 12) + 8;
          b = Math.floor(Math.random() * (a - 2)) + 1;
          ans = a - b;
          document.getElementById('question').innerText = `${a} ➖ ${b} ＝ ?`;
        }
      } else if (currentLevel === 'mid') {
        if (isAddition) {
          a = Math.floor(Math.random() * 45) + 18;
          b = Math.floor(Math.random() * 35) + 12;
          ans = a + b;
          document.getElementById('question').innerText = `${a} ➕ ${b} ＝ ?`;
        } else {
          a = Math.floor(Math.random() * 50) + 35;
          b = Math.floor(Math.random() * 25) + 14;
          ans = a - b;
          document.getElementById('question').innerText = `${a} ➖ ${b} ＝ ?`;
        }
      } else {
        if (isAddition) {
          a = Math.floor(Math.random() * 350) + 125;
          b = Math.floor(Math.random() * 250) + 98;
          ans = a + b;
          document.getElementById('question').innerText = `${a} ➕ ${b} ＝ ?`;
        } else {
          a = Math.floor(Math.random() * 400) + 300;
          b = Math.floor(Math.random() * 200) + 85;
          ans = a - b;
          document.getElementById('question').innerText = `${a} ➖ ${b} ＝ ?`;
        }
      }

      currentAnswer = ans;
      let options = [ans];
      const offsets = [-10, 10, -1, 1];
      for (let offset of offsets) {
        let fake = ans + offset;
        if (fake >= 0 && !options.includes(fake)) options.push(fake);
        if (options.length === 4) break;
      }
      while (options.length < 4) {
        let fake = ans + Math.floor(Math.random() * 11) - 5;
        if (fake >= 0 && !options.includes(fake)) options.push(fake);
      }
      options.sort(() => Math.random() - 0.5);
      renderButtons(options, (val) => val === currentAnswer, false);
    }

    function generateMultiplyQuestion() {
      document.getElementById('audio-btn').style.display = 'none';
      let a, b;
      if (currentLevel === 'baby' || currentLevel === 'low') {
        a = Math.floor(Math.random() * 4) + 2;
        b = Math.floor(Math.random() * 9) + 1;
      } else if (currentLevel === 'mid') {
        a = Math.floor(Math.random() * 8) + 2;
        b = Math.floor(Math.random() * 9) + 1;
      } else {
        a = Math.floor(Math.random() * 15) + 11;
        b = Math.floor(Math.random() * 7) + 3;
      }
      const ans = a * b;
      currentAnswer = ans;
      document.getElementById('question').innerText = `${a} ✖️ ${b} ＝ ?`;

      let options = [ans];
      const offsets = [-a, a, 1, -1];
      for (let offset of offsets) {
        let fake = ans + offset;
        if (fake > 0 && !options.includes(fake)) options.push(fake);
        if (options.length === 4) break;
      }
      while (options.length < 4) {
        let fake = ans + Math.floor(Math.random() * 9) - 4;
        if (fake > 0 && !options.includes(fake)) options.push(fake);
      }
      options.sort(() => Math.random() - 0.5);
      renderButtons(options, (val) => val === currentAnswer, false);
    }

    function generateGenericQuestion(database, subjectName) {
      const qData = getNextItem(database, subjectName);
      currentAnswer = qData;
      document.getElementById('question').innerText = qData.q;
      document.getElementById('audio-btn').style.display = 'inline-block';
      setTimeout(() => speakCurrentQuestion(), 150);

      const isBabyPic = (currentLevel === 'baby' && subjectName === 'chinese');
      const options = [...qData.options].sort(() => Math.random() - 0.5);
      renderButtons(options, (val) => val === currentAnswer.ans, isBabyPic);
    }

    function generateEnglishQuestion() {
      document.getElementById('audio-btn').style.display = 'inline-block';
      const item = getNextItem(englishDB, 'english');
      currentAnswer = item;
      document.getElementById('question').innerText = item.word;
      setTimeout(() => speakCurrentQuestion(), 150);

      const fullList = englishDB[currentLevel];
      let options = [item.zh];
      while (options.length < 4) {
        let fake = fullList[Math.floor(Math.random() * fullList.length)].zh;
        if (!options.includes(fake)) options.push(fake);
      }
      options.sort(() => Math.random() - 0.5);
      renderButtons(options, (val) => val === currentAnswer.zh, false);
    }

    function renderButtons(list, checkFn, isPicMode) {
      const box = document.getElementById('options');
      list.forEach(val => {
        const btn = document.createElement('button');
        btn.className = `option-btn ${isPicMode ? 'pic-mode' : ''}`;
        btn.innerText = val;
        btn.onclick = (e) => {
          e.stopPropagation();
          ensureAudioResumed();
          handleChoice(btn, checkFn(val));
        };
        box.appendChild(btn);
      });
    }

    function handleChoice(btn, isCorrect) {
      if (isProcessing) return;

      if (isCorrect) {
        isProcessing = true;
        btn.classList.add('correct');
        combo += 1;
        updateComboUI();
        score += 1;

        if (currentSubject === 'math') stats.math += 1;
        else if (currentSubject === 'multiply') stats.multiply += 1;
        else if (currentSubject === 'chinese') stats.chinese += 1;
        else if (currentSubject === 'life') stats.life += 1;
        else if (currentSubject === 'nature') stats.nature += 1;
        else if (currentSubject === 'english') stats.english += 1;

        saveStats();

        // 檢查是否突破關卡 (每滿 5 顆堅果)
        let currentStage = Math.floor(score / 5);
        if (currentStage > lastCelebratedStage && score > 0) {
          lastCelebratedStage = currentStage;
          setTimeout(() => {
            triggerLevelClear(currentStage);
          }, 400);
          return;
        }

        document.getElementById('feedback').innerText = `🎉 ${playerName} 答對了！獲得1顆堅果 🌰`;
        setTimeout(() => nextQuestion(), 950);
      } else {
        btn.classList.add('wrong');
        combo = 0;
        updateComboUI();

        if (score > 0) score -= 1;
        saveStats();

        document.getElementById('feedback').innerText = `🍂 算錯了喔，掉落1顆堅果！再試一次！`;
        setTimeout(() => btn.classList.remove('wrong'), 800);
      }
    }

    switchLevel(currentLevel);
    saveStats();
  </script>
