<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>歡樂學習樂園</title>
  
  <!-- iPad 全螢幕與桌面專屬 Icon 設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="歡樂學習">
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/twitter/twemoji/master/assets/72x72/1f330.png">
<link rel="apple-touch-icon" sizes="180x180" href="https://raw.githubusercontent.com/twitter/twemoji/master/assets/72x72/1f330.png">
  <link rel="icon" href="https://api.iconify.design/noto:acorn.svg">

  <style>
    :root {
      --primary: #52796F;
      --secondary: #84A98C;
      --success: #2ECC71;
      --danger: #E74C3C;
      --card-bg: rgba(255, 255, 255, 0.94);
      --text: #2F3E46;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Noto Sans TC", sans-serif;
      background: url('https://images.unsplash.com/photo-1542273917363-3b1817f69a2d?auto=format&fit=crop&q=80&w=1200') no-repeat center center fixed;
      background-size: cover;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, rgba(216,243,220,0.4) 100%);
      z-index: -1;
    }

    .header-bar {
      width: 100%;
      max-width: 650px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      background: rgba(255, 255, 255, 0.85);
      padding: 8px 16px;
      border-radius: 50px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      border: 2px solid #CAD2C5;
    }

    .title-area {
      font-size: 1.35rem;
      font-weight: 900;
      color: #354F52;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .bgm-btn {
      background: #84A98C;
      color: white;
      border: none;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 0 #52796F;
      display: flex;
      align-items: center;
      gap: 4px;
      touch-action: manipulation;
    }

    .bgm-btn.playing {
      background: #E07A5F;
      box-shadow: 0 3px 0 #B0533C;
    }

    .header-nav {
      width: 100%;
      max-width: 650px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 16px;
    }

    .nav-btn {
      flex: 1;
      padding: 12px 6px;
      font-size: 1.1rem;
      font-weight: 700;
      border: 2px solid #CAD2C5;
      border-radius: 20px;
      background: #ECEFE6;
      color: var(--text);
      cursor: pointer;
      box-shadow: 0 4px 0 #CAD2C5;
      transition: all 0.1s ease;
      touch-action: manipulation;
    }

    .nav-btn.active {
      background: var(--primary);
      color: white;
      border-color: #354F52;
      box-shadow: 0 4px 0 #2F3E46;
      transform: translateY(2px);
    }

    .card {
      background: var(--card-bg);
      width: 100%;
      max-width: 650px;
      border-radius: 32px;
      padding: 24px 20px;
      border: 3px solid #CAD2C5;
      box-shadow: 0 12px 30px rgba(47, 62, 70, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 490px;
      position: relative;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .card.bounce {
      transform: scale(1.02);
    }

    .score-container {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .score-board {
      font-size: 1.35rem;
      font-weight: 700;
      color: #D88C51;
    }

    .combo-badge {
      font-size: 1.05rem;
      font-weight: 800;
      color: #E76F51;
      background: #FFE8D6;
      padding: 3px 10px;
      border-radius: 12px;
      display: none;
      animation: pulse 0.8s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.1); }
    }

    .rank-bar {
      font-size: 0.95rem;
      font-weight: 700;
      color: #52796F;
      margin-bottom: 12px;
      background: #D8F3DC;
      padding: 4px 14px;
      border-radius: 16px;
    }

    .question-box {
      min-height: 140px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
      text-align: center;
    }

    .question-title {
      font-size: 2.9rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: #2F3E46;
      margin: 0;
    }

    .audio-btn {
      background: #EAF4F4;
      color: var(--primary);
      border: 2px solid var(--primary);
      padding: 10px 24px;
      border-radius: 24px;
      font-size: 1.2rem;
      font-weight: bold;
      margin-top: 12px;
      cursor: pointer;
      box-shadow: 0 3px 0 #CAD2C5;
      touch-action: manipulation;
    }

    .audio-btn:active {
      transform: translateY(2px);
      box-shadow: none;
    }

    .options-grid {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 18px;
    }

    .option-btn {
      min-height: 90px;
      font-size: 1.8rem;
      font-weight: bold;
      border: 3px solid #CAD2C5;
      border-radius: 24px;
      background: #FFFFFF;
      color: var(--text);
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 6px 0 #CAD2C5;
      transition: all 0.1s ease;
      touch-action: manipulation;
    }

    .option-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #CAD2C5;
    }

    .option-btn.correct {
      background: #D8F3DC;
      border-color: var(--success);
      color: #1B4332;
    }

    .option-btn.wrong {
      background: #FFE3E3;
      border-color: var(--danger);
      color: #5C0E0E;
    }

    .feedback-msg {
      font-size: 1.45rem;
      font-weight: bold;
      height: 38px;
      color: #354F52;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .reset-btn {
      background: none;
      border: none;
      color: #95A5A6;
      font-size: 0.85rem;
      text-decoration: underline;
      cursor: pointer;
      margin-top: 6px;
    }

    .particle {
      position: absolute;
      pointer-events: none;
      animation: fall 1.2s forwards;
    }
    @keyframes fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(120px) rotate(180deg); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <div class="title-area">🪵 歡樂學習森林</div>
    <button class="bgm-btn" id="bgm-btn" onclick="toggleBGM()">🎵 播放冒險音樂</button>
  </div>

  <div class="header-nav">
    <button class="nav-btn active" id="btn-math" onclick="switchSubject('math')">🥔 加減法</button>
    <button class="nav-btn" id="btn-multiply" onclick="switchSubject('multiply')">🌰 九九乘法</button>
    <button class="nav-btn" id="btn-eng" onclick="switchSubject('english')">🌱 英文挑戰</button>
  </div>

  <div class="card" id="main-card">
    <div class="score-container">
      <div class="score-board">⭐ 橡果星星: <span id="score">0</span></div>
      <div class="combo-badge" id="combo-badge">🔥 2 連勝!</div>
    </div>
    
    <div class="rank-bar" id="rank-bar">稱號：森林小見習生 🌿</div>

    <div class="question-box">
      <div class="question-title" id="question">森林探險準備中...</div>
      <button class="audio-btn" id="audio-btn" style="display: none;" onclick="speakWord()">🔊 聽聽看</button>
    </div>

    <div class="options-grid" id="options"></div>

    <div class="feedback-msg" id="feedback"></div>
    <button class="reset-btn" onclick="resetScore()">重置星星</button>
  </div>

  <script>
    let currentSubject = 'math';
    let score = parseInt(localStorage.getItem('kids_stars') || '0', 10);
    let combo = 0;
    let currentAnswer = null;
    let isProcessing = false;

    // --- 40 個國小高頻生活英文單字庫 ---
    const allEnglishWords = [
      { word: "Cat", zh: "貓咪" }, { word: "Dog", zh: "狗狗" }, { word: "Apple", zh: "蘋果" },
      { word: "Book", zh: "書本" }, { word: "Red", zh: "紅色" }, { word: "Blue", zh: "藍色" },
      { word: "Star", zh: "星星" }, { word: "Fish", zh: "小魚" }, { word: "Bird", zh: "小鳥" },
      { word: "Car", zh: "汽車" }, { word: "Sun", zh: "太陽" }, { word: "Moon", zh: "月亮" },
      { word: "Tree", zh: "大樹" }, { word: "Water", zh: "水" }, { word: "Milk", zh: "牛奶" },
      { word: "Bread", zh: "麵包" }, { word: "Egg", zh: "雞蛋" }, { word: "Banana", zh: "香蕉" },
      { word: "Bear", zh: "小熊" }, { word: "Rabbit", zh: "兔子" }, { word: "Pencil", zh: "鉛筆" },
      { word: "School", zh: "學校" }, { word: "Bag", zh: "書包" }, { word: "Flower", zh: "花朵" },
      { word: "Rain", zh: "下雨" }, { word: "Wind", zh: "微風" }, { word: "Green", zh: "綠色" },
      { word: "Yellow", zh: "黃色" }, { word: "Duck", zh: "鴨子" }, { word: "Frog", zh: "青蛙" },
      { word: "Hand", zh: "手" }, { word: "Eye", zh: "眼睛" }, { word: "Nose", zh: "鼻子" },
      { word: "Mouth", zh: "嘴巴" }, { word: "Door", zh: "門" }, { word: "Chair", zh: "椅子" },
      { word: "Hat", zh: "帽子" }, { word: "Shoe", zh: "鞋子" }, { word: "Smile", zh: "微笑" },
      { word: "Heart", zh: "愛心" }
    ];

    // 防重複抽牌袋（Shuffle Bag）
    let remainingWords = [];
    function getNextEnglishWord() {
      if (remainingWords.length === 0) {
        remainingWords = [...allEnglishWords].sort(() => Math.random() - 0.5);
      }
      return remainingWords.pop();
    }

    function updateRankUI() {
      document.getElementById('score').innerText = score;
      const rankBar = document.getElementById('rank-bar');
      if (score >= 50) {
        rankBar.innerText = '稱號：森林守護大龍貓 👑✨';
      } else if (score >= 30) {
        rankBar.innerText = '稱號：神祕森林精靈 🌟';
      } else if (score >= 15) {
        rankBar.innerText = '稱號：活潑小松鼠 🌰';
      } else if (score >= 5) {
        rankBar.innerText = '稱號：好奇探險家 🎒';
      } else {
        rankBar.innerText = '稱號：森林小見習生 🌿';
      }
    }
    updateRankUI();

    function resetScore() {
      if (confirm('確定要把收集的星星歸零重新開始嗎？')) {
        score = 0;
        combo = 0;
        localStorage.setItem('kids_stars', '0');
        updateComboUI();
        updateRankUI();
      }
    }

    function updateComboUI() {
      const badge = document.getElementById('combo-badge');
      if (combo >= 2) {
        badge.innerText = `🔥 ${combo} 連勝!`;
        badge.style.display = 'block';
      } else {
        badge.style.display = 'none';
      }
    }

    // 發音引擎優化
    let preferredVoice = null;
    function initVoices() {
      if (!('speechSynthesis' in window)) return;
      const voices = window.speechSynthesis.getVoices();
      if (!voices.length) return;
      preferredVoice = voices.find(v => (v.name.includes('Samantha') || v.name.includes('Ava') || v.name.includes('Alex')) && v.lang.startsWith('en'))
                    || voices.find(v => v.lang === 'en-US' && !v.name.includes('Sin-ji'))
                    || voices.find(v => v.lang.startsWith('en'));
    }
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = initVoices;
      initVoices();
    }

    function speakWord() {
      if (!('speechSynthesis' in window) || !currentAnswer || !currentAnswer.word) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(currentAnswer.word);
      if (preferredVoice) utterance.voice = preferredVoice;
      utterance.lang = 'en-US';
      utterance.rate = 0.8;
      utterance.pitch = 1.1;
      window.speechSynthesis.speak(utterance);
    }

    // 音樂合成器
    let audioCtx = null;
    let bgmInterval = null;
    let isBgmPlaying = false;
    let synthVol = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        synthVol = audioCtx.createGain();
        synthVol.gain.value = 0.05;
        synthVol.connect(audioCtx.destination);
      }
    }

    const melody = [
      60, 64, 67, 72, 71, 67, 64, 62,
      60, 64, 67, 72, 74, 76, 79, 76,
      74, 72, 69, 72, 71, 67, 64, 62,
      60, 64, 67, 72, 71, 67, 64, 60
    ];
    let noteIndex = 0;

    function playGhibliMelody() {
      if (!isBgmPlaying) return;
      const osc = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      osc.type = 'triangle';
      const midNote = melody[noteIndex % melody.length];
      const freq = 440 * Math.pow(2, (midNote - 69) / 12);
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
      gainNode.gain.linearRampToValueAtTime(0.06, audioCtx.currentTime + 0.05);
      gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.55);
      osc.connect(gainNode);
      gainNode.connect(synthVol);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.6);

      if (noteIndex % 3 === 0) {
        const bassOsc = audioCtx.createOscillator();
        const bassGain = audioCtx.createGain();
        bassOsc.type = 'sine';
        const bassNote = midNote - 12;
        bassOsc.frequency.setValueAtTime(440 * Math.pow(2, (bassNote - 69) / 12), audioCtx.currentTime);
        bassGain.gain.setValueAtTime(0, audioCtx.currentTime);
        bassGain.gain.linearRampToValueAtTime(0.03, audioCtx.currentTime + 0.1);
        bassGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.9);
        bassOsc.connect(bassGain);
        bassGain.connect(synthVol);
        bassOsc.start();
        bassOsc.stop(audioCtx.currentTime + 1.0);
      }
      noteIndex++;
    }

    function toggleBGM() {
      initAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const btn = document.getElementById('bgm-btn');
      if (isBgmPlaying) {
        isBgmPlaying = false;
        clearInterval(bgmInterval);
        btn.innerText = '🎵 播放冒險音樂';
        btn.classList.remove('playing');
      } else {
        isBgmPlaying = true;
        bgmInterval = setInterval(playGhibliMelody, 350);
        btn.innerText = '⏸ 暫停冒險音樂';
        btn.classList.add('playing');
      }
    }

    function playBeep(isSuccess) {
      initAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (isSuccess) {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
        osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.08);
        osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.16);
        osc.frequency.setValueAtTime(1046.50, audioCtx.currentTime + 0.24);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.55);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.55);
      } else {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(293.66, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(180, audioCtx.currentTime + 0.25);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.25);
      }
    }

    function createParticles(element, type) {
      const rect = element.getBoundingClientRect();
      const count = type === 'leaf' ? 14 : 6;
      for (let i = 0; i < count; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = `${rect.left + rect.width / 2 + (Math.random() - 0.5) * 80}px`;
        particle.style.top = `${rect.top + rect.height / 2 + (Math.random() - 0.5) * 40}px`;
        particle.style.fontSize = `${Math.floor(Math.random() * 12) + 18}px`;
        if (type === 'leaf') {
          const leaves = ['🍃', '🍂', '🍁', '✨', '⭐', '🌰'];
          particle.innerText = leaves[Math.floor(Math.random() * leaves.length)];
        } else {
          particle.innerText = '🌀';
        }
        document.body.appendChild(particle);
        setTimeout(() => particle.remove(), 1200);
      }
    }

    function switchSubject(subject) {
      currentSubject = subject;
      combo = 0;
      updateComboUI();
      document.getElementById('btn-math').className = `nav-btn ${subject === 'math' ? 'active' : ''}`;
      document.getElementById('btn-multiply').className = `nav-btn ${subject === 'multiply' ? 'active' : ''}`;
      document.getElementById('btn-eng').className = `nav-btn ${subject === 'english' ? 'active' : ''}`;
      nextQuestion();
    }

    function nextQuestion() {
      isProcessing = false;
      document.getElementById('feedback').innerText = '';
      const optionsBox = document.getElementById('options');
      optionsBox.innerHTML = '';

      if (currentSubject === 'math') {
        generateMathQuestion();
      } else if (currentSubject === 'multiply') {
        generateMultiplyQuestion();
      } else {
        generateEnglishQuestion();
      }
    }

    function generateMathQuestion() {
      document.getElementById('audio-btn').style.display = 'none';
      const isAddition = Math.random() > 0.4;
      let a, b, ans;

      if (isAddition) {
        a = Math.floor(Math.random() * 15) + 1;
        b = Math.floor(Math.random() * 10) + 1;
        ans = a + b;
        document.getElementById('question').innerText = `${a} ➕ ${b} ＝ ?`;
      } else {
        a = Math.floor(Math.random() * 18) + 2;
        b = Math.floor(Math.random() * a) + 1;
        ans = a - b;
        document.getElementById('question').innerText = `${a} ➖ ${b} ＝ ?`;
      }

      currentAnswer = ans;
      let options = [ans];
      while (options.length < 4) {
        let fake = ans + (Math.floor(Math.random() * 7) - 3);
        if (fake >= 0 && !options.includes(fake)) options.push(fake);
      }
      options.sort(() => Math.random() - 0.5);
      renderButtons(options, (val) => val === currentAnswer);
    }

    function generateMultiplyQuestion() {
      document.getElementById('audio-btn').style.display = 'none';
      const a = Math.floor(Math.random() * 8) + 2;
      const b = Math.floor(Math.random() * 9) + 1;
      const ans = a * b;

      currentAnswer = ans;
      document.getElementById('question').innerText = `${a} ✖️ ${b} ＝ ?`;

      let options = [ans];
      const offsets = [-a, a, -1, 1, -2, 2, 10, -10];
      offsets.sort(() => Math.random() - 0.5);

      for (let offset of offsets) {
        let fake = ans + offset;
        if (fake > 0 && !options.includes(fake)) options.push(fake);
        if (options.length === 4) break;
      }

      while (options.length < 4) {
        let fake = (Math.floor(Math.random() * 8) + 2) * (Math.floor(Math.random() * 9) + 1);
        if (!options.includes(fake)) options.push(fake);
      }
      options.sort(() => Math.random() - 0.5);
      renderButtons(options, (val) => val === currentAnswer);
    }

    function generateEnglishQuestion() {
      document.getElementById('audio-btn').style.display = 'inline-block';
      const item = getNextEnglishWord();
      currentAnswer = item;

      document.getElementById('question').innerText = item.word;
      setTimeout(() => speakWord(), 150);

      let options = [item.zh];
      while (options.length < 4) {
        let fakeItem = allEnglishWords[Math.floor(Math.random() * allEnglishWords.length)];
        if (!options.includes(fakeItem.zh)) options.push(fakeItem.zh);
      }
      options.sort(() => Math.random() - 0.5);
      renderButtons(options, (val) => val === currentAnswer.zh);
    }

    function renderButtons(list, checkCorrectFn) {
      const optionsBox = document.getElementById('options');
      list.forEach(val => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = val;
        btn.onclick = () => handleChoice(btn, checkCorrectFn(val));
        optionsBox.appendChild(btn);
      });
    }

    function handleChoice(btn, isCorrect) {
      if (isProcessing) return;

      const card = document.getElementById('main-card');

      if (isCorrect) {
        isProcessing = true;
        btn.classList.add('correct');
        playBeep(true);
        createParticles(btn, 'leaf');

        // 卡片彈跳反饋
        card.classList.add('bounce');
        setTimeout(() => card.classList.remove('bounce'), 250);

        combo += 1;
        updateComboUI();

        score += 1;
        localStorage.setItem('kids_stars', score.toString());
        updateRankUI();

        const encourageMsg = ['🌰 撿到一顆橡果！', '🍂 太厲害了！', '✨ 獲得森林祝福！', '🎉 答對了！'];
        document.getElementById('feedback').innerHTML = encourageMsg[Math.floor(Math.random() * encourageMsg.length)];

        setTimeout(() => {
          nextQuestion();
        }, 1100);
      } else {
        btn.classList.add('wrong');
        playBeep(false);
        createParticles(btn, 'wrong');
        combo = 0;
        updateComboUI();
        document.getElementById('feedback').innerHTML = '🍃 森林守護者拍了拍你（再試一次喔）';
        setTimeout(() => {
          btn.classList.remove('wrong');
        }, 850);
      }
    }

    nextQuestion();
  </script>
</body>
</html>
