<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>歡樂學習樂園</title>
  <style>
    :root {
      --primary: #52796F;      /* 森林墨綠 */
      --secondary: #84A98C;    /* 草綠色 */
      --success: #2ECC71;
      --danger: #E74C3C;
      --card-bg: rgba(255, 255, 255, 0.94); /* 半透明手繪質感 */
      --text: #2F3E46;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Noto Sans TC", sans-serif;
      /* 載入吉卜力插圖作為整體背景 */
      background: url('https://images.unsplash.com/photo-1542273917363-3b1817f69a2d?auto=format&fit=crop&q=80&w=1200') no-repeat center center fixed;
      background-size: cover;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* 手繪風格森林與生物插畫裝飾 (背景模糊效果) */
    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, rgba(216,243,220,0.4) 100%);
      z-index: -1;
    }

    /* BGM 控制區與標題 */
    .header-bar {
      width: 100%;
      max-width: 650px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      background: rgba(255, 255, 255, 0.85);
      padding: 8px 16px;
      border-radius: 50px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      border: 2px solid #CAD2C5;
    }

    .title-area {
      font-size: 1.5rem;
      font-weight: 900;
      color: #354F52;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .bgm-btn {
      background: #84A98C;
      color: white;
      border: none;
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 0 #52796F;
      display: flex;
      align-items: center;
      gap: 4px;
      touch-action: manipulation;
    }

    .bgm-btn.playing {
      background: #E07A5F;
      box-shadow: 0 3px 0 #B0533C;
    }

    /* 模式切換按鈕 (圓潤手繪風) */
    .header-nav {
      width: 100%;
      max-width: 650px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 16px;
    }

    .nav-btn {
      flex: 1;
      padding: 12px 6px;
      font-size: 1.1rem;
      font-weight: 700;
      border: 2px solid #CAD2C5;
      border-radius: 20px;
      background: #ECEFE6;
      color: var(--text);
      cursor: pointer;
      box-shadow: 0 4px 0 #CAD2C5;
      transition: all 0.1s ease;
      touch-action: manipulation;
    }

    .nav-btn.active {
      background: var(--primary);
      color: white;
      border-color: #354F52;
      box-shadow: 0 4px 0 #2F3E46;
      transform: translateY(2px);
    }

    /* 主遊戲卡片 */
    .card {
      background: var(--card-bg);
      width: 100%;
      max-width: 650px;
      border-radius: 32px;
      padding: 24px 20px;
      border: 3px solid #CAD2C5;
      box-shadow: 0 12px 30px rgba(47, 62, 70, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 480px;
      position: relative;
    }

    /* 吉卜力氛圍小怪獸與植物裝飾 */
    .card::after {
      content: "🍃";
      position: absolute;
      bottom: -15px;
      right: 25px;
      font-size: 1.8rem;
    }

    .card::before {
      content: "🐾";
      position: absolute;
      bottom: -15px;
      left: 25px;
      font-size: 1.8rem;
    }

    .score-board {
      font-size: 1.35rem;
      font-weight: 700;
      color: #D88C51; /* 溫馨橘 */
      margin-bottom: 12px;
    }

    .question-box {
      min-height: 140px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin-bottom: 25px;
      text-align: center;
    }

    .question-title {
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: #2F3E46;
      margin: 0;
    }

    .audio-btn {
      background: #EAF4F4;
      color: var(--primary);
      border: 2px solid var(--primary);
      padding: 10px 24px;
      border-radius: 24px;
      font-size: 1.2rem;
      font-weight: bold;
      margin-top: 12px;
      cursor: pointer;
      box-shadow: 0 3px 0 #CAD2C5;
      touch-action: manipulation;
    }

    .audio-btn:active {
      transform: translateY(2px);
      box-shadow: none;
    }

    /* 觸控大按鈕（手繪圓潤框線） */
    .options-grid {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }

    .option-btn {
      min-height: 90px;
      font-size: 1.8rem;
      font-weight: bold;
      border: 3px solid #CAD2C5;
      border-radius: 24px;
      background: #FFFFFF;
      color: var(--text);
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 6px 0 #CAD2C5;
      transition: all 0.1s ease;
      touch-action: manipulation;
    }

    .option-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #CAD2C5;
    }

    .option-btn.correct {
      background: #D8F3DC;
      border-color: var(--success);
      color: #1B4332;
    }

    .option-btn.wrong {
      background: #FFE3E3;
      border-color: var(--danger);
      color: #5C0E0E;
    }

    .feedback-msg {
      font-size: 1.5rem;
      font-weight: bold;
      height: 35px;
      color: #354F52;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 落葉與光點粒子特效 */
    .particle {
      position: absolute;
      pointer-events: none;
      animation: fall 1.2s forwards;
    }
    @keyframes fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(120px) rotate(180deg); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- BGM 與標題區 -->
  <div class="header-bar">
    <div class="title-area">🪵 歡樂學習森林</div>
    <button class="bgm-btn" id="bgm-btn" onclick="toggleBGM()">🎵 播放冒險音樂</button>
  </div>

  <div class="header-nav">
    <button class="nav-btn active" id="btn-math" onclick="switchSubject('math')">🥔 加減法</button>
    <button class="nav-btn" id="btn-multiply" onclick="switchSubject('multiply')">🌰 九九乘法</button>
    <button class="nav-btn" id="btn-eng" onclick="switchSubject('english')">🌱 英文挑戰</button>
  </div>

  <div class="card" id="main-card">
    <div class="score-board">⭐ 橡果星星: <span id="score">0</span></div>

    <div class="question-box">
      <div class="question-title" id="question">森林探險準備中...</div>
      <button class="audio-btn" id="audio-btn" style="display: none;" onclick="speakWord()">🔊 聽聽看</button>
    </div>

    <div class="options-grid" id="options"></div>

    <div class="feedback-msg" id="feedback"></div>
  </div>

  <script>
    let currentSubject = 'math';
    let score = 0;
    let currentAnswer = null;
    let isProcessing = false;

    const englishWords = [
      { word: "Cat", zh: "貓咪" }, { word: "Dog", zh: "狗狗" }, { word: "Apple", zh: "蘋果" },
      { word: "Book", zh: "書本" }, { word: "Red", zh: "紅色" }, { word: "Blue", zh: "藍色" },
      { word: "Star", zh: "星星" }, { word: "Fish", zh: "小魚" }, { word: "Bird", zh: "小鳥" },
      { word: "Car", zh: "汽車" }, { word: "Sun", zh: "太陽" }, { word: "Moon", zh: "月亮" }
    ];

    // --- 優化發音引擎：精準挑選美式英語自然音 ---
    let preferredVoice = null;
    function initVoices() {
      if (!('speechSynthesis' in window)) return;
      const voices = window.speechSynthesis.getVoices();
      if (!voices.length) return;
      preferredVoice = voices.find(v => (v.name.includes('Samantha') || v.name.includes('Ava') || v.name.includes('Alex')) && v.lang.startsWith('en'))
                    || voices.find(v => v.lang === 'en-US' && !v.name.includes('Sin-ji'))
                    || voices.find(v => v.lang.startsWith('en'));
    }
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = initVoices;
      initVoices();
    }

    function speakWord() {
      if (!('speechSynthesis' in window) || !currentAnswer || !currentAnswer.word) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(currentAnswer.word);
      if (preferredVoice) utterance.voice = preferredVoice;
      utterance.lang = 'en-US';
      utterance.rate = 0.8;  // 稍微放慢，發音更圓潤清楚
      utterance.pitch = 1.1; // 稍微帶點活潑的孩子感
      window.speechSynthesis.speak(utterance);
    }

    // --- 超輕量合成器：手繪風/吉卜力風 背景音樂 (Web Audio API) ---
    let audioCtx = null;
    let bgmInterval = null;
    let isBgmPlaying = false;
    let synthVol = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        synthVol = audioCtx.createGain();
        synthVol.gain.value = 0.05; // 輕柔不刺耳
        synthVol.connect(audioCtx.destination);
      }
    }

    // 吉卜力風格「溫馨、慢速三拍子」和弦與旋律音符 (以 A 小調與 C 大調為主)
    const melody = [
      60, 64, 67, 72, 71, 67, 64, 62,
      60, 64, 67, 72, 74, 76, 79, 76,
      74, 72, 69, 72, 71, 67, 64, 62,
      60, 64, 67, 72, 71, 67, 64, 60
    ]; // 鋼琴、鐵琴音高
    let noteIndex = 0;

    function playGhibliMelody() {
      if (!isBgmPlaying) return;
      const osc = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      
      // 使用三角波（類似溫柔的笛子或鐵琴）
      osc.type = 'triangle';
      
      const midNote = melody[noteIndex % melody.length];
      const freq = 440 * Math.pow(2, (midNote - 69) / 12);
      
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      
      gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
      gainNode.gain.linearRampToValueAtTime(0.06, audioCtx.currentTime + 0.05); // 緩慢漸強
      gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.55); // 緩慢消退
      
      osc.connect(gainNode);
      gainNode.connect(synthVol);
      
      osc.start();
      osc.stop(audioCtx.currentTime + 0.6);
      
      // 伴奏和弦 (低音，增強溫暖度)
      if (noteIndex % 3 === 0) {
        const bassOsc = audioCtx.createOscillator();
        const bassGain = audioCtx.createGain();
        bassOsc.type = 'sine';
        const bassNote = midNote - 12; // 低一個八度
        bassOsc.frequency.setValueAtTime(440 * Math.pow(2, (bassNote - 69) / 12), audioCtx.currentTime);
        bassGain.gain.setValueAtTime(0, audioCtx.currentTime);
        bassGain.gain.linearRampToValueAtTime(0.03, audioCtx.currentTime + 0.1);
        bassGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.9);
        bassOsc.connect(bassGain);
        bassGain.connect(synthVol);
        bassOsc.start();
        bassOsc.stop(audioCtx.currentTime + 1.0);
      }

      noteIndex++;
    }

    function toggleBGM() {
      initAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const btn = document.getElementById('bgm-btn');
      if (isBgmPlaying) {
        isBgmPlaying = false;
        clearInterval(bgmInterval);
        btn.innerText = '🎵 播放冒險音樂';
        btn.classList.remove('playing');
      } else {
        isBgmPlaying = true;
        // 每 0.35 秒播放一個溫柔的三八拍子音符
        bgmInterval = setInterval(playGhibliMelody, 350);
        btn.innerText = '⏸ 暫停冒險音樂';
        btn.classList.add('playing');
      }
    }

    // --- 答對、答錯的溫馨卡通音效 ---
    function playBeep(isSuccess) {
      initAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (isSuccess) {
        osc.type = 'triangle'; // 溫暖圓潤
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
        osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.08); // E5
        osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.16); // G5
        osc.frequency.setValueAtTime(1046.50, audioCtx.currentTime + 0.24); // C6 (歡呼、高潮)
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.55);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.55);
      } else {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(293.66, audioCtx.currentTime); // D4 (微弱彈簧感)
        osc.frequency.exponentialRampToValueAtTime(180, audioCtx.currentTime + 0.25);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.25);
      }
    }

    // --- 視覺特效：落葉與星光粒子落灑 ---
    function createParticles(element, type) {
      const rect = element.getBoundingClientRect();
      const count = 12;
      for (let i = 0; i < count; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = `${rect.left + rect.width / 2 + (Math.random() - 0.5) * 80}px`;
        particle.style.top = `${rect.top + rect.height / 2 + (Math.random() - 0.5) * 40}px`;
        particle.style.fontSize = `${Math.floor(Math.random() * 12) + 16}px`;
        
        if (type === 'leaf') {
          const leaves = ['🍃', '🍂', '🍁', '✨', '⭐'];
          particle.innerText = leaves[Math.floor(Math.random() * leaves.length)];
        } else {
          particle.innerText = '🌀';
        }

        document.body.appendChild(particle);
        setTimeout(() => particle.remove(), 1200);
      }
    }

    // --- 模式與關卡切換 ---
    function switchSubject(subject) {
      currentSubject = subject;
      document.getElementById('btn-math').className = `nav-btn ${subject === 'math' ? 'active' : ''}`;
      document.getElementById('btn-multiply').className = `nav-btn ${subject === 'multiply' ? 'active' : ''}`;
      document.getElementById('btn-eng').className = `nav-btn ${subject === 'english' ? 'active' : ''}`;
      nextQuestion();
    }

    function nextQuestion() {
      isProcessing = false;
      document.getElementById('feedback').innerText = '';
      const optionsBox = document.getElementById('options');
      optionsBox.innerHTML = '';

      if (currentSubject === 'math') {
        generateMathQuestion();
      } else if (currentSubject === 'multiply') {
        generateMultiplyQuestion();
      } else {
        generateEnglishQuestion();
      }
    }

    // 1. 基礎加減法
    function generateMathQuestion() {
      document.getElementById('audio-btn').style.display = 'none';
      const isAddition = Math.random() > 0.4;
      let a, b, ans;

      if (isAddition) {
        a = Math.floor(Math.random() * 15) + 1;
        b = Math.floor(Math.random() * 10) + 1;
        ans = a + b;
        document.getElementById('question').innerText = `${a} ➕ ${b} ＝ ?`;
      } else {
        a = Math.floor(Math.random() * 18) + 2;
        b = Math.floor(Math.random() * a) + 1;
        ans = a - b;
        document.getElementById('question').innerText = `${a} ➖ ${b} ＝ ?`;
      }

      currentAnswer = ans;
      let options = [ans];
      while (options.length < 4) {
        let fake = ans + (Math.floor(Math.random() * 7) - 3);
        if (fake >= 0 && !options.includes(fake)) options.push(fake);
      }
      options.sort(() => Math.random() - 0.5);
      renderButtons(options, (val) => val === currentAnswer);
    }

    // 2. 九九乘法 (2x1 ~ 9x9)
    function generateMultiplyQuestion() {
      document.getElementById('audio-btn').style.display = 'none';
      const a = Math.floor(Math.random() * 8) + 2;
      const b = Math.floor(Math.random() * 9) + 1;
      const ans = a * b;

      currentAnswer = ans;
      document.getElementById('question').innerText = `${a} ✖️ ${b} ＝ ?`;

      let options = [ans];
      const offsets = [-a, a, -1, 1, -2, 2, 10, -10];
      offsets.sort(() => Math.random() - 0.5);

      for (let offset of offsets) {
        let fake = ans + offset;
        if (fake > 0 && !options.includes(fake)) options.push(fake);
        if (options.length === 4) break;
      }

      while (options.length < 4) {
        let fake = (Math.floor(Math.random() * 8) + 2) * (Math.floor(Math.random() * 9) + 1);
        if (!options.includes(fake)) options.push(fake);
      }
      options.sort(() => Math.random() - 0.5);
      renderButtons(options, (val) => val === currentAnswer);
    }

    // 3. 英文單字
    function generateEnglishQuestion() {
      document.getElementById('audio-btn').style.display = 'inline-block';
      const item = englishWords[Math.floor(Math.random() * englishWords.length)];
      currentAnswer = item;

      document.getElementById('question').innerText = item.word;
      setTimeout(() => speakWord(), 150);

      let options = [item.zh];
      while (options.length < 4) {
        let fakeItem = englishWords[Math.floor(Math.random() * englishWords.length)];
        if (!options.includes(fakeItem.zh)) options.push(fakeItem.zh);
      }
      options.sort(() => Math.random() - 0.5);
      renderButtons(options, (val) => val === currentAnswer.zh);
    }

    function renderButtons(list, checkCorrectFn) {
      const optionsBox = document.getElementById('options');
      list.forEach(val => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = val;
        btn.onclick = () => handleChoice(btn, checkCorrectFn(val));
        optionsBox.appendChild(btn);
      });
    }

    function handleChoice(btn, isCorrect) {
      if (isProcessing) return;

      if (isCorrect) {
        isProcessing = true;
        btn.classList.add('correct');
        playBeep(true);
        createParticles(btn, 'leaf');
        score += 1;
        document.getElementById('score').innerText = score;
        
        const encourageMsg = ['🌰 撿到一顆橡果！', '🍂 太厲害了！', '✨ 獲得森林祝福！', '🎨 答對了！'];
        document.getElementById('feedback').innerHTML = encourageMsg[Math.floor(Math.random() * encourageMsg.length)];

        setTimeout(() => {
          nextQuestion();
        }, 1200);
      } else {
        btn.classList.add('wrong');
        playBeep(false);
        createParticles(btn, 'wrong');
        document.getElementById('feedback').innerHTML = '🍃 森林守護者拍了拍你（再試一次喔）';
        setTimeout(() => {
          btn.classList.remove('wrong');
        }, 850);
      }
    }

    nextQuestion();
  </script>
</body>
</html>
