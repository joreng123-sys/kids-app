<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>歡樂學習樂園 - 千題大容量版</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <link rel="icon" type="image/png" href="./apple-touch-icon.png">

  <style>
    :root {
      --primary: #5A3E85;
      --secondary: #8E6BB8;
      --card-bg: rgba(255, 255, 255, 0.96);
      --text: #264653;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      transform: translateZ(0);
      -webkit-transform: translateZ(0);
    }

    body {
      margin: 0;
      padding: 10px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", sans-serif;
      background: #EDE9FE;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .header-bar {
      width: 100%;
      max-width: 680px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      background: #FFFFFF;
      padding: 6px 14px;
      border-radius: 50px;
      border: 2px solid #D1C4E9;
    }

    .user-profile {
      font-size: 0.95rem;
      font-weight: 800;
      color: #3F2B63;
      cursor: pointer;
      background: #F3E8FF;
      padding: 6px 12px;
      border-radius: 20px;
      border: 1.5px solid #D8B4FE;
    }

    .top-action-btns {
      display: flex;
      gap: 6px;
    }

    .action-btn {
      background: #8E6BB8;
      color: white;
      border: none;
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 0.85rem;
      font-weight: 900;
      cursor: pointer;
    }

    .action-btn.gold { background: #E09F3E; }
    .action-btn.playing { background: #D946EF; }

    .level-bar {
      width: 100%;
      max-width: 680px;
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 8px;
      background: #FFFFFF;
      padding: 4px;
      border-radius: 22px;
      border: 2px solid #D1C4E9;
    }

    .level-btn {
      flex: 1;
      border: none;
      background: #F5F0FA;
      padding: 7px 4px;
      font-size: 0.88rem;
      font-weight: 800;
      color: #6B46C1;
      border-radius: 16px;
      cursor: pointer;
    }

    .level-btn.active {
      background: #6B46C1;
      color: white;
    }

    .header-nav {
      width: 100%;
      max-width: 680px;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      margin-bottom: 10px;
    }

    .nav-btn {
      padding: 8px 1px;
      font-size: 0.82rem;
      font-weight: 900;
      border: 1.5px solid #D1C4E9;
      border-radius: 14px;
      background: #FAF8FC;
      color: var(--text);
      cursor: pointer;
      text-align: center;
      white-space: nowrap;
    }

    .nav-btn.active {
      background: var(--primary);
      color: white;
      border-color: #3B2166;
    }

    .nav-btn.race-mode-btn {
      background: #8B5CF6;
      color: white;
      border-color: #6D28D9;
    }

    .card {
      background: var(--card-bg);
      width: 100%;
      max-width: 680px;
      border-radius: 30px;
      padding: 16px;
      border: 2.5px solid #D1C4E9;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 470px;
    }

    .score-container {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .score-board {
      font-size: 1.3rem;
      font-weight: 900;
      color: #D97706;
    }

    .deck-counter {
      font-size: 0.82rem;
      font-weight: 800;
      color: #7C3AED;
      background: #EDE9FE;
      padding: 3px 10px;
      border-radius: 12px;
    }

    .race-track-container {
      width: 100%;
      background: #E0F2FE;
      border: 2px solid #7DD3FC;
      border-radius: 20px;
      padding: 8px;
      margin-bottom: 12px;
      display: none;
    }

    .race-status-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      font-weight: 900;
      color: #0369A1;
      margin-bottom: 4px;
    }

    .race-lane {
      position: relative;
      height: 34px;
      background: #FFFFFF;
      border-radius: 16px;
      margin-bottom: 4px;
      border: 1px dashed #93C5FD;
      display: flex;
      align-items: center;
      padding: 0 4px;
      overflow: hidden;
    }

    .pony-runner {
      position: absolute;
      left: 2%;
      font-size: 1.35rem;
      transition: left 0.4s ease-out;
      display: flex;
      align-items: center;
    }

    .pony-name-tag {
      font-size: 0.7rem;
      font-weight: 900;
      margin-left: 2px;
      white-space: nowrap;
    }

    .question-box {
      width: 100%;
      min-height: 120px;
      background: #FAF5FF;
      border: 2.5px solid #D8B4FE;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 12px;
      margin-bottom: 14px;
    }

    .question-title {
      font-size: 2.1rem;
      font-weight: 900;
      color: #2F1E4B;
      margin: 0;
      text-align: center;
    }

    .audio-btn {
      background: #FFFFFF;
      color: #6B46C1;
      border: 1.5px solid #6B46C1;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 1rem;
      font-weight: 900;
      margin-top: 8px;
      cursor: pointer;
    }

    .options-grid {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    .option-btn {
      min-height: 85px;
      font-size: 1.5rem;
      font-weight: 900;
      border-radius: 22px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 6px 10px;
      text-align: center;
      border: 2.5px solid #DDD6FE;
      background: #FFFFFF;
      color: #374151;
    }

    .option-btn:active { background: #EDE9FE; }
    .option-btn.pic-mode { font-size: 2.6rem; }
    .option-btn.correct { background: #D1FAE5; border-color: #10B981; color: #065F46; }
    .option-btn.wrong { background: #FEE2E2; border-color: #EF4444; color: #991B1B; }

    .feedback-msg {
      font-size: 1.3rem;
      font-weight: 900;
      height: 32px;
      color: #6B46C1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
      padding: 16px;
    }

    .modal-card {
      background: white;
      width: 100%;
      max-width: 440px;
      border-radius: 26px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .rank-list { width: 100%; list-style: none; padding: 0; margin: 0 0 14px 0; }
    .rank-item { display: flex; justify-content: space-between; padding: 8px 12px; border-radius: 12px; margin-bottom: 6px; background: #F9FAFB; font-weight: 800; border: 1px solid #E5E7EB; }
    .rank-item.top-user { background: #FEF3CD; color: #92400E; }

    .close-modal-btn {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 16px;
      font-size: 1rem;
      font-weight: 900;
      cursor: pointer;
    }

    .race-result-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(43, 27, 69, 0.78);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 10000;
      padding: 20px;
    }
  </style>
</head>
<body onclick="ensureAudioResumed()">

  <div class="header-bar">
    <div class="user-profile" onclick="changePlayerName()">
      <span>🦄 <span id="player-name-display">小探險家</span> ✏️</span>
    </div>
    
    <div class="top-action-btns">
      <button class="action-btn gold" onclick="openLeaderboard()">🏆 堅果榜</button>
      <button class="action-btn" id="bgm-btn" onclick="toggleBGM()">🎵 音樂: 關閉</button>
    </div>
  </div>

  <div class="level-bar">
    <button class="level-btn" id="lvl-baby" onclick="switchLevel('baby')">🍼 幼兒先修</button>
    <button class="level-btn active" id="lvl-low" onclick="switchLevel('low')">🌱 低年級</button>
    <button class="level-btn" id="lvl-mid" onclick="switchLevel('mid')">🌿 中年級</button>
    <button class="level-btn" id="lvl-high" onclick="switchLevel('high')">🌳 高年級</button>
  </div>

  <div class="header-nav">
    <button class="nav-btn active" id="btn-math" onclick="switchSubject('math')">➕ 加減</button>
    <button class="nav-btn" id="btn-multiply" onclick="switchSubject('multiply')">✖️ 乘法</button>
    <button class="nav-btn" id="btn-chinese" onclick="switchSubject('chinese')">🌸 國語</button>
    <button class="nav-btn" id="btn-life" onclick="switchSubject('life')">🍃 生活</button>
    <button class="nav-btn" id="btn-nature" onclick="switchSubject('nature')">🔬 自然</button>
    <button class="nav-btn" id="btn-english" onclick="switchSubject('english')">🔤 英文</button>
    <button class="nav-btn race-mode-btn" id="btn-race" onclick="startRaceMode()">🏇 賽跑</button>
  </div>

  <div class="card">
    <div class="score-container">
      <div class="score-board">🌰 堅果數量: <span id="score">0</span> 顆</div>
      <div class="deck-counter" id="deck-status-tag">千題資料庫就緒</div>
    </div>
    
    <div class="race-track-container" id="race-track">
      <div class="race-status-header">
        <span>🏁 彩虹競速賽</span>
        <span id="race-counter">第 1 / 10 題</span>
      </div>
      <div class="race-lane" style="background:#F3E8FF;"><div class="pony-runner" id="pony-p1"><span>💜🦄</span><span class="pony-name-tag" id="p1-name">紫悅(我)</span></div></div>
      <div class="race-lane"><div class="pony-runner" id="pony-p2"><span>🩵🐎</span><span class="pony-name-tag">雲寶</span></div></div>
      <div class="race-lane"><div class="pony-runner" id="pony-p3"><span>💖🐴</span><span class="pony-name-tag">碧琪</span></div></div>
      <div class="race-lane"><div class="pony-runner" id="pony-p4"><span>🧡🐎</span><span class="pony-name-tag">嘉兒</span></div></div>
      <div class="race-lane"><div class="pony-runner" id="pony-p5"><span>💛🐴</span><span class="pony-name-tag">柔柔</span></div></div>
    </div>

    <div class="question-box">
      <div class="question-title" id="question">題目生成中...</div>
      <button class="audio-btn" id="audio-btn" style="display: none;" onclick="speakCurrentQuestion()">🔊 聽題目</button>
    </div>

    <div class="options-grid" id="options"></div>
    <div class="feedback-msg" id="feedback"></div>
  </div>

  <div class="modal-overlay" id="rank-modal" onclick="closeLeaderboard()">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-title">🏆 森林堅果英雄榜</div>
      <ul class="rank-list" id="rank-list-content"></ul>
      <button class="close-modal-btn" onclick="closeLeaderboard()">繼續冒險！</button>
    </div>
  </div>

  <div class="modal-overlay" id="race-result-modal">
    <div class="modal-card">
      <div style="font-size: 3rem;" id="race-trophy">🏆</div>
      <div style="font-size: 1.5rem; font-weight: 900; color: #E11D48; margin: 6px 0;" id="race-result-title">比賽結束！</div>
      <div style="font-size: 1rem; color: #4B5563; text-align: center; margin-bottom: 16px;" id="race-result-desc"></div>
      <button class="close-modal-btn" onclick="exitRaceMode()">領取獎勵返回</button>
    </div>
  </div>

  <script>
    let playerName = localStorage.getItem('kids_player_name') || '小寶貝';
    document.getElementById('player-name-display').innerText = playerName;

    let currentLevel = localStorage.getItem('kids_grade_level') || 'low';
    let currentSubject = 'math';
    let score = parseInt(localStorage.getItem('kids_stars') || '0', 10);
    document.getElementById('score').innerText = score;

    let currentAnswer = null;
    let isProcessing = false;

    // 🛡️ 本次開啟指紋註冊表（保證單次開啟絕不撞題）
    const sessionSeenHashes = new Set();
    let sessionCount = 0;

    function recordQuestion(hash) {
      sessionSeenHashes.add(hash);
      sessionCount++;
      document.getElementById('deck-status-tag').innerText = `本次挑戰：${sessionCount} 題不重複`;
    }

      // 2. 生活常識矩陣庫
      lifeTemplates: [

    // 賽跑狀態
    let isRaceMode = false;
    let raceQuestionIndex = 0;
    let ponyPositions = [2, 2, 2, 2, 2];

    function startRaceMode() {
      ensureAudioResumed();
      isRaceMode = true;
      raceQuestionIndex = 0;
      ponyPositions = [2, 2, 2, 2, 2];
      
      const navIds = ['math', 'multiply', 'chinese', 'life', 'nature', 'english'];
      navIds.forEach(s => {
        const btn = document.getElementById('btn-' + s);
        if (btn) btn.className = 'nav-btn';
      });
      document.getElementById('btn-race').className = 'nav-btn race-mode-btn active';
      document.getElementById('race-track').style.display = 'block';
      document.getElementById('p1-name').innerText = `${playerName}(我)`;
      updatePonyTracksUI();

      currentSubject = ['math', 'chinese', 'life', 'nature'][Math.floor(Math.random() * 4)];
      nextQuestion();
    }

    function exitRaceMode() {
      document.getElementById('race-result-modal').style.display = 'none';
      isRaceMode = false;
      document.getElementById('race-track').style.display = 'none';
      document.getElementById('btn-race').className = 'nav-btn race-mode-btn';
      switchSubject('math');
    }

    function updatePonyTracksUI() {
      for (let i = 1; i <= 5; i++) {
        document.getElementById(`pony-p${i}`).style.left = `${ponyPositions[i - 1]}%`;
      }
      document.getElementById('race-counter').innerText = `第 ${raceQuestionIndex + 1} / 10 題`;
    }

    function stepRacePonies(playerCorrect) {
      raceQuestionIndex++;
      ponyPositions[0] = Math.min(84, ponyPositions[0] + (playerCorrect ? 8.5 : 2.5));

      for (let i = 1; i < 5; i++) {
        const npcSuccess = Math.random() < 0.60;
        ponyPositions[i] = Math.min(84, ponyPositions[i] + (npcSuccess ? 8 : 2.5));
      }

      updatePonyTracksUI();

      if (raceQuestionIndex >= 10) {
        setTimeout(showRaceResults, 600);
        return true;
      }
      return false;
    }

    function showRaceResults() {
      const competitors = [
        { name: `${playerName}(紫悅)`, pos: ponyPositions[0], isPlayer: true },
        { name: "雲寶 🩵", pos: ponyPositions[1] },
        { name: "碧琪 💖", pos: ponyPositions[2] },
        { name: "蘋果嘉兒 🧡", pos: ponyPositions[3] },
        { name: "柔柔 💛", pos: ponyPositions[4] }
      ];
      competitors.sort((a, b) => b.pos - a.pos);
      const playerRank = competitors.findIndex(c => c.isPlayer) + 1;

      const trophyEl = document.getElementById('race-trophy');
      const titleEl = document.getElementById('race-result-title');
      const descEl = document.getElementById('race-result-desc');

      if (playerRank === 1) {
        trophyEl.innerText = "🥇";
        titleEl.innerText = "🎉 勇奪冠軍！紫悅第一名！";
        descEl.innerHTML = "表現太棒了！<br><b>獲得 5 顆堅果獎勵！</b>";
        score += 5;
      } else if (playerRank === 2) {
        trophyEl.innerText = "🥈";
        titleEl.innerText = "榮獲第二名！";
        descEl.innerHTML = "跑得非常快！<br><b>獲得 2 顆堅果！</b>";
        score += 2;
      } else {
        trophyEl.innerText = "🎖️";
        titleEl.innerText = `獲得第 ${playerRank} 名！`;
        descEl.innerHTML = "順利完賽！<br><b>獲得 1 顆堅果參賽獎！</b>";
        score += 1;
      }

      saveStats();
      document.getElementById('race-result-modal').style.display = 'flex';
    }

    function saveStats() {
      document.getElementById('score').innerText = score;
      localStorage.setItem('kids_stars', score.toString());
      try {
        let ranks = JSON.parse(localStorage.getItem('kids_global_ranks') || "{}");
        ranks[playerName] = score;
        localStorage.setItem('kids_global_ranks', JSON.stringify(ranks));
      } catch (e) {}
    }

    function changePlayerName() {
      let newName = prompt('請輸入小探險家名字：', playerName);
      if (newName && newName.trim()) {
        playerName = newName.trim();
        localStorage.setItem('kids_player_name', playerName);
        document.getElementById('player-name-display').innerText = playerName;
        saveStats();
      }
    }

    function openLeaderboard() {
      let list = [
        { name: "彩虹小馬紫悅 🦄", score: 85 },
        { name: "森林大龍貓 🌳", score: 60 },
        { name: "活潑小松鼠 🌰", score: 25 }
      ];
      try {
        let ranks = JSON.parse(localStorage.getItem('kids_global_ranks') || "{}");
        for (let [user, val] of Object.entries(ranks)) {
          if (user !== playerName) list.push({ name: `🌱 ${user}`, score: val });
        }
      } catch (e) {}

      list.push({ name: `${playerName} (我)`, score: score, isUser: true });
      list.sort((a, b) => b.score - a.score);

      const el = document.getElementById('rank-list-content');
      el.innerHTML = '';
      list.forEach((item, index) => {
        const li = document.createElement('li');
        li.className = `rank-item ${item.isUser ? 'top-user' : ''}`;
        li.innerHTML = `<span>第 ${index + 1} 名 ${item.name}</span><span>🌰 ${item.score} 顆</span>`;
        el.appendChild(li);
      });
      document.getElementById('rank-modal').style.display = 'flex';
    }

    function closeLeaderboard() {
      document.getElementById('rank-modal').style.display = 'none';
    }

    let cachedVoices = [];
    function reloadVoices() {
      if ('speechSynthesis' in window) cachedVoices = window.speechSynthesis.getVoices();
    }
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = reloadVoices;
      reloadVoices();
    }

    function speakCurrentQuestion() {
      ensureAudioResumed();
      if (!('speechSynthesis' in window) || !currentAnswer) return;
      try {
        window.speechSynthesis.cancel();
        if (currentSubject === 'english') {
          const u = new SpeechSynthesisUtterance(currentAnswer.word);
          if (!cachedVoices.length) reloadVoices();
          const usVoice = cachedVoices.find(v => (v.name.includes('Samantha') || v.name.includes('Ava') || v.name.includes('Alex')) && v.lang.startsWith('en'))
                       || cachedVoices.find(v => v.lang === 'en-US')
                       || cachedVoices.find(v => v.lang.startsWith('en'));
          if (usVoice) u.voice = usVoice;
          u.lang = 'en-US';
          u.rate = 0.82;
          window.speechSynthesis.speak(u);
        } else {
          let txt = currentAnswer.q;
          txt = txt.replace(/（\s*）|\(\s*\)/g, '什麼').replace('\n', '，');
          const u = new SpeechSynthesisUtterance(txt);
          if (!cachedVoices.length) reloadVoices();
          const twVoice = cachedVoices.find(v => v.lang === 'zh-TW');
          if (twVoice) u.voice = twVoice;
          u.lang = 'zh-TW';
          u.rate = 0.85;
          window.speechSynthesis.speak(u);
        }
      } catch (e) {}
    }

    let audioCtx = null;
    let isBgmPlaying = false;
    function getAudioContext() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      return audioCtx;
    }
    function ensureAudioResumed() {
      try {
        const ctx = getAudioContext();
        if (ctx.state === 'suspended') ctx.resume();
      } catch(e) {}
    }
    function toggleBGM() {
      ensureAudioResumed();
      const btn = document.getElementById('bgm-btn');
      isBgmPlaying = !isBgmPlaying;
      btn.innerText = isBgmPlaying ? '🎵 音樂: 播放中' : '🎵 龍貓音樂: 關閉';
      btn.className = isBgmPlaying ? 'action-btn playing' : 'action-btn';
    }

      else if (currentSubject === 'multiply') generateMultiplyProcedural();
      else if (currentSubject === 'chinese') generateChineseProcedural();
      else if (currentSubject === 'life') generateLifeProcedural();
      else if (currentSubject === 'nature') generateNatureProcedural();
      else if (currentSubject === 'english') generateEnglishProcedural();
    }

    // 1. 數學千題生成 (隨機算式)
    function generateMathProcedural() {
      document.getElementById('audio-btn').style.display = 'none';
      let a, b, isAdd, ans, hash;

      for (let t = 0; t < 100; t++) {
        isAdd = Math.random() > 0.5;
        if (currentLevel === 'baby') {
          a = Math.floor(Math.random() * 8) + 1;
          b = Math.floor(Math.random() * 5) + 1;
        } else if (currentLevel === 'low') {
          a = Math.floor(Math.random() * 35) + 5;
          b = Math.floor(Math.random() * 25) + 3;
        } else if (currentLevel === 'mid') {
          a = Math.floor(Math.random() * 85) + 15;
          b = Math.floor(Math.random() * 75) + 10;
        } else {
          a = Math.floor(Math.random() * 800) + 100;
          b = Math.floor(Math.random() * 700) + 50;
        }

        if (!isAdd && a < b) { const temp = a; a = b; b = temp; }
        ans = isAdd ? (a + b) : (a - b);
        hash = `math_${a}_${isAdd ? '+' : '-'}_${b}`;
        if (!sessionSeenHashes.has(hash)) break;
      }

      recordQuestion(hash);
      document.getElementById('question').innerText = `${a} ${isAdd ? '➕' : '➖'} ${b} ＝ ?`;
      currentAnswer = { q: `${a} ${isAdd ? '加' : '減'} ${b} 等於多少`, ans: ans };

      let options = [ans, ans + 1, Math.max(0, ans - 1), ans + 2];
      options = Array.from(new Set(options));
      while (options.length < 4) options.push(ans + options.length + 2);
      options.sort(() => Math.random() - 0.5);

      renderButtons(options, val => val === ans, false);
    }

    // 2. 乘法千題生成
    function generateMultiplyProcedural() {
      document.getElementById('audio-btn').style.display = 'none';
      let a, b, ans, hash;

      for (let t = 0; t < 100; t++) {
        if (currentLevel === 'high') {
          a = Math.floor(Math.random() * 18) + 11;
          b = Math.floor(Math.random() * 8) + 2;
        } else {
          a = Math.floor(Math.random() * 8) + 2;
          b = Math.floor(Math.random() * 9) + 1;
        }
        ans = a * b;
        hash = `mul_${a}x${b}`;
        if (!sessionSeenHashes.has(hash)) break;
      }

      recordQuestion(hash);
      document.getElementById('question').innerText = `${a} ✖️ ${b} ＝ ?`;
      currentAnswer = { q: `${a} 乘以 ${b} 等於多少`, ans: ans };

      let options = [ans, ans + a, Math.max(1, ans - a), ans + 2];
      options = Array.from(new Set(options));
      while (options.length < 4) options.push(ans + options.length * 3);
      options.sort(() => Math.random() - 0.5);

      renderButtons(options, val => val === ans, false);
    }

    // 3. 國語千題生成（部首、量詞、相反詞矩陣組合）
    function generateChineseProcedural() {
      if (currentLevel === 'baby') {
        const item = MATRIX_DATA.babyPics[Math.floor(Math.random() * MATRIX_DATA.babyPics.length)];
        recordQuestion('cn_baby_' + item.q);
        currentAnswer = item;
        document.getElementById('question').innerText = item.q;
        document.getElementById('audio-btn').style.display = 'inline-block';
        setTimeout(() => speakCurrentQuestion(), 60);

        let options = [...item.options].sort(() => Math.random() - 0.5);
        renderButtons(options, val => val === item.ans, true);
        return;
      }

      const roll = Math.random();
      let qText, correctAns, wrongChoices, hash;

      if (roll < 0.4) {
        // 部首題（寫 ➔ 宀 已徹底校正）
        const item = MATRIX_DATA.radicals[Math.floor(Math.random() * MATRIX_DATA.radicals.length)];
        qText = `「${item.c}」的部首是什麼？`;
        correctAns = item.r;
        wrongChoices = item.w;
        hash = 'cn_rad_' + item.c;
      } else if (roll < 0.75) {
        // 量詞題
        const item = MATRIX_DATA.quantifiers[Math.floor(Math.random() * MATRIX_DATA.quantifiers.length)];
        qText = `一（ ）${item.n}`;
        correctAns = item.a;
        wrongChoices = item.w;
        hash = 'cn_quant_' + item.n;
      } else {
        // 相反詞題 (動態生成隨機干擾項)
        const target = MATRIX_DATA.opposites[Math.floor(Math.random() * MATRIX_DATA.opposites.length)];
        qText = `「${target.w}」的相反詞是？`;
        correctAns = target.a;
        const otherOpposites = MATRIX_DATA.opposites.filter(it => it.a !== target.a).map(it => it.a);
        otherOpposites.sort(() => Math.random() - 0.5);
        wrongChoices = [otherOpposites[0], otherOpposites[1], otherOpposites[2]];
        hash = 'cn_opp_' + target.w;
      }

      recordQuestion(hash);
      currentAnswer = { q: qText, ans: correctAns };
      document.getElementById('question').innerText = qText;
      document.getElementById('audio-btn').style.display = 'inline-block';
      setTimeout(() => speakCurrentQuestion(), 60);

      let options = [correctAns, ...wrongChoices].sort(() => Math.random() - 0.5);
      renderButtons(options, val => val === correctAns, false);
    }

    // 4. 生活常識千題生成 (情境矩陣)
    function generateLifeProcedural() {
      const template = MATRIX_DATA.lifeTemplates[Math.floor(Math.random() * MATRIX_DATA.lifeTemplates.length)];
      recordQuestion('life_' + template.q);
      currentAnswer = { q: template.q, ans: template.a };
      document.getElementById('question').innerText = template.q;
      document.getElementById('audio-btn').style.display = 'inline-block';
      setTimeout(() => speakCurrentQuestion(), 60);

      let options = [...template.o].sort(() => Math.random() - 0.5);
      renderButtons(options, val => val === template.a, false);
    }

    // 5. 自然科普千題生成
    function generateNatureProcedural() {
      const template = MATRIX_DATA.natureTemplates[Math.floor(Math.random() * MATRIX_DATA.natureTemplates.length)];
      recordQuestion('nature_' + template.q);
      currentAnswer = { q: template.q, ans: template.a };
      document.getElementById('question').innerText = template.q;
      document.getElementById('audio-btn').style.display = 'inline-block';
      setTimeout(() => speakCurrentQuestion(), 60);

      let options = [...template.o].sort(() => Math.random() - 0.5);
      renderButtons(options, val => val === template.a, false);
    }

    // 6. 生活英文千題組合 (萬種排列、真人美語發音)
    function generateEnglishProcedural() {
      document.getElementById('audio-btn').style.display = 'inline-block';
      const target = MATRIX_DATA.englishWords[Math.floor(Math.random() * MATRIX_DATA.englishWords.length)];
      recordQuestion('eng_' + target.en);
      currentAnswer = { word: target.en, zh: target.zh };
      document.getElementById('question').innerText = target.en;
      setTimeout(() => speakCurrentQuestion(), 60);

      const wrongs = MATRIX_DATA.englishWords.filter(it => it.en !== target.en).map(it => it.zh);
      wrongs.sort(() => Math.random() - 0.5);

      let options = [target.zh, wrongs[0], wrongs[1], wrongs[2]].sort(() => Math.random() - 0.5);
      renderButtons(options, val => val === target.zh, false);
    }

    function renderButtons(list, checkFn, isPicMode) {
      const box = document.getElementById('options');
      list.forEach(val => {
        const btn = document.createElement('button');
        btn.className = `option-btn ${isPicMode ? 'pic-mode' : ''}`;
        btn.innerText = val;
        btn.onclick = () => {
          ensureAudioResumed();
          handleChoice(btn, checkFn(val));
        };
        box.appendChild(btn);
      });
    }

    function handleChoice(btn, isCorrect) {
      if (isProcessing) return;

      if (isRaceMode) {
        isProcessing = true;
        if (isCorrect) {
          btn.classList.add('correct');
          document.getElementById('feedback').innerText = `⚡ 紫悅衝刺！`;
        } else {
          btn.classList.add('wrong');
          document.getElementById('feedback').innerText = `💨 慢速前進...`;
        }
        const raceOver = stepRacePonies(isCorrect);
        if (!raceOver) {
          currentSubject = ['math', 'chinese', 'life', 'nature'][Math.floor(Math.random() * 4)];
          setTimeout(() => nextQuestion(), 750);
        }
        return;
      }

      if (isCorrect) {
        isProcessing = true;
        btn.classList.add('correct');
        score += 1;
        saveStats();
        document.getElementById('feedback').innerText = `🎉 答對了！獲得1顆堅果 🌰`;
        setTimeout(() => nextQuestion(), 750);
      } else {
        btn.classList.add('wrong');
        if (score > 0) score -= 1;
        saveStats();
        document.getElementById('feedback').innerText = `🍂 答錯扣1顆堅果！再試一次！`;
        setTimeout(() => btn.classList.remove('wrong'), 700);
      }
    }

    switchLevel(currentLevel);
    saveStats();
    nextQuestion();
  </script>
</body>
