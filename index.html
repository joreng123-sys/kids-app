<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>歡樂學習樂園</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" sizes="180x180" href="https://img.icons8.com/color/180/my-little-pony.png">
  <link rel="icon" href="https://img.icons8.com/color/180/my-little-pony.png">

  <style>
    :root {
      --primary: #5A3E85;
      --secondary: #8E6BB8;
      --card-bg: rgba(255, 255, 255, 0.96);
      --text: #264653;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      transform: translateZ(0);
      -webkit-transform: translateZ(0);
    }

    body {
      margin: 0;
      padding: 10px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", sans-serif;
      background: #EDE9FE;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .header-bar {
      width: 100%;
      max-width: 680px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      background: #FFFFFF;
      padding: 6px 14px;
      border-radius: 50px;
      border: 2px solid #D1C4E9;
    }

    .user-profile {
      font-size: 0.95rem;
      font-weight: 800;
      color: #3F2B63;
      cursor: pointer;
      background: #F3E8FF;
      padding: 6px 12px;
      border-radius: 20px;
      border: 1.5px solid #D8B4FE;
    }

    .top-action-btns {
      display: flex;
      gap: 6px;
    }

    .action-btn {
      background: #8E6BB8;
      color: white;
      border: none;
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 0.85rem;
      font-weight: 900;
      cursor: pointer;
    }

    .action-btn.gold { background: #E09F3E; }
    .action-btn.playing { background: #D946EF; }

    .level-bar {
      width: 100%;
      max-width: 680px;
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 8px;
      background: #FFFFFF;
      padding: 4px;
      border-radius: 22px;
      border: 2px solid #D1C4E9;
    }

    .level-btn {
      flex: 1;
      border: none;
      background: #F5F0FA;
      padding: 7px 4px;
      font-size: 0.88rem;
      font-weight: 800;
      color: #6B46C1;
      border-radius: 16px;
      cursor: pointer;
    }

    .level-btn.active {
      background: #6B46C1;
      color: white;
    }

    .header-nav {
      width: 100%;
      max-width: 680px;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      margin-bottom: 10px;
    }

    .nav-btn {
      padding: 8px 1px;
      font-size: 0.82rem;
      font-weight: 900;
      border: 1.5px solid #D1C4E9;
      border-radius: 14px;
      background: #FAF8FC;
      color: var(--text);
      cursor: pointer;
      text-align: center;
      white-space: nowrap;
    }

    .nav-btn.active {
      background: var(--primary);
      color: white;
      border-color: #3B2166;
    }

    .nav-btn.race-mode-btn {
      background: #8B5CF6;
      color: white;
      border-color: #6D28D9;
    }

    .card {
      background: var(--card-bg);
      width: 100%;
      max-width: 680px;
      border-radius: 30px;
      padding: 16px;
      border: 2.5px solid #D1C4E9;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 470px;
    }

    .score-container {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .score-board {
      font-size: 1.3rem;
      font-weight: 900;
      color: #D97706;
    }

    /* 賽跑跑道 */
    .race-track-container {
      width: 100%;
      background: #E0F2FE;
      border: 2px solid #7DD3FC;
      border-radius: 20px;
      padding: 8px;
      margin-bottom: 12px;
      display: none;
    }

    .race-status-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      font-weight: 900;
      color: #0369A1;
      margin-bottom: 4px;
    }

    .race-lane {
      position: relative;
      height: 34px;
      background: #FFFFFF;
      border-radius: 16px;
      margin-bottom: 4px;
      border: 1px dashed #93C5FD;
      display: flex;
      align-items: center;
      padding: 0 4px;
      overflow: hidden;
    }

    .pony-runner {
      position: absolute;
      left: 2%;
      font-size: 1.35rem;
      transition: left 0.4s ease-out;
      display: flex;
      align-items: center;
    }

    .pony-name-tag {
      font-size: 0.7rem;
      font-weight: 900;
      margin-left: 2px;
      white-space: nowrap;
    }

    .question-box {
      width: 100%;
      min-height: 120px;
      background: #FAF5FF;
      border: 2.5px solid #D8B4FE;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 12px;
      margin-bottom: 14px;
    }

    .question-title {
      font-size: 2.1rem;
      font-weight: 900;
      color: #2F1E4B;
      margin: 0;
      text-align: center;
    }

    .audio-btn {
      background: #FFFFFF;
      color: #6B46C1;
      border: 1.5px solid #6B46C1;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 1rem;
      font-weight: 900;
      margin-top: 8px;
      cursor: pointer;
    }

    .options-grid {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    .option-btn {
      min-height: 85px;
      font-size: 1.5rem;
      font-weight: 900;
      border-radius: 22px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 6px 10px;
      text-align: center;
      border: 2.5px solid #DDD6FE;
      background: #FFFFFF;
      color: #374151;
    }

    .option-btn:active { background: #EDE9FE; }
    .option-btn.pic-mode { font-size: 2.6rem; }
    .option-btn.correct { background: #D1FAE5; border-color: #10B981; color: #065F46; }
    .option-btn.wrong { background: #FEE2E2; border-color: #EF4444; color: #991B1B; }

    .feedback-msg {
      font-size: 1.3rem;
      font-weight: 900;
      height: 32px;
      color: #6B46C1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 彈窗 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
      padding: 16px;
    }

    .modal-card {
      background: white;
      width: 100%;
      max-width: 440px;
      border-radius: 26px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .rank-list { width: 100%; list-style: none; padding: 0; margin: 0 0 14px 0; }
    .rank-item { display: flex; justify-content: space-between; padding: 8px 12px; border-radius: 12px; margin-bottom: 6px; background: #F9FAFB; font-weight: 800; border: 1px solid #E5E7EB; }
    .rank-item.top-user { background: #FEF3C7; color: #92400E; }

    .close-modal-btn {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 16px;
      font-size: 1rem;
      font-weight: 900;
      cursor: pointer;
    }
  </style>
</head>
<body onclick="ensureAudioResumed()">

  <div class="header-bar">
    <div class="user-profile" onclick="changePlayerName()">
      <span>🦄 <span id="player-name-display">小探險家</span> ✏️</span>
    </div>
    
    <div class="top-action-btns">
      <button class="action-btn gold" onclick="openLeaderboard()">🏆 堅果榜</button>
      <button class="action-btn" id="bgm-btn" onclick="toggleBGM()">🎵 音樂: 關閉</button>
    </div>
  </div>

  <div class="level-bar">
    <button class="level-btn" id="lvl-baby" onclick="switchLevel('baby')">🍼 幼兒先修</button>
    <button class="level-btn active" id="lvl-low" onclick="switchLevel('low')">🌱 低年級</button>
    <button class="level-btn" id="lvl-mid" onclick="switchLevel('mid')">🌿 中年級</button>
    <button class="level-btn" id="lvl-high" onclick="switchLevel('high')">🌳 高年級</button>
  </div>

  <div class="header-nav">
    <button class="nav-btn active" id="btn-math" onclick="switchSubject('math')">➕ 加減</button>
    <button class="nav-btn" id="btn-multiply" onclick="switchSubject('multiply')">✖️ 乘法</button>
    <button class="nav-btn" id="btn-chinese" onclick="switchSubject('chinese')">🌸 國語</button>
    <button class="nav-btn" id="btn-life" onclick="switchSubject('life')">🍃 生活</button>
    <button class="nav-btn" id="btn-nature" onclick="switchSubject('nature')">🔬 自然</button>
    <button class="nav-btn" id="btn-english" onclick="switchSubject('english')">🔤 英文</button>
    <button class="nav-btn race-mode-btn" id="btn-race" onclick="startRaceMode()">🏇 賽跑</button>
  </div>

  <div class="card">
    <div class="score-container">
      <div class="score-board">🌰 堅果數量: <span id="score">0</span> 顆</div>
    </div>
    
    <div class="race-track-container" id="race-track">
      <div class="race-status-header">
        <span>🏁 彩虹競速賽</span>
        <span id="race-counter">第 1 / 10 題</span>
      </div>
      <div class="race-lane" style="background:#F3E8FF;"><div class="pony-runner" id="pony-p1"><span>💜🦄</span><span class="pony-name-tag" id="p1-name">紫悅(我)</span></div></div>
      <div class="race-lane"><div class="pony-runner" id="pony-p2"><span>🩵🐎</span><span class="pony-name-tag">雲寶</span></div></div>
      <div class="race-lane"><div class="pony-runner" id="pony-p3"><span>💖🐴</span><span class="pony-name-tag">碧琪</span></div></div>
      <div class="race-lane"><div class="pony-runner" id="pony-p4"><span>🧡🐎</span><span class="pony-name-tag">嘉兒</span></div></div>
      <div class="race-lane"><div class="pony-runner" id="pony-p5"><span>💛🐴</span><span class="pony-name-tag">柔柔</span></div></div>
    </div>

    <div class="question-box">
      <div class="question-title" id="question">載入中...</div>
      <button class="audio-btn" id="audio-btn" style="display: none;" onclick="speakCurrentQuestion()">🔊 聽題目</button>
    </div>

    <div class="options-grid" id="options"></div>
    <div class="feedback-msg" id="feedback"></div>
  </div>

  <div class="modal-overlay" id="rank-modal" onclick="closeLeaderboard()">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-title">🏆 森林堅果英雄榜</div>
      <ul class="rank-list" id="rank-list-content"></ul>
      <button class="close-modal-btn" onclick="closeLeaderboard()">繼續冒險！</button>
    </div>
  </div>

  <div class="modal-overlay" id="race-result-modal">
    <div class="modal-card">
      <div style="font-size: 3rem;" id="race-trophy">🏆</div>
      <div style="font-size: 1.5rem; font-weight: 900; color: #E11D48; margin: 6px 0;" id="race-result-title">比賽結束！</div>
      <div style="font-size: 1rem; color: #4B5563; text-align: center; margin-bottom: 16px;" id="race-result-desc"></div>
      <button class="close-modal-btn" onclick="exitRaceMode()">領取獎勵返回</button>
    </div>
  </div>

  <script>
    let playerName = localStorage.getItem('kids_player_name') || '小寶貝';
    document.getElementById('player-name-display').innerText = playerName;

    let currentLevel = localStorage.getItem('kids_grade_level') || 'low';
    let currentSubject = 'math';
    let score = parseInt(localStorage.getItem('kids_stars') || '0', 10);
    document.getElementById('score').innerText = score;

    let currentAnswer = null;
    let isProcessing = false;

    // 賽跑變數
    let isRaceMode = false;
    let raceQuestionIndex = 0;
    let ponyPositions = [2, 2, 2, 2, 2];

    function startRaceMode() {
      ensureAudioResumed();
      isRaceMode = true;
      raceQuestionIndex = 0;
      ponyPositions = [2, 2, 2, 2, 2];
      
      const navIds = ['math', 'multiply', 'chinese', 'life', 'nature', 'english'];
      navIds.forEach(s => {
        const btn = document.getElementById('btn-' + s);
        if (btn) btn.className = 'nav-btn';
      });
      document.getElementById('btn-race').className = 'nav-btn race-mode-btn active';
      document.getElementById('race-track').style.display = 'block';
      document.getElementById('p1-name').innerText = `${playerName}(我)`;
      updatePonyTracksUI();

      currentSubject = ['math', 'chinese', 'life', 'nature'][Math.floor(Math.random() * 4)];
      nextQuestion();
    }

    function exitRaceMode() {
      document.getElementById('race-result-modal').style.display = 'none';
      isRaceMode = false;
      document.getElementById('race-track').style.display = 'none';
      document.getElementById('btn-race').className = 'nav-btn race-mode-btn';
      switchSubject('math');
    }

    function updatePonyTracksUI() {
      for (let i = 1; i <= 5; i++) {
        document.getElementById(`pony-p${i}`).style.left = `${ponyPositions[i - 1]}%`;
      }
      document.getElementById('race-counter').innerText = `第 ${raceQuestionIndex + 1} / 10 題`;
    }

    function stepRacePonies(playerCorrect) {
      raceQuestionIndex++;
      ponyPositions[0] = Math.min(84, ponyPositions[0] + (playerCorrect ? 8.5 : 2.5));

      for (let i = 1; i < 5; i++) {
        const npcSuccess = Math.random() < 0.60;
        ponyPositions[i] = Math.min(84, ponyPositions[i] + (npcSuccess ? 8 : 2.5));
      }

      updatePonyTracksUI();

      if (raceQuestionIndex >= 10) {
        setTimeout(showRaceResults, 600);
        return true;
      }
      return false;
    }

    function showRaceResults() {
      const competitors = [
        { name: `${playerName}(紫悅)`, pos: ponyPositions[0], isPlayer: true },
        { name: "雲寶 🩵", pos: ponyPositions[1] },
        { name: "碧琪 💖", pos: ponyPositions[2] },
        { name: "蘋果嘉兒 🧡", pos: ponyPositions[3] },
        { name: "柔柔 💛", pos: ponyPositions[4] }
      ];
      competitors.sort((a, b) => b.pos - a.pos);
      const playerRank = competitors.findIndex(c => c.isPlayer) + 1;

      const trophyEl = document.getElementById('race-trophy');
      const titleEl = document.getElementById('race-result-title');
      const descEl = document.getElementById('race-result-desc');

      if (playerRank === 1) {
        trophyEl.innerText = "🥇";
        titleEl.innerText = "🎉 勇奪冠軍！紫悅第一名！";
        descEl.innerHTML = "表現太棒了！<br><b>獲得 5 顆堅果獎勵！</b>";
        score += 5;
      } else if (playerRank === 2) {
        trophyEl.innerText = "🥈";
        titleEl.innerText = "榮獲第二名！";
        descEl.innerHTML = "跑得非常快！<br><b>獲得 2 顆堅果！</b>";
        score += 2;
      } else {
        trophyEl.innerText = "🎖️";
        titleEl.innerText = `獲得第 ${playerRank} 名！`;
        descEl.innerHTML = "順利完賽！<br><b>獲得 1 顆堅果參賽獎！</b>";
        score += 1;
      }

      saveStats();
      document.getElementById('race-result-modal').style.display = 'flex';
    }

    function saveStats() {
      document.getElementById('score').innerText = score;
      localStorage.setItem('kids_stars', score.toString());
      try {
        let ranks = JSON.parse(localStorage.getItem('kids_global_ranks') || "{}");
        ranks[playerName] = score;
        localStorage.setItem('kids_global_ranks', JSON.stringify(ranks));
      } catch (e) {}
    }

    function changePlayerName() {
      let newName = prompt('請輸入小探險家名字：', playerName);
      if (newName && newName.trim()) {
        playerName = newName.trim();
        localStorage.setItem('kids_player_name', playerName);
        document.getElementById('player-name-display').innerText = playerName;
        saveStats();
      }
    }

    function openLeaderboard() {
      let list = [
        { name: "彩虹小馬紫悅 🦄", score: 85 },
        { name: "森林大龍貓 🌳", score: 60 },
        { name: "活潑小松鼠 🌰", score: 25 }
      ];
      try {
        let ranks = JSON.parse(localStorage.getItem('kids_global_ranks') || "{}");
        for (let [user, val] of Object.entries(ranks)) {
          if (user !== playerName) list.push({ name: `🌱 ${user}`, score: val });
        }
      } catch (e) {}

      list.push({ name: `${playerName} (我)`, score: score, isUser: true });
      list.sort((a, b) => b.score - a.score);

      const el = document.getElementById('rank-list-content');
      el.innerHTML = '';
      list.forEach((item, index) => {
        const li = document.createElement('li');
        li.className = `rank-item ${item.isUser ? 'top-user' : ''}`;
        li.innerHTML = `<span>第 ${index + 1} 名 ${item.name}</span><span>🌰 ${item.score} 顆</span>`;
        el.appendChild(li);
      });
      document.getElementById('rank-modal').style.display = 'flex';
    }

    function closeLeaderboard() {
      document.getElementById('rank-modal').style.display = 'none';
    }

    // 題庫
    const chineseDB = {
      baby: [
        { q: "「 ㄆ 」是什麼？", voice: "請找出 ㄆ 的東西", ans: "🍎", options: ["🍎", "🐶", "🚗", "🐟"] },
        { q: "「 ㄍ 」是什麼？", voice: "請找出 ㄍ 的東西", ans: "🐶", options: ["🐶", "🍎", "🐱", "⭐"] },
        { q: "「 ㄑ 」是什麼？", voice: "請找出 ㄑ 的東西", ans: "🚗", options: ["🚗", "🐟", "🐱", "🍉"] },
        { q: "「 ㄇ 」是什麼？", voice: "請找出 ㄇ 的東西", ans: "🐱", options: ["🐱", "🐶", "🍌", "🚗"] },
        { q: "「 ㄩˊ 」是什麼？", voice: "請找出 ㄩˊ 的東西", ans: "🐟", options: ["🐟", "🍎", "🚗", "🍉"] },
        { q: "「 ㄒ 」是什麼？", voice: "請找出 ㄒ 的東西", ans: "🍉", options: ["🍉", "🐶", "🍎", "🐱"] },
        { q: "「 ㄅ 」是什麼？", voice: "請找出 ㄅ 的東西", ans: "🍌", options: ["🍌", "🐱", "🐶", "🚗"] },
        { q: "「 ㄧㄤˊ 」是什麼？", voice: "請找出 ㄧㄤˊ 的東西", ans: "🐑", options: ["🐑", "🐶", "🐟", "🍎"] }
      ],
      low: [
        { q: "「河」的部首是什麼？", ans: "氵(水)", options: ["氵(水)", "木", "口", "日"] },
        { q: "「草」的部首是什麼？", ans: "艹(草)", options: ["艹(草)", "木", "日", "十"] },
        { q: "一（ ）花朵", ans: "朵", options: ["朵", "頭", "張", "隻"] },
        { q: "一（ ）小狗", ans: "隻", options: ["隻", "朵", "條", "本"] },
        { q: "一（ ）汽車", ans: "輛", options: ["輛", "本", "片", "把"] },
        { q: "「白」的相反詞是？", ans: "黑", options: ["黑", "紅", "亮", "高"] },
        { q: "「木」加「木」是？", ans: "林", options: ["林", "森", "本", "休"] }
      ],
      mid: [
        { q: "「守株待（ ）」填入動物名？", ans: "兔", options: ["兔", "牛", "羊", "鳥"] },
        { q: "「畫（ ）點睛」填入動物名？", ans: "龍", options: ["龍", "蛇", "馬", "虎"] },
        { q: "銀「行」的「行」讀音是？", ans: "ㄏㄤˊ", options: ["ㄏㄤˊ", "ㄒㄧㄥˊ", "ㄒㄧㄥˋ", "ㄏㄤˋ"] },
        { q: "一（ ）宏偉的橋梁", ans: "座", options: ["座", "面", "條", "架"] }
      ],
      high: [
        { q: "「破釜沉舟」代表什麼意思？", ans: "下定決心不留退路", options: ["下定決心不留退路", "打破飯鍋浪費糧食", "乘坐沉沒的船隻", "做事猶豫不決"] },
        { q: "「出類拔（ ）」形容超越同類？", ans: "萃", options: ["萃", "翠", "碎", "粹"] },
        { q: "「塞翁失馬，焉知非（ ）」？", ans: "福", options: ["福", "禍", "利", "吉"] }
      ]
    };

    const lifeDB = {
      baby: [
        { q: "看見紅燈應該怎麼做？", voice: "紅燈要怎麼辦呢", ans: "🛑 停下來", options: ["🛑 停下來", "🏃 快跑", "🙈 閉眼", "💃 跳舞"] },
        { q: "吃東西之前要先做什麼？", voice: "吃東西前要先洗手喔", ans: "🧼 用肥皂洗手", options: ["🧼 用肥皂洗手", "直接拿來吃", "擦在褲子上", "不用洗"] },
        { q: "不小心撞到別人要說什麼？", voice: "撞到人要說什麼呢", ans: "對不起", options: ["對不起", "謝謝你", "沒關係", "恭喜"] }
      ],
      low: [
        { q: "香蕉皮屬於哪一種垃圾？", ans: "廚餘", options: ["廚餘", "一般垃圾", "塑膠回收", "紙類回收"] },
        { q: "搭乘機車時必須佩戴什麼？", ans: "安全帽", options: ["安全帽", "太陽眼鏡", "毛線帽", "耳機"] }
      ],
      mid: [
        { q: "臺灣發生火災時要撥打哪一支電話？", ans: "119", options: ["119", "110", "113", "165"] }
      ],
      high: [
        { q: "在消費者保護法中，網購一般享幾天猶豫期？", ans: "7天", options: ["7天", "3天", "14天", "30天"] }
      ]
    };

    const natureDB = {
      baby: [
        { q: "小狗有幾隻腳？", voice: "小狗有幾隻腳呢", ans: "4 隻", options: ["4 隻", "2 隻", "6 隻", "8 隻"] },
        { q: "白天在天空上發光的是？", voice: "白天天上發光的是誰呢", ans: "☀️ 太陽", options: ["☀️ 太陽", "🌙 月亮", "⭐ 星星", "💡 路燈"] }
      ],
      low: [
        { q: "昆蟲通常有幾隻腳？", ans: "6隻", options: ["6隻", "8隻", "4隻", "10隻"] },
        { q: "植物製造養分主要依賴什麼作用？", ans: "光合作用", options: ["光合作用", "呼吸作用", "消化作用", "蒸發作用"] }
      ],
      mid: [
        { q: "月亮每個月圓缺一次的週期約為？", ans: "約30天(一個月)", options: ["約30天(一個月)", "約7天", "約100天", "約365天"] }
      ],
      high: [
        { q: "地球繞太陽公轉一周的時間約是？", ans: "一年(約365天)", options: ["一年(約365天)", "一天(24小時)", "一個月", "十年"] }
      ]
    };

    const englishDB = {
      baby: [
        { word: "Cat", zh: "🐱 貓咪" }, { word: "Dog", zh: "🐶 狗狗" }, { word: "Apple", zh: "🍎 蘋果" },
        { word: "Egg", zh: "🥚 雞蛋" }, { word: "Duck", zh: "🦆 鴨子" }, { word: "Sun", zh: "☀️ 太陽" },
        { word: "Fish", zh: "🐟 小魚" }, { word: "Car", zh: "🚗 汽車" }, { word: "Star", zh: "⭐ 星星" }
      ],
      low: [
        { word: "Book", zh: "書本" }, { word: "Star", zh: "星星" }, { word: "Fish", zh: "小魚" },
        { word: "Bird", zh: "小鳥" }, { word: "Car", zh: "汽車" }, { word: "Milk", zh: "牛奶" },
        { word: "Hand", zh: "手" }, { word: "Eye", zh: "眼睛" }, { word: "Tree", zh: "大樹" }
      ],
      mid: [
        { word: "Teacher", zh: "老師" }, { word: "Student", zh: "學生" }, { word: "School", zh: "學校" },
        { word: "Summer", zh: "夏天" }, { word: "Doctor", zh: "醫生" }, { word: "Rainy", zh: "下雨的" },
        { word: "Friend", zh: "朋友" }, { word: "Family", zh: "家庭" }, { word: "Water", zh: "水" }
      ],
      high: [
        { word: "Brave", zh: "勇敢的" }, { word: "Honest", zh: "誠實的" }, { word: "Nature", zh: "大自然" },
        { word: "Protect", zh: "保護" }, { word: "Planet", zh: "行星/地球" }, { word: "Future", zh: "未來" }
      ]
    };

    function switchLevel(level) {
      currentLevel = level;
      localStorage.setItem('kids_grade_level', level);
      document.getElementById('lvl-baby').className = `level-btn ${level === 'baby' ? 'active' : ''}`;
      document.getElementById('lvl-low').className = `level-btn ${level === 'low' ? 'active' : ''}`;
      document.getElementById('lvl-mid').className = `level-btn ${level === 'mid' ? 'active' : ''}`;
      document.getElementById('lvl-high').className = `level-btn ${level === 'high' ? 'active' : ''}`;
      nextQuestion();
    }

    function switchSubject(subject) {
      ensureAudioResumed();
      isRaceMode = false;
      document.getElementById('race-track').style.display = 'none';
      currentSubject = subject;
      const navIds = ['math', 'multiply', 'chinese', 'life', 'nature', 'english'];
      navIds.forEach(s => {
        const btn = document.getElementById('btn-' + s);
        if (btn) btn.className = `nav-btn ${subject === s ? 'active' : ''}`;
      });
      document.getElementById('btn-race').className = 'nav-btn race-mode-btn';
      nextQuestion();
    }

    // 👉 關鍵優化：把括號自動唸成「什麼」
    function speakCurrentQuestion() {
      ensureAudioResumed();
      if (!('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        if (currentSubject === 'english' && currentAnswer) {
          const u = new SpeechSynthesisUtterance(currentAnswer.word);
          u.lang = 'en-US';
          u.rate = 0.8;
          window.speechSynthesis.speak(u);
        } else if (currentAnswer) {
          let txt = currentAnswer.voice || currentAnswer.q;
          txt = txt.replace(/（\s*）|\(\s*\)/g, '什麼')
                   .replace('\n', '，');

          const u = new SpeechSynthesisUtterance(txt);
          u.lang = 'zh-TW';
          u.rate = 0.85;
          window.speechSynthesis.speak(u);
        }
      } catch (e) {}
    }

    let audioCtx = null;
    let isBgmPlaying = false;

    function getAudioContext() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      return audioCtx;
    }

    function ensureAudioResumed() {
      try {
        const ctx = getAudioContext();
        if (ctx.state === 'suspended') ctx.resume();
      } catch(e) {}
    }

    function toggleBGM() {
      ensureAudioResumed();
      const btn = document.getElementById('bgm-btn');
      isBgmPlaying = !isBgmPlaying;
      btn.innerText = isBgmPlaying ? '🎵 音樂: 播放中' : '🎵 龍貓音樂: 關閉';
      btn.className = isBgmPlaying ? 'action-btn playing' : 'action-btn';
    }

    // 出題邏輯
    function nextQuestion() {
      isProcessing = false;
      document.getElementById('feedback').innerText = '';
      const box = document.getElementById('options');
      box.innerHTML = '';

      if (currentSubject === 'math') generateMathQuestion();
      else if (currentSubject === 'multiply') generateMultiplyQuestion();
      else if (currentSubject === 'chinese') generateGenericQuestion(chineseDB, 'chinese');
      else if (currentSubject === 'life') generateGenericQuestion(lifeDB, 'life');
      else if (currentSubject === 'nature') generateGenericQuestion(natureDB, 'nature');
      else if (currentSubject === 'english') generateEnglishQuestion();
    }

    function generateMathQuestion() {
      document.getElementById('audio-btn').style.display = 'none';
      const a = Math.floor(Math.random() * 8) + 2;
      const b = Math.floor(Math.random() * 8) + 1;
      const ans = a + b;
      document.getElementById('question').innerText = `${a} ➕ ${b} ＝ ?`;
      currentAnswer = ans;

      let options = [ans, ans + 1, ans - 1 >= 0 ? ans - 1 : ans + 2, ans + 3];
      options.sort(() => Math.random() - 0.5);
      renderButtons(options, val => val === currentAnswer, false);
    }

    function generateMultiplyQuestion() {
      document.getElementById('audio-btn').style.display = 'none';
      const a = Math.floor(Math.random() * 8) + 2;
      const b = Math.floor(Math.random() * 9) + 1;
      const ans = a * b;
      document.getElementById('question').innerText = `${a} ✖️ ${b} ＝ ?`;
      currentAnswer = ans;

      let options = [ans, ans + a, ans - a > 0 ? ans - a : ans + 2, ans + 1];
      options.sort(() => Math.random() - 0.5);
      renderButtons(options, val => val === currentAnswer, false);
    }

    function generateGenericQuestion(database, subjectName) {
      const list = database[currentLevel] || database['low'];
      const qData = list[Math.floor(Math.random() * list.length)];
      currentAnswer = qData;
      document.getElementById('question').innerText = qData.q;
      document.getElementById('audio-btn').style.display = 'inline-block';
      setTimeout(() => speakCurrentQuestion(), 100);

      const isBabyPic = (currentLevel === 'baby' && subjectName === 'chinese');
      const options = [...qData.options].sort(() => Math.random() - 0.5);
      renderButtons(options, val => val === currentAnswer.ans, isBabyPic);
    }

    function generateEnglishQuestion() {
      document.getElementById('audio-btn').style.display = 'inline-block';
      const list = englishDB[currentLevel] || englishDB['low'];
      const targetIndex = Math.floor(Math.random() * list.length);
      const item = list[targetIndex];
      currentAnswer = item;
      document.getElementById('question').innerText = item.word;
      setTimeout(() => speakCurrentQuestion(), 100);

      const others = list.filter((_, idx) => idx !== targetIndex).sort(() => Math.random() - 0.5);
      let options = [item.zh];
      for (let i = 0; i < others.length && options.length < 4; i++) {
        options.push(others[i].zh);
      }
      options.sort(() => Math.random() - 0.5);
      renderButtons(options, val => val === currentAnswer.zh, false);
    }

    function renderButtons(list, checkFn, isPicMode) {
      const box = document.getElementById('options');
      list.forEach(val => {
        const btn = document.createElement('button');
        btn.className = `option-btn ${isPicMode ? 'pic-mode' : ''}`;
        btn.innerText = val;
        btn.onclick = () => {
          ensureAudioResumed();
          handleChoice(btn, checkFn(val));
        };
        box.appendChild(btn);
      });
    }

    function handleChoice(btn, isCorrect) {
      if (isProcessing) return;

      if (isRaceMode) {
        isProcessing = true;
        if (isCorrect) {
          btn.classList.add('correct');
          document.getElementById('feedback').innerText = `⚡ 紫悅衝刺！`;
        } else {
          btn.classList.add('wrong');
          document.getElementById('feedback').innerText = `💨 慢速前進...`;
        }
        const raceOver = stepRacePonies(isCorrect);
        if (!raceOver) {
          currentSubject = ['math', 'chinese', 'life', 'nature'][Math.floor(Math.random() * 4)];
          setTimeout(() => nextQuestion(), 800);
        }
        return;
      }

      if (isCorrect) {
        isProcessing = true;
        btn.classList.add('correct');
        score += 1;
        saveStats();
        document.getElementById('feedback').innerText = `🎉 答對了！獲得1顆堅果 🌰`;
        setTimeout(() => nextQuestion(), 800);
      } else {
        btn.classList.add('wrong');
        if (score > 0) score -= 1;
        saveStats();
        document.getElementById('feedback').innerText = `🍂 答錯扣1顆堅果！再試一次！`;
        setTimeout(() => btn.classList.remove('wrong'), 700);
      }
    }

    switchLevel(currentLevel);
    saveStats();
  </script>
</body>
</html>
